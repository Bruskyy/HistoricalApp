<title>Mneme — Protótipo da primeira sessão</title>
<style>
  :root {
    --paper: #F2EBDC; --paper-raised: #FAF5EA; --paper-deep: #E7DDC8;
    --ink: #20293C; --ink-soft: #5A6273; --ink-faint: #8B90A0;
    --gold: #B8892F; --gold-soft: #D9C08A; --era: #2E7D74; --era-soft: #BFD8D3;
    --flame: #D98E2B; --annotate: #8A5A3B; --line: #D8CCB4;
    --shadow: 0 1px 2px rgba(32,41,60,.06), 0 6px 24px rgba(32,41,60,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151A26; --paper-raised: #1E2534; --paper-deep: #10141E;
      --ink: #E9E2D0; --ink-soft: #A8AEBE; --ink-faint: #767C8C;
      --gold: #D4A64A; --gold-soft: #6B5626; --era: #4FA396; --era-soft: #24443F;
      --flame: #E9A23B; --annotate: #C89A6B; --line: #2C3446;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --paper: #F2EBDC; --paper-raised: #FAF5EA; --paper-deep: #E7DDC8;
    --ink: #20293C; --ink-soft: #5A6273; --ink-faint: #8B90A0;
    --gold: #B8892F; --gold-soft: #D9C08A; --era: #2E7D74; --era-soft: #BFD8D3;
    --flame: #D98E2B; --annotate: #8A5A3B; --line: #D8CCB4;
    --shadow: 0 1px 2px rgba(32,41,60,.06), 0 6px 24px rgba(32,41,60,.07);
  }
  :root[data-theme="dark"] {
    --paper: #151A26; --paper-raised: #1E2534; --paper-deep: #10141E;
    --ink: #E9E2D0; --ink-soft: #A8AEBE; --ink-faint: #767C8C;
    --gold: #D4A64A; --gold-soft: #6B5626; --era: #4FA396; --era-soft: #24443F;
    --flame: #E9A23B; --annotate: #C89A6B; --line: #2C3446;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper-deep); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 40px;
  }
  .phone {
    width: 100%; max-width: 430px; background: var(--paper);
    border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
    display: flex; flex-direction: column; min-height: 92vh;
    border: 1px solid var(--line);
  }
  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--line);
  }
  .brand { font-family: Georgia, 'Iowan Old Style', serif; font-size: 18px; letter-spacing: .04em; }
  .brand small { color: var(--ink-faint); font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; display: block; }
  .xp-chip {
    font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
    background: var(--paper-raised);
  }
  main { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

  .eyebrow { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 2px; }
  h1, h2 { font-family: Georgia, 'Iowan Old Style', serif; margin: 0; text-wrap: balance; font-weight: 600; }
  h1 { font-size: 24px; line-height: 1.25; }
  h2 { font-size: 19px; line-height: 1.3; }
  p { line-height: 1.62; margin: 0; font-size: 15.5px; }
  .serif { font-family: Georgia, 'Iowan Old Style', serif; }

  .card {
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }

  .journey-head { border-left: 3px solid var(--gold); }
  .journey-head .q { font-family: Georgia, serif; font-size: 16.5px; line-height: 1.45; }
  .journey-head .prog { font-size: 12px; color: var(--ink-faint); }

  .thoth-row { display: flex; gap: 12px; align-items: flex-start; }
  .thoth {
    flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%;
    background: var(--era-soft); display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--era); font-size: 22px;
  }
  .thoth-say { flex: 1; font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; padding-top: 4px; font-style: italic; }
  .thoth.bounce { animation: bounce .7s ease; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} 60%{transform:translateY(2px)} }

  .era-row { display: flex; gap: 14px; min-height: 60px; }
  .rail { width: 34px; display: flex; flex-direction: column; align-items: center; }
  .rail .seg { flex: 1; width: 3px; background: var(--line); }
  .node-dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--paper-raised);
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    color: var(--ink-faint); flex: 0 0 auto;
  }
  .era-row.sealed .node-dot { background: var(--paper-deep); }
  .era-row.open .node-dot { border-color: var(--era); color: var(--era); }
  .era-row.lit .node-dot { border-color: var(--flame); background: var(--gold-soft); }
  .era-info { flex: 1; padding: 4px 0 16px; }
  .era-name { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .era-row.open .era-name, .era-row.lit .era-name { color: var(--era); }
  .node-card {
    margin-top: 6px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    transition: transform .15s ease;
  }
  .node-card:hover { transform: translateY(-1px); }
  .node-card .nm { font-family: Georgia, serif; font-size: 15.5px; }
  .node-card .st { font-size: 11px; color: var(--ink-faint); }
  .node-card.lit { border-color: var(--flame); cursor: default; }
  .node-card.lit .st { color: var(--flame); }
  .sealed-note { font-size: 13px; color: var(--ink-faint); font-style: italic; padding: 8px 0 0; }
  .flame.on { animation: flicker 1.8s infinite ease-in-out; }
  @keyframes flicker { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.75; transform:scale(.92)} }

  .opt {
    text-align: left; width: 100%;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 13px 14px; font-size: 15px; color: var(--ink); cursor: pointer;
    font-family: inherit; line-height: 1.45;
    transition: border-color .15s ease, transform .1s ease;
  }
  .opt:hover { border-color: var(--era); transform: translateY(-1px); }
  .opt.picked-right { border-color: var(--era); background: var(--era-soft); }
  .opt.picked-annotate { border-color: var(--annotate); }
  .opt:disabled { cursor: default; opacity: .55; }
  .opt.picked-right:disabled, .opt.picked-annotate:disabled { opacity: 1; }
  .annotation {
    border-left: 3px solid var(--annotate); padding: 10px 14px;
    font-size: 14.5px; color: var(--ink-soft);
    background: color-mix(in srgb, var(--annotate) 7%, transparent);
    border-radius: 0 10px 10px 0; line-height: 1.6;
  }
  .annotation b { color: var(--annotate); font-weight: 600; }
  .stamp {
    align-self: flex-end; font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--gold); letter-spacing: .06em;
    animation: stamp .5s ease;
  }
  @keyframes stamp { 0%{opacity:0; transform:scale(1.6)} 100%{opacity:1; transform:scale(1)} }

  .chip {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; background: var(--paper);
  }
  .consensus-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .consensus-badge .pct { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--gold); font-size: 15px; }
  .debate-btn {
    background: none; border: none; color: var(--era); font-size: 14px;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
    padding: 0; font-family: inherit; text-align: left;
  }
  .debate-panel { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .position { font-size: 14px; line-height: 1.55; color: var(--ink); }
  .position .acc { display: block; font-size: 11.5px; color: var(--ink-faint); letter-spacing: .05em; text-transform: uppercase; margin-top: 2px; }

  .connections { display: flex; flex-direction: column; gap: 7px; }
  .connections .cx { display: flex; gap: 9px; font-size: 15px; align-items: baseline; opacity: 0; animation: rise .5s ease forwards; }
  .connections .cx .tick { color: var(--era); font-weight: 700; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .cta {
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 12px; padding: 15px 18px;
    font-size: 15.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    letter-spacing: .02em; transition: transform .12s ease;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta.gold { background: var(--gold); color: #fff; }
  .cta.ghost { background: none; color: var(--ink-soft); border: 1.5px solid var(--line); font-weight: 500; }

  .celebrate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 22px 12px; }
  .big-flame { font-size: 54px; animation: ignite 1.1s ease; }
  @keyframes ignite { 0%{transform:scale(.2); opacity:0} 55%{transform:scale(1.25)} 100%{transform:scale(1); opacity:1} }
  .fade-in { opacity: 0; animation: rise .6s ease forwards; }

  .jcard {
    width: 100%; border: 1.5px solid var(--gold); border-radius: 16px;
    background: var(--paper-raised); padding: 20px 18px;
    display: flex; flex-direction: column; gap: 12px; text-align: center;
  }
  .jcard .jt { font-family: Georgia, serif; font-size: 20px; font-weight: 600; }
  .jcard .thread { font-size: 13.5px; color: var(--ink-soft); letter-spacing: .02em; }
  .jcard .stats { display: flex; justify-content: center; gap: 18px; }
  .jcard .stat { display: flex; flex-direction: column; gap: 2px; }
  .jcard .stat b { font-size: 18px; font-variant-numeric: tabular-nums; color: var(--gold); }
  .jcard .stat span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }

  .progress-track { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 0 18px; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width .5s ease; }
  footer.note { text-align: center; font-size: 11px; color: var(--ink-faint); padding: 12px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .connections .cx, .fade-in { opacity: 1 !important; }
  }
</style>

<div class="phone">
  <header class="bar">
    <div class="brand">Mneme<small>protótipo · jornada completa</small></div>
    <div class="xp-chip" id="xpChip" hidden>0 XP</div>
  </header>
  <div class="progress-track" id="ptrack" hidden><div class="progress-fill" id="pfill" style="width:0%"></div></div>
  <main id="screen"></main>
  <footer class="note">Gerado de <code>content/</code> pelo pipeline editorial · celebração na ordem do GDD §9 · nenhum dado sai desta página</footer>
</div>

<script>
'use strict';

/* Conteúdo compilado, injetado por tools/build-prototype.ts — NÃO editar à mão. */
const PACKAGE = __PACKAGE_JSON__;

const JOURNEY = PACKAGE.journeys[0];
const NODES = JOURNEY.nodeOrder.map((id) => PACKAGE.nodes.find((n) => n.id === id));
const SEALED_BEFORE = ['Pré-História', 'Mesopotâmia', 'Egito'];

const CONNECTION_LABELS = Object.fromEntries(
  PACKAGE.nodes.map((n) => [n.id, n.name]),
);
const prettify = (slug) =>
  CONNECTION_LABELS[slug] ??
  slug.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase())
      .replace('Constituicao Brasileira 1988', 'Constituição de 1988');

/* ---------- estado ---------- */
const S = {
  xp: 0,
  lit: {},           // nodeId -> true
  lessonsDone: {},   // nodeId -> n
  nodeXp: 0,
};

const $ = (id) => document.getElementById(id);
const screen = () => $('screen');

function setProgress(pct) {
  $('ptrack').hidden = pct === null;
  if (pct !== null) $('pfill').style.width = pct + '%';
}
function refreshXp() {
  $('xpChip').hidden = S.xp === 0;
  $('xpChip').textContent = S.xp + ' XP';
}
function gainXp(n, host) {
  S.xp += n; S.nodeXp += n; refreshXp();
  if (host) {
    const el = document.createElement('div');
    el.className = 'stamp'; el.textContent = '+' + n;
    host.appendChild(el);
  }
}
function thoth(text, bounce = false) {
  return `<div class="thoth-row">
    <div class="thoth ${bounce ? 'bounce' : ''}">📜</div>
    <div class="thoth-say">${text}</div>
  </div>`;
}
const litCount = () => NODES.filter((n) => S.lit[n.id]).length;

/* ---------- Corredor ---------- */
function renderCorridor() {
  setProgress(null);
  const done = litCount();
  const allLit = done === NODES.length;
  const say = allLit
    ? 'O fio inteiro está aceso, Guardião. Atenas, Roma… e o eco chega até você. Descansa — eu vigio as chamas.'
    : done === 0
      ? 'Bem-vindo ao Corredor do Tempo, Guardião. Os salões estão apagados — mas encontrei uma porta aberta na Grécia. Vamos?'
      : 'A Grécia está acesa… e olha: a porta de Roma acabou de se abrir. Ela conhecia Atenas. E discordou.';

  let rows = SEALED_BEFORE.map((era) => eraRow(era, 'sealed')).join('');

  NODES.forEach((node, i) => {
    const lit = !!S.lit[node.id];
    const locked = i > 0 && !S.lit[NODES[i - 1].id];
    if (locked) {
      rows += eraRow(node.place, 'sealed',
        `<div class="sealed-note">selada — acende quando ${NODES[i - 1].place} estiver iluminada</div>`);
      return;
    }
    const doneLessons = S.lessonsDone[node.id] ?? 0;
    const status = lit
      ? 'Compreendido · chama acesa · revisão em 3 dias'
      : doneLessons > 0
        ? `Lição ${doneLessons + 1} de ${node.lessons.length} · continuar`
        : `Missão · lição 1 de ${node.lessons.length}`;
    rows += eraRow(node.place, lit ? 'lit' : 'open', `
      <div class="node-card ${lit ? 'lit' : ''}" data-node="${node.id}" role="button" tabindex="0" aria-label="${node.name}">
        <div>
          <div class="nm">${node.name}</div>
          <div class="st">${status}</div>
        </div>
        <div class="flame ${lit ? 'on' : ''}" style="font-size:22px">${lit ? '🔥' : '🕯️'}</div>
      </div>`);
  });

  rows += eraRow('Iluminismo', 'sealed',
    `<div class="sealed-note">${allLit ? JOURNEY.comingNext : 'selada'}</div>`);

  screen().innerHTML = `
    ${thoth(say, allLit)}
    <div class="card journey-head">
      <p class="eyebrow">jornada</p>
      <div class="q">${JOURNEY.centralQuestion}</div>
      <div class="prog">${JOURNEY.title} · ${done} de ${NODES.length} salões acesos</div>
    </div>
    <div role="list">${rows}</div>
    ${allLit ? '<button class="cta ghost" id="againBtn">recomeçar o protótipo</button>' : ''}
  `;

  screen().querySelectorAll('.node-card:not(.lit)').forEach((card) => {
    const go = () => startNode(card.dataset.node);
    card.addEventListener('click', go);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') go(); });
  });
  const again = $('againBtn');
  if (again) again.addEventListener('click', () => {
    Object.assign(S, { xp: 0, lit: {}, lessonsDone: {}, nodeXp: 0 });
    refreshXp(); renderCorridor();
  });
}

function eraRow(name, state, inner = '') {
  return `<div class="era-row ${state}" role="listitem">
    <div class="rail"><div class="node-dot">${state === 'lit' ? '🔥' : state === 'open' ? '◈' : '·'}</div><div class="seg"></div></div>
    <div class="era-info"><div class="era-name">${name}</div>${inner}</div>
  </div>`;
}

/* ---------- player genérico de lição ---------- */
let steps = [], stepIx = 0;
function playSteps(list) { steps = list; stepIx = 0; nextStep(); }
function nextStep() {
  if (stepIx >= steps.length) return;
  const step = steps[stepIx++];
  setProgress(Math.round((stepIx / steps.length) * 100));
  step();
}
function stepScreen(html) { screen().innerHTML = html; screen().scrollTop = 0; }

function startNode(nodeId) {
  const node = NODES.find((n) => n.id === nodeId);
  startLesson(node, S.lessonsDone[node.id] ?? 0);
}

function startLesson(node, lessonIx) {
  const lesson = node.lessons[lessonIx];
  const eyebrow = `${node.place} · lição ${lessonIx + 1} de ${node.lessons.length}`;

  // Se a 1ª interação é decisão situada, ela vive junto do gancho —
  // o usuário age ANTES de qualquer explicação (LDD §3).
  const first = lesson.interactions[0];
  const hookDecision = first && first.type === 'situated_decision' ? first : null;
  const restInteractions = hookDecision ? lesson.interactions.slice(1) : lesson.interactions;

  const list = [];

  list.push(() => {
    stepScreen(`
      <p class="eyebrow">${eyebrow}</p>
      <h1>${lesson.title}</h1>
      <div class="card">
        <p class="serif">${lesson.hook}</p>
        ${hookDecision ? `<div id="hd"></div>` : ''}
      </div>
      ${hookDecision ? '' : '<button class="cta" id="go">continuar</button>'}`);
    if (hookDecision) renderSituated(hookDecision, $('hd'), nextStep);
    else $('go').addEventListener('click', nextStep);
  });

  for (const paragraph of lesson.narrative) {
    list.push(() => {
      stepScreen(`
        <p class="eyebrow">${eyebrow}</p>
        <div class="card"><p class="serif">${paragraph}</p></div>
        <button class="cta" id="go">continuar</button>`);
      $('go').addEventListener('click', nextStep);
    });
  }

  for (const inter of restInteractions) {
    list.push(() => {
      stepScreen(`<p class="eyebrow">${node.place} · ${interactionEyebrow(inter)}</p><div class="card" id="ic"></div>`);
      renderInteraction(inter, node, $('ic'), nextStep);
    });
  }

  list.push(() => {
    const lessonsDone = lessonIx + 1;
    S.lessonsDone[node.id] = lessonsDone;
    const last = lessonsDone >= node.lessons.length;
    stepScreen(`
      <p class="eyebrow">${node.place} · lição ${lessonsDone} concluída</p>
      <h2>Agora você entende melhor:</h2>
      <div class="card connections">
        ${lesson.connection.split('✔').map((x) => x.trim()).filter(Boolean)
          .map((x, i) => `<div class="cx" style="animation-delay:${0.1 + i * 0.35}s"><span class="tick">✔</span> ${x}</div>`).join('')}
      </div>
      <button class="cta ${last ? 'gold' : ''}" id="go">${last ? 'concluir o salão' : 'próxima lição'}</button>`);
    $('go').addEventListener('click', () =>
      last ? celebrateNode(node) : startLesson(node, lessonsDone));
  });

  playSteps(list);
}

function interactionEyebrow(inter) {
  return {
    causal: 'pergunta causal',
    counterfactual: 'e se…?',
    situated_decision: 'sua decisão',
    source_interpretation: 'a história em disputa',
    application: 'aplicação',
    causal_ordering: 'causa e efeito',
    connection: 'conexões',
  }[inter.type] ?? 'desafio';
}

function renderSituated(inter, host, onDone) {
  host.innerHTML = `
    <p><b>${inter.prompt}</b></p>
    ${(inter.options ?? []).map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
    <div id="sfb"></div>`;
  host.querySelectorAll('.opt').forEach((b) =>
    b.addEventListener('click', () => {
      host.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
      b.classList.add('picked-right');
      host.querySelector('#sfb').innerHTML = `
        <div class="annotation">${inter.errorPath}</div>
        <button class="cta" id="sgo">continuar</button>`;
      host.querySelector('#sgo').addEventListener('click', onDone);
    }));
}

function renderInteraction(inter, node, host, onDone) {
  const claim = node.claims.find((c) => c.id === inter.claimId);

  if (!inter.objective && claim && claim.debate) {
    host.innerHTML = `
      <span class="chip">Interpretação historiográfica</span>
      <p class="serif">${claim.debate.question}</p>
      <div class="consensus-badge">Nível de consenso <span class="pct">${claim.consensusPct}%</span></div>
      <button class="debate-btn" id="whyBtn">Por que existe debate sobre este assunto?</button>
      <div id="panel"></div>`;
    host.querySelector('#whyBtn').addEventListener('click', () => {
      host.querySelector('#panel').innerHTML = `
        <div class="debate-panel">
          ${claim.debate.positions.map((p) =>
            `<div class="position">${p.view}<span class="acc">${p.acceptance}</span></div>`).join('')}
          <button class="cta" id="dgo">fascinante — seguir</button>
        </div>`;
      host.querySelector('#dgo').addEventListener('click', onDone);
    });
    return;
  }

  if (!inter.objective) { renderSituated(inter, host, onDone); return; }

  let attempts = 0;
  host.innerHTML = `
    <p><b>${inter.prompt}</b></p>
    ${(inter.options ?? []).map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
    <div id="fb"></div>`;
  host.querySelectorAll('.opt').forEach((b) =>
    b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      const fb = host.querySelector('#fb');
      if (i === inter.correct) {
        host.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
        b.classList.add('picked-right');
        gainXp(attempts === 0 ? 10 : 5, fb); // GDD §5.1: recuperar vale, e vale menos
        fb.insertAdjacentHTML('beforeend', '<button class="cta" id="go">continuar</button>');
        host.querySelector('#go').addEventListener('click', onDone);
      } else {
        attempts++;
        b.classList.add('picked-annotate'); b.disabled = true;
        fb.innerHTML = `<div class="annotation"><b>Ainda não — e aqui está o porquê:</b> ${inter.errorPath} Tente de novo.</div>`;
      }
    }));
}

/* ---------- celebrações (ordem GDD §9) ---------- */
function celebrateNode(node) {
  S.lit[node.id] = true;
  setProgress(100);
  const isLast = litCount() === NODES.length;
  const say = litCount() === 1
    ? 'Nosso primeiro salão! Desenhei uma coluna grega no meu pergaminho. 🏛️'
    : 'Roma no pergaminho — uma águia ao lado da coluna. O fio está quase inteiro nas nossas mãos.';

  stepScreen(`
    <div class="celebrate">
      <div class="big-flame flame on">🔥</div>
      <h1 class="fade-in" style="animation-delay:.4s">${node.name}<br>acendeu no Corredor</h1>
      <div class="fade-in" style="animation-delay:1.1s; width:100%; text-align:left">${thoth(say, true)}</div>
      <div class="card connections fade-in" style="animation-delay:1.9s; width:100%; text-align:left">
        <p class="eyebrow">este conhecimento se conecta a</p>
        ${node.connections.map((c, i) =>
          `<div class="cx" style="animation-delay:${2.1 + i * 0.3}s"><span class="tick">✔</span> ${prettify(c.to)}</div>`).join('')}
      </div>
      <div class="fade-in" style="animation-delay:3.1s"><span class="xp-chip">+${S.nodeXp} XP neste salão</span></div>
      <button class="cta fade-in" style="animation-delay:3.5s" id="go">${isLast ? 'ver a jornada' : 'voltar ao Corredor'}</button>
    </div>`);
  S.nodeXp = 0;
  $('go').addEventListener('click', () => (isLast ? celebrateJourney() : renderCorridor()));
}

function celebrateJourney() {
  setProgress(null);
  const claims = NODES.reduce((sum, n) => sum + n.claims.length, 0);
  stepScreen(`
    <div class="celebrate">
      <div class="jcard fade-in">
        <p class="eyebrow">jornada concluída</p>
        <div class="jt">${JOURNEY.title}</div>
        <div class="thread">Atenas → Roma → Iluminismo → 1988 → <b>você</b></div>
        <div class="stats">
          <div class="stat"><b>${NODES.length}</b><span>salões acesos</span></div>
          <div class="stat"><b>${claims}</b><span>memórias guardadas</span></div>
          <div class="stat"><b>${S.xp}</b><span>xp</span></div>
        </div>
      </div>
      <div class="fade-in" style="animation-delay:.8s; width:100%; text-align:left">
        ${thoth('Você respondeu a pergunta da jornada, Guardião: <b>' + JOURNEY.centralQuestion + '</b> E a resposta atravessou 2.500 anos até chegar em você.', true)}
      </div>
      <div class="card fade-in" style="animation-delay:1.6s; width:100%; text-align:left">
        <p class="eyebrow">a próxima porta</p>
        <p class="serif">${JOURNEY.comingNext}</p>
      </div>
      <button class="cta gold fade-in" style="animation-delay:2.2s" id="go">fechar a sessão</button>
    </div>`);
  $('go').addEventListener('click', renderSessionClose);
}

function renderSessionClose() {
  stepScreen(`
    <p class="eyebrow">até amanhã, Guardião</p>
    ${thoth('Vou guardar as memórias de Atenas e Roma com cuidado. Em <b>3 dias</b> as chamas vão querer vacilar — e eu te chamo para reacendê-las. É assim que elas viram suas para sempre.')}
    <button class="cta" id="go">voltar ao Corredor</button>`);
  $('go').addEventListener('click', renderCorridor);
}

renderCorridor();
</script>
