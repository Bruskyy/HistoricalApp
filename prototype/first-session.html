<title>Mneme — Protótipo da primeira sessão</title>
<style>
  :root {
    --paper: #F2EBDC; --paper-raised: #FAF5EA; --paper-deep: #E7DDC8;
    --ink: #20293C; --ink-soft: #5A6273; --ink-faint: #8B90A0;
    --gold: #B8892F; --gold-soft: #D9C08A; --era: #2E7D74; --era-soft: #BFD8D3;
    --flame: #D98E2B; --annotate: #8A5A3B; --line: #D8CCB4;
    --shadow: 0 1px 2px rgba(32,41,60,.06), 0 6px 24px rgba(32,41,60,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151A26; --paper-raised: #1E2534; --paper-deep: #10141E;
      --ink: #E9E2D0; --ink-soft: #A8AEBE; --ink-faint: #767C8C;
      --gold: #D4A64A; --gold-soft: #6B5626; --era: #4FA396; --era-soft: #24443F;
      --flame: #E9A23B; --annotate: #C89A6B; --line: #2C3446;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --paper: #F2EBDC; --paper-raised: #FAF5EA; --paper-deep: #E7DDC8;
    --ink: #20293C; --ink-soft: #5A6273; --ink-faint: #8B90A0;
    --gold: #B8892F; --gold-soft: #D9C08A; --era: #2E7D74; --era-soft: #BFD8D3;
    --flame: #D98E2B; --annotate: #8A5A3B; --line: #D8CCB4;
    --shadow: 0 1px 2px rgba(32,41,60,.06), 0 6px 24px rgba(32,41,60,.07);
  }
  :root[data-theme="dark"] {
    --paper: #151A26; --paper-raised: #1E2534; --paper-deep: #10141E;
    --ink: #E9E2D0; --ink-soft: #A8AEBE; --ink-faint: #767C8C;
    --gold: #D4A64A; --gold-soft: #6B5626; --era: #4FA396; --era-soft: #24443F;
    --flame: #E9A23B; --annotate: #C89A6B; --line: #2C3446;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper-deep); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 8px 40px;
  }
  .phone {
    width: 100%; max-width: 430px; background: var(--paper);
    border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
    display: flex; flex-direction: column; min-height: 92vh;
    border: 1px solid var(--line);
  }
  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--line);
  }
  .brand { font-family: Georgia, 'Iowan Old Style', serif; font-size: 18px; letter-spacing: .04em; }
  .brand small { color: var(--ink-faint); font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; display: block; }
  .xp-chip {
    font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
    background: var(--paper-raised);
  }
  .thoth-chip {
    font-size: 15px; line-height: 1; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper-raised); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .thoth-chip:hover { border-color: var(--gold); }
  main { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

  .eyebrow { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 2px; }
  h1, h2 { font-family: Georgia, 'Iowan Old Style', serif; margin: 0; text-wrap: balance; font-weight: 600; }
  h1 { font-size: 24px; line-height: 1.25; }
  h2 { font-size: 19px; line-height: 1.3; }
  p { line-height: 1.62; margin: 0; font-size: 15.5px; }
  .serif { font-family: Georgia, 'Iowan Old Style', serif; }

  .card {
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }

  .journey-head { border-left: 3px solid var(--gold); }
  .journey-head .q { font-family: Georgia, serif; font-size: 16.5px; line-height: 1.45; }
  .journey-head .prog { font-size: 12px; color: var(--ink-faint); }

  .thoth-row { display: flex; gap: 12px; align-items: flex-start; }
  .thoth {
    flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%;
    background: var(--era-soft); display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--era); font-size: 22px;
  }
  .thoth-say { flex: 1; font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; padding-top: 4px; font-style: italic; }
  .thoth.bounce { animation: bounce .7s ease; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} 60%{transform:translateY(2px)} }

  .era-row { display: flex; gap: 14px; min-height: 60px; }
  .rail { width: 34px; display: flex; flex-direction: column; align-items: center; }
  .rail .seg { flex: 1; width: 3px; background: var(--line); }
  .node-dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--paper-raised);
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    color: var(--ink-faint); flex: 0 0 auto;
  }
  .era-row.sealed .node-dot { background: var(--paper-deep); }
  .era-row.open .node-dot { border-color: var(--era); color: var(--era); }
  .era-row.lit .node-dot { border-color: var(--flame); background: var(--gold-soft); }
  .era-info { flex: 1; padding: 4px 0 16px; }
  .era-name { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .era-row.open .era-name, .era-row.lit .era-name { color: var(--era); }
  .node-card {
    margin-top: 6px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    transition: transform .15s ease;
  }
  .node-card:hover { transform: translateY(-1px); }
  .node-card .nm { font-family: Georgia, serif; font-size: 15.5px; }
  .node-card .st { font-size: 11px; color: var(--ink-faint); }
  .node-card.lit { border-color: var(--flame); cursor: default; }
  .node-card.lit .st { color: var(--flame); }
  .sealed-note { font-size: 13px; color: var(--ink-faint); font-style: italic; padding: 8px 0 0; }
  .flame.on { animation: flicker 1.8s infinite ease-in-out; }
  @keyframes flicker { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.75; transform:scale(.92)} }

  .opt {
    text-align: left; width: 100%;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 13px 14px; font-size: 15px; color: var(--ink); cursor: pointer;
    font-family: inherit; line-height: 1.45;
    transition: border-color .15s ease, transform .1s ease;
  }
  .opt:hover { border-color: var(--era); transform: translateY(-1px); }
  .opt.picked-right { border-color: var(--era); background: var(--era-soft); }
  .opt.picked-annotate { border-color: var(--annotate); }
  .opt:disabled { cursor: default; opacity: .55; }
  .opt.picked-right:disabled, .opt.picked-annotate:disabled { opacity: 1; }
  .annotation {
    border-left: 3px solid var(--annotate); padding: 10px 14px;
    font-size: 14.5px; color: var(--ink-soft);
    background: color-mix(in srgb, var(--annotate) 7%, transparent);
    border-radius: 0 10px 10px 0; line-height: 1.6;
  }
  .annotation b { color: var(--annotate); font-weight: 600; }
  .stamp {
    align-self: flex-end; font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--gold); letter-spacing: .06em;
    animation: stamp .5s ease;
  }
  @keyframes stamp { 0%{opacity:0; transform:scale(1.6)} 100%{opacity:1; transform:scale(1)} }

  .chip {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; background: var(--paper);
  }
  .consensus-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .consensus-badge .pct { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--gold); font-size: 15px; }
  .debate-btn {
    background: none; border: none; color: var(--era); font-size: 14px;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
    padding: 0; font-family: inherit; text-align: left;
  }
  .debate-panel { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .position { font-size: 14px; line-height: 1.55; color: var(--ink); }
  .position .acc { display: block; font-size: 11.5px; color: var(--ink-faint); letter-spacing: .05em; text-transform: uppercase; margin-top: 2px; }

  .connections { display: flex; flex-direction: column; gap: 7px; }
  .connections .cx { display: flex; gap: 9px; font-size: 15px; align-items: baseline; opacity: 0; animation: rise .5s ease forwards; }
  .connections .cx .tick { color: var(--era); font-weight: 700; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .cta {
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 12px; padding: 15px 18px;
    font-size: 15.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    letter-spacing: .02em; transition: transform .12s ease;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta.gold { background: var(--gold); color: #fff; }
  .cta.ghost { background: none; color: var(--ink-soft); border: 1.5px solid var(--line); font-weight: 500; }

  .celebrate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 22px 12px; }
  .big-flame { font-size: 54px; animation: ignite 1.1s ease; }
  @keyframes ignite { 0%{transform:scale(.2); opacity:0} 55%{transform:scale(1.25)} 100%{transform:scale(1); opacity:1} }
  .fade-in { opacity: 0; animation: rise .6s ease forwards; }

  .jcard {
    width: 100%; border: 1.5px solid var(--gold); border-radius: 16px;
    background: var(--paper-raised); padding: 20px 18px;
    display: flex; flex-direction: column; gap: 12px; text-align: center;
  }
  .jcard .jt { font-family: Georgia, serif; font-size: 20px; font-weight: 600; }
  .jcard .thread { font-size: 13.5px; color: var(--ink-soft); letter-spacing: .02em; }
  .jcard .stats { display: flex; justify-content: center; gap: 18px; }
  .jcard .stat { display: flex; flex-direction: column; gap: 2px; }
  .jcard .stat b { font-size: 18px; font-variant-numeric: tabular-nums; color: var(--gold); }
  .jcard .stat span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }

  .term {
    text-decoration: underline dotted;
    text-decoration-color: var(--gold);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .term-box {
    position: absolute; z-index: 30; max-width: min(320px, calc(100% - 36px));
    background: var(--paper-raised); border: 1.5px solid var(--gold);
    border-radius: 12px; padding: 14px; box-shadow: var(--shadow);
    animation: rise .25s ease;
  }
  .term-box .tt { font-family: Georgia, serif; font-weight: 600; font-size: 15px; margin-bottom: 6px; color: var(--ink); }
  .term-box .td { font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }

  .verdict {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 14px; padding: 10px 12px; border-radius: 10px;
    animation: rise .3s ease;
  }
  .verdict.right { color: var(--era); background: color-mix(in srgb, var(--era) 12%, transparent); }
  .verdict.miss { color: var(--annotate); background: color-mix(in srgb, var(--annotate) 10%, transparent); }
  .opt.picked-right::before { content: '✓  '; color: var(--era); font-weight: 700; }
  .opt.picked-annotate { animation: nudge .35s ease; }
  @keyframes nudge { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 55%{transform:translateX(4px)} 80%{transform:translateX(-2px)} }

  .mission-card { border: 1.5px solid var(--gold); }
  .mission-card .mn { font-family: Georgia, serif; font-size: 17px; }
  .flame.waver { animation: flicker .55s infinite ease-in-out; }
  .mission-card.rescue { border-color: var(--flame); }
  .card.eco { border-left: 3px solid var(--flame); }
  .nav-back {
    background: none; border: 1.5px solid var(--line); border-radius: 10px;
    color: var(--ink-soft); font-size: 16px; line-height: 1; padding: 6px 11px;
    cursor: pointer; font-family: inherit;
  }
  .nav-back:hover { border-color: var(--era); color: var(--era); }
  .pips { font-size: 11px; letter-spacing: 2px; margin-top: 3px; }
  .milestone-pips { font-size: 26px; letter-spacing: 6px; }

  /* O mundo registra o progresso (GDD §4, "teste do print") */
  .mural {
    display: flex; gap: 9px; justify-content: center; align-items: flex-end;
    padding: 18px 12px 14px;
    background: linear-gradient(180deg, var(--paper-deep), color-mix(in srgb, var(--ink) 14%, var(--paper-deep)));
    border: 1px solid var(--line); border-radius: 14px;
  }
  .arch {
    width: 46px; height: 60px; border-radius: 23px 23px 5px 5px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px; font-size: 20px;
    border: 1.5px solid color-mix(in srgb, var(--line) 60%, transparent);
    background: color-mix(in srgb, var(--ink) 24%, var(--paper-deep));
    transition: background .8s ease, box-shadow .8s ease, border-color .8s ease;
  }
  .arch.veiled { opacity: .22; }
  .arch.next {
    border-color: var(--gold);
    background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 24%, var(--paper-deep)) 45%, color-mix(in srgb, var(--gold) 28%, var(--paper-deep)));
    animation: seam 2.4s infinite ease-in-out;
  }
  @keyframes seam {
    0%,100% { box-shadow: inset 0 -12px 16px -12px var(--gold); }
    50% { box-shadow: inset 0 -22px 20px -10px var(--gold); }
  }
  .arch.lit {
    background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 32%, var(--paper-raised)), var(--gold-soft));
    border-color: var(--flame);
    box-shadow: 0 0 14px color-mix(in srgb, var(--flame) 45%, transparent);
  }
  .mural.small { padding: 8px; gap: 6px; background: none; border: none; }
  .mural.small .arch { width: 34px; height: 44px; font-size: 15px; padding-bottom: 5px; }

  /* Biblioteca (GDD §4: Biblioteca → Corredor → Salões → Lições) */
  .domain-head { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
  .domain-head .di { font-size: 22px; }
  .domain-head .dt { font-family: Georgia, serif; font-size: 20px; font-weight: 600; }
  .domain-head .dg { font-size: 12.5px; color: var(--ink-soft); }
  .shelf-title { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }
  .domain-head.big .di { font-size: 30px; }
  .domain-head.big .dt { font-size: 26px; }
  .bib-card { cursor: pointer; transition: transform .15s ease, border-color .15s ease; }
  .bib-card:hover { transform: translateY(-1px); border-color: var(--era); }
  .bib-card.sealed { opacity: .8; border-style: dashed; }
  .bcount { font-size: 12px; color: var(--ink-faint); }
  .divider { border-top: 1px solid var(--line); margin: 6px 24px; }
  .jbook {
    background: var(--paper-raised); border: 1.5px solid var(--line); border-left: 5px solid var(--era);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .jbook:hover { transform: translateY(-1px); border-color: var(--era); }
  .jbook.done { border-color: var(--gold); border-left-color: var(--gold); }
  .jbook.sealed { opacity: .6; cursor: default; border-left-color: var(--line); }
  .jbook.trail { border-left-color: var(--gold); background: linear-gradient(135deg, var(--paper-raised), color-mix(in srgb, var(--gold) 8%, var(--paper-raised))); }
  .jbook .jb-title { font-family: Georgia, serif; font-size: 17px; font-weight: 600; }
  .jbook .jb-q { font-family: Georgia, serif; font-size: 13.5px; font-style: italic; color: var(--ink-soft); line-height: 1.4; }
  .jbook .jb-stats { font-size: 12px; color: var(--ink-faint); }
  .jbook .jm { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-faint); }
  .jbook .selo { color: var(--gold); font-weight: 700; }
  .jb-cta {
    align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--gold);
    border: 1.5px solid var(--gold); border-radius: 999px; padding: 6px 14px;
  }
  .pctbar { height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .pctbar > div { height: 100%; background: var(--gold); border-radius: 999px; transition: width .4s ease; }
  .soon { display: flex; flex-direction: column; gap: 6px; margin: -2px 0 4px; }
  .soon .eyebrow { margin: 0; }
  .soon-row {
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-faint);
    border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; font-style: italic;
  }
  .domain-sealed { opacity: .75; }
  .continue-card { border: 1.5px solid var(--gold); }
  .cc-title { font-family: Georgia, serif; font-size: 17px; font-weight: 600; }
  .collection { display: flex; flex-direction: column; gap: 6px; border: 1.5px solid var(--line); }
  .collection .bcount:first-child { font-size: 13px; color: var(--ink); }
  /* "Em preparação": a Biblioteca não escancara o catálogo futuro inteiro —
     só sinaliza que mais chega (feedback do fundador: viva, não uma prateleira infinita). */
  .coming-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .coming-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    color: var(--ink-faint); border: 1px dashed var(--line); border-radius: 999px;
    padding: 6px 12px; font-style: italic;
  }
  /* Descoberta, não desbloqueio: o pergaminho de uma trilha fica fechado até
     o toque (feedback do fundador — "parece descoberta, não recompensa"). */
  .scroll-reveal { cursor: pointer; }
  .scroll-reveal .sr-teaser { display: flex; align-items: center; gap: 10px; }
  .scroll-reveal .sr-open { display: none; }
  .scroll-reveal.open .sr-teaser { display: none; }
  .scroll-reveal.open .sr-open { display: flex; flex-direction: column; gap: 8px; animation: rise .4s ease; }

  /* Thoth evolui (GDD §7.1 — diferencial obrigatório VISION §16.1) */
  .thoth { position: relative; transition: box-shadow .6s ease, border-color .6s ease; }
  .thoth.s2 { border-color: var(--gold); box-shadow: 0 0 9px color-mix(in srgb, var(--gold) 45%, transparent); }
  .thoth.s3 {
    border-color: var(--flame);
    background: linear-gradient(180deg, var(--era-soft), color-mix(in srgb, var(--gold) 30%, var(--era-soft)));
    box-shadow: 0 0 14px color-mix(in srgb, var(--flame) 55%, transparent);
  }
  .tbadge {
    position: absolute; right: -4px; bottom: -4px; font-size: 13px;
    background: var(--paper-raised); border: 1px solid var(--gold);
    border-radius: 999px; padding: 1px 3px;
  }
  .thoth.tappable { cursor: pointer; }
  .diary-entry {
    display: flex; gap: 12px; align-items: center;
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  .diary-entry .de-emblem { font-size: 24px; }
  .diary-entry .de-place { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  .diary-entry .de-name { font-family: Georgia, serif; font-size: 14.5px; color: var(--ink); }
  .evolve-avatar {
    width: 84px; height: 84px; border-radius: 50%; font-size: 40px;
    display: flex; align-items: center; justify-content: center;
    animation: ignite 1.2s ease;
  }

  .era-row.sealed .era-info, .era-row.sealed .node-dot { opacity: .55; }
  .era-row.lit {
    background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 10%, transparent), transparent 70%);
    border-radius: 12px;
  }
  .era-row.lit .seg {
    background: linear-gradient(180deg, var(--flame), var(--gold));
    box-shadow: 0 0 7px color-mix(in srgb, var(--flame) 55%, transparent);
  }
  .era-row.lit .node-dot {
    box-shadow: 0 0 12px color-mix(in srgb, var(--flame) 60%, transparent);
    font-size: 15px;
  }
  .node-card.pulse { animation: glowPulse 2.2s ease-in-out infinite; border-color: var(--era); }
  @keyframes glowPulse {
    0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--era) 34%, transparent); }
    50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--era) 0%, transparent); }
  }

  .shift { gap: 8px; }
