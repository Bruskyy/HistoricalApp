<title>Mneme — Protótipo da primeira sessão</title>
<style>

  }

      --gold: #D4A64A; --gold-soft: #6B5626; --era: #4FA396; --era-soft: #24443F;
      --flame: #E9A23B; --annotate: #C89A6B; --line: #2C3446;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --paper: #F2EBDC; --paper-raised: #FAF5EA; --paper-deep: #E7DDC8;
    --ink: #20293C; --ink-soft: #5A6273; --ink-faint: #8B90A0;
    --gold: #B8892F; --gold-soft: #D9C08A; --era: #2E7D74; --era-soft: #BFD8D3;
    --flame: #D98E2B; --annotate: #8A5A3B; --line: #D8CCB4;
    --shadow: 0 1px 2px rgba(32,41,60,.06), 0 6px 24px rgba(32,41,60,.07);
  }
  :root[data-theme="dark"] {
    --paper: #151A26; --paper-raised: #1E2534; --paper-deep: #10141E;
    --ink: #E9E2D0; --ink-soft: #A8AEBE; --ink-faint: #767C8C;
    --gold: #D4A64A; --gold-soft: #6B5626; --era: #4FA396; --era-soft: #24443F;

  header.bar {

  .brand { font-family: Georgia, 'Iowan Old Style', serif; font-size: 18px; letter-spacing: .04em; }

  .annotation {

  .jcard {

  .verdict {

  .opt.picked-annotate { animation: nudge .35s ease; }

  .mission-card { border: 1.5px solid var(--gold); }
  .mission-card .mn { font-family: Georgia, serif; font-size: 17px; }
  .flame.waver { animation: flicker .55s infinite ease-in-out; }
  .mission-card.rescue { border-color: var(--flame); }
  .card.eco { border-left: 3px solid var(--flame); }
  .nav-back {
    background: none; border: 1.5px solid var(--line); border-radius: 10px;

  }
  .nav-back:hover { border-color: var(--era); color: var(--era); }
  .pips { font-size: 11px; letter-spacing: 2px; margin-top: 3px; }

  /* O mundo registra o progresso (GDD §4, "teste do print") */
  .mural {
    display: flex; gap: 9px; justify-content: center; align-items: flex-end;
    padding: 18px 12px 14px;
    background: linear-gradient(180deg, var(--paper-deep), color-mix(in srgb, var(--ink) 14%, var(--paper-deep)));
    border: 1px solid var(--line); border-radius: 14px;
  }
  .arch {
    width: 46px; height: 60px; border-radius: 23px 23px 5px 5px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px; font-size: 20px;
    border: 1.5px solid color-mix(in srgb, var(--line) 60%, transparent);
    background: color-mix(in srgb, var(--ink) 24%, var(--paper-deep));
    transition: background .8s ease, box-shadow .8s ease, border-color .8s ease;
  }
  .arch.veiled { opacity: .22; }
  .arch.next {
    border-color: var(--gold);

  @keyframes seam {

  }
  .arch.lit {
    background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 32%, var(--paper-raised)), var(--gold-soft));
    border-color: var(--flame);
    box-shadow: 0 0 14px color-mix(in srgb, var(--flame) 45%, transparent);
  }
  .mural.small { padding: 8px; gap: 6px; background: none; border: none; }
  .mural.small .arch { width: 34px; height: 44px; font-size: 15px; padding-bottom: 5px; }

  /* Biblioteca (GDD §4: Biblioteca → Corredor → Salões → Lições) */
  .domain-head { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
  .domain-head .di { font-size: 22px; }
  .domain-head .dt { font-family: Georgia, serif; font-size: 20px; font-weight: 600; }
  .domain-head .dg { font-size: 12.5px; color: var(--ink-soft); }
  .shelf-title { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }

  .domain-head.big .dt { font-size: 26px; }
  .bib-card { cursor: pointer; transition: transform .15s ease, border-color .15s ease; }
  .bib-card:hover { transform: translateY(-1px); border-color: var(--era); }

  .bcount { font-size: 12px; color: var(--ink-faint); }
  .divider { border-top: 1px solid var(--line); margin: 6px 24px; }

  .thoth { position: relative; transition: box-shadow .6s ease, border-color .6s ease; }

  .diary-entry {

  .evolve-avatar {

  .era-row.sealed .era-info, .era-row.sealed .node-dot { opacity: .55; }
  .era-row.lit {
    background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 10%, transparent), transparent 70%);

  }
  .era-row.lit .seg {
    background: linear-gradient(180deg, var(--flame), var(--gold));
    box-shadow: 0 0 7px color-mix(in srgb, var(--flame) 55%, transparent);
  }
  .era-row.lit .node-dot {
    box-shadow: 0 0 12px color-mix(in srgb, var(--flame) 60%, transparent);

  }
  .node-card.pulse { animation: glowPulse 2.2s ease-in-out infinite; border-color: var(--era); }
  @keyframes glowPulse {
    0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--era) 34%, transparent); }

  }

  .shift { gap: 8px; }

  }

const PACKAGE = {"compiledAt":"2026-07-19","glossary":[{"id":"democracia","term":"Democracia","match":["democracia","democrática","democrático","democráticas","democráticos"],"definition":"Do grego dēmos (povo) + kratos (poder): governo em que o poder emana do conjunto dos cidadãos. O que conta como \"povo\" mudou — e muito — ao longo de 2.500 anos."},{"id":"oligarquia","term":"Oligarquia","match":["oligarquia","oligarquias","oligárquica"],"definition":"Governo de poucos (oligoi). Na prática: quando um grupo pequeno — por riqueza, família ou influência — controla as decisões, mesmo sob instituições formalmente abertas."},{"id":"aristocracia","term":"Aristocracia","match":["aristocracia","aristocrata","aristocratas","aristocrático","aristocrática","aristocráticas","aristocráticos"],"definition":"Governo dos \"melhores\" (aristoi) — na prática, das grandes famílias de nascimento e riqueza. Em Atenas, a eleição era vista como aristocrática porque favorecia quem tinha nome, fortuna e oratória."},{"id":"sorteio","term":"Sorteio","match":["sorteio","sorteava","sorteado","sorteados","sortear","sorteava-se"],"definition":"Seleção de governantes ao acaso entre os cidadãos. Para os atenienses, o método mais democrático que existe: trata todos como igualmente capazes de governar."},{"id":"demos","term":"Demos","match":["demos"],"definition":"O corpo de cidadãos de uma pólis grega — o \"povo\" da palavra democracia. Em Atenas, uma minoria dos habitantes."},{"id":"metecos","term":"Metecos","match":["metecos","meteco"],"definition":"Estrangeiros residentes em Atenas: livres, pagavam impostos, serviam no exército — e nunca votavam."},{"id":"assembleia","term":"Assembleia","match":["assembleia","assembleias"],"definition":"Reunião dos cidadãos com direito a voto. Em Atenas, decidia quase tudo; em Roma, votava leis e elegia magistrados — sob forte influência das elites."},{"id":"tirania","term":"Tirania","match":["tirania","tirano"],"definition":"Para os antigos, o poder tomado ou exercido sem freios — não necessariamente cruel, mas sem limite. O medo que desenhou tanto Atenas quanto Roma."},{"id":"republica","term":"República","match":["república","republicano","republicana"],"definition":"Do latim res publica, \"coisa pública\": governo sem rei, com o poder distribuído em instituições. Não é, por si só, sinônimo de democracia."},{"id":"veto","term":"Veto","match":["veto","vetar"],"definition":"Do latim \"eu proíbo\". O poder de um cônsul barrar a decisão do outro — a origem romana da ideia de que poder freia poder."},{"id":"consul","term":"Cônsul","match":["cônsul","cônsules"],"definition":"Um dos dois chefes do executivo romano: eleito, mandato de um ano, e cada um com poder de vetar o outro."},{"id":"senado","term":"Senado","match":["senado"],"definition":"Conselho de ex-magistrados romanos — vitalício, aristocrático, não eleito diretamente. O centro de gravidade da política republicana."},{"id":"magistratura","term":"Magistratura","match":["magistraturas","magistrados","magistrado"],"definition":"Os cargos públicos de Roma (questor, edil, pretor, cônsul…), conquistados por eleição, degrau por degrau."},{"id":"cursus-honorum","term":"Cursus honorum","match":["cursus honorum"],"definition":"\"Carreira das honras\": a escada obrigatória de cargos que um romano subia antes de chegar ao topo. Antes de mandar, era preciso ter servido."},{"id":"iluminismo","term":"Iluminismo","match":["iluminismo"],"definition":"Movimento intelectual dos séculos XVII-XVIII que releu os antigos com olhos novos — razão, direitos e a pergunta: quem autoriza o poder?"},{"id":"separacao-de-poderes","term":"Separação de poderes","match":["separação de poderes"],"definition":"A tese de que Executivo, Legislativo e Judiciário devem ser independentes e limitar uns aos outros. Montesquieu a formulou lendo Roma — e a Constituição de 1988 a herda."},{"id":"constituicao","term":"Constituição","match":["constituição"],"definition":"O conjunto de regras fundamentais que organiza o poder de um Estado. A de 1988 é a brasileira em vigor — e carrega 2.500 anos de discussão dentro dela."},{"id":"polibio","term":"Políbio","match":["políbio"],"definition":"Historiador grego (c. 200-118 a.C.) levado a Roma como refém político. Passou anos observando a máquina romana; seu Livro VI descreve a \"constituição mista\" que influenciaria Montesquieu."},{"id":"soberania","term":"Soberania","match":["soberania"],"definition":"O poder último de decidir, acima do qual não há outro. A grande disputa da jornada: ela mora no rei, em Deus — ou no povo? 1789 e 1988 responderam: na nação, no povo."},{"id":"humanistas","term":"Humanistas","match":["humanistas","humanismo","humanista"],"definition":"Estudiosos do Renascimento que caçaram, editaram e ensinaram os textos antigos — convencidos de que Grécia e Roma tinham algo a dizer ao presente."},{"id":"absolutismo","term":"Absolutismo","match":["absolutismo","absolutista"],"definition":"Regime em que o rei concentra todo o poder, sem freios institucionais — justificado, no auge, como direito divino. O alvo direto de Locke, Montesquieu e 1789."}],"journeys":[{"id":"a-ideia-renasce","order":2,"title":"A Ideia Renasce","centralQuestion":"Como uma ideia sobrevive a 2.000 anos?","thread":"Copistas → Humanistas → Filósofos → Revoluções → 1988 → você","nodeOrder":["resgate-dos-antigos","iluminismo","revolucoes-atlanticas"],"comingNext":"Próximas jornadas em escrita — o Arquivo não para","synthesis":{"question":{"id":"sintese-renascimento","type":"connection","objective":true,"prompt":"Última pergunta — e ela atravessa dois mil anos. Como a ideia de que o povo pode governar sobreviveu da queda de Roma até a Constituição de 1988?","options":["Por uma corrente de escolhas: copistas que copiaram, humanistas que redescobriram, filósofos que releram, revoluções que promulgaram — cada época reacendeu a chama para responder ao próprio tempo","Ficou escondida, intacta, num livro só, até alguém achá-la pronta","Foi reinventada do zero pelo Iluminismo, sem relação com os antigos"],"correct":0,"errorPath":"Você viu cada elo: nada estava intacto nem foi inventado do zero. O Livro VI de Políbio passou por mãos de monges e tradutores; Montesquieu o releu; a Filadélfia e Paris o promulgaram; 1988 o escreveu em português. Sobreviver, para uma ideia, é ser escolhida de novo — século após século."},"reframe":["Você começou esta jornada com uma pergunta: como uma ideia sobrevive a 2.000 anos? A resposta que você atravessou é desconcertante: ela não sobrevive — ela é ressuscitada, de propósito, por gente com nome e endereço. Um copista no ano 800. Um caçador de manuscritos em 1417. Um barão numa biblioteca em 1748. Delegados suando na Filadélfia em 1787. Constituintes em Brasília em 1988.","A democracia que você vive não é grega, nem romana, nem francesa: é a soma das releituras — e ela continua precisando do que sempre precisou: alguém que escolha reacendê-la. Neste momento, o elo mais recente da corrente de 2.500 anos é a sua geração."],"shift":{"before":"Ideias grandes sobrevivem sozinhas, guardadas em livros","after":"Ideias sobrevivem porque alguém, em cada século, escolhe reacendê-las — e o século atual é o seu turno"}}},{"id":"nascimento-da-democracia","order":1,"title":"O Nascimento da Democracia","centralQuestion":"De onde veio a ideia de que o povo pode governar?","thread":"Atenas → Roma → Iluminismo → 1988 → você","nodeOrder":["democracia-ateniense","republica-romana"],"comingNext":"Iluminismo — quando a ideia renasce, mil anos depois","synthesis":{"question":{"id":"sintese-democracia","type":"connection","objective":true,"prompt":"Última pergunta — e ela atravessa a jornada inteira. O sistema em que você vive (eleições, mandatos, três poderes — e o nome \"democracia\") é…","options":["Um híbrido de 2.500 anos: de Atenas, a ideia de que o poder nasce do povo; de Roma, a máquina de eleições, mandatos e poderes que se freiam","A democracia ateniense, modernizada com tecnologia","Uma invenção do século XX, sem relação real com a Antiguidade"],"correct":0,"errorPath":"Repare no que você atravessou: o nome e a justificativa (o povo como fonte do poder) vêm de Atenas — mas Atenas sorteava, não elegia. A máquina que usamos (eleição, mandato com prazo, poderes se vigiando) é a resposta de Roma, relida pelo Iluminismo. Nosso sistema não copia nenhuma das duas cidades: ele é a conversa entre elas."},"reframe":["Você começou com uma pergunta: de onde veio a ideia de que o povo pode governar? A resposta que você atravessou é mais estranha — e mais bonita — do que parece: a democracia não foi inventada uma vez. Ela foi proposta por Atenas (com sorteio e exclusões), recusada e remontada por Roma (com eleições e freios), e refundida pelo Iluminismo na fórmula que a Constituição de 1988 herda.","Da próxima vez que você votar, repare: o gesto é romano, a justificativa é ateniense — e a discussão sobre se isso basta continua aberta, 2.500 anos depois. A partir de hoje, você está dentro dela."],"shift":{"before":"Democracia: um sistema que a Grécia inventou","after":"Democracia: uma discussão de 2.500 anos sobre quem merece o poder — ainda em aberto, e agora com você dentro"}},"next":{"journey":"a-ideia-renasce","provocation":"Você acabou de descobrir de onde veio a democracia. Mas… como uma ideia dessas sobreviveu quase 2.000 anos — atravessando a queda de Roma, impérios e fogueiras — sem desaparecer?"}}],"nodes":[{"id":"democracia-ateniense","domain":"history","era":"antiguidade","place":"Grécia","emblem":"🏛️","name":"A democracia ateniense","sensitive":false,"journeys":["nascimento-da-democracia"],"positionInJourney":{"nascimento-da-democracia":1},"claims":[{"id":"sorteio-magistrados","text":"Na democracia ateniense clássica, a maioria dos cargos públicos era preenchida por sorteio, não por eleição.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"academic_book","ref":"Hansen, M. H. The Athenian Democracy in the Age of Demosthenes. Blackwell, 1991."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Uma cidade moderna decide escolher seu conselho de orçamento por sorteio entre cidadãos comuns. Um ateniense clássico diria que isso é…","options":["Profundamente democrático — era exatamente assim que Atenas preenchia a maioria dos cargos","Uma loteria irresponsável, coisa que Atenas jamais faria","Aristocrático demais para o gosto ateniense"],"correct":0,"errorPath":"Atenas preenchia a maioria dos cargos públicos por sorteio — para eles, o acaso entre iguais era a marca da democracia; a eleição é que cheirava a aristocracia."}]},{"id":"exclusao-politica","text":"Mulheres, estrangeiros residentes (metecos) e pessoas escravizadas eram excluídos da cidadania ateniense.","epistemicClass":"established_fact","consensusPct":98,"sources":[{"type":"academic_book","ref":"Hansen, M. H. The Athenian Democracy in the Age of Demosthenes. Blackwell, 1991."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Na Atenas clássica, quem destes podia votar na assembleia: um meteco rico, uma mulher de família ateniense, ou um cidadão pobre?","options":["Só o cidadão pobre — a porta não era renda: era nascimento cidadão (e ser homem)","O meteco rico — dinheiro comprava participação","A mulher de família ateniense — o nascimento dela contava"],"correct":0,"errorPath":"A porta da política ateniense não era riqueza: era o status de cidadão — que excluía mulheres, metecos e pessoas escravizadas, sempre, não importava a fortuna."}]},{"id":"clistenes-marco","text":"As reformas de Clístenes (c. 508 a.C.) são o marco convencional do nascimento da democracia ateniense.","epistemicClass":"accepted_hypothesis","consensusPct":85,"sources":[{"type":"academic_book","ref":"Ober, J. The Rise and Fall of Classical Greece. Princeton University Press, 2015."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"O que as reformas de Clístenes fizeram com o poder das grandes famílias aristocráticas?","options":["Enfraqueceram: as novas tribos misturavam regiões e quebravam os blocos de lealdade familiar","Fortaleceram: cada família ganhou uma tribo própria","Nada: as tribos eram apenas divisões religiosas"],"correct":0,"errorPath":"O golpe de Clístenes foi de engenharia social: tribos novas que misturavam cidade, costa e interior — impossível para um clã dominar uma tribo inteira. É por isso que 508 a.C. é o marco."}]},{"id":"motivacao-reformas","text":"O peso relativo do conflito entre elites e da pressão popular na origem das reformas democráticas é objeto de interpretações concorrentes.","epistemicClass":"historiographical_interpretation","consensusPct":55,"sources":[{"type":"academic_book","ref":"Ober, J. The Athenian Revolution. Princeton University Press, 1996."},{"type":"peer_reviewed_article","ref":"Anderson, G. 'The Personality of the Greek State'. Journal of Hellenic Studies 129, 2009."}],"debate":{"question":"A democracia nasceu de cima (disputa entre elites) ou de baixo (ação popular)?","positions":[{"view":"Revolução popular: a ação coletiva do demos foi decisiva (Ober).","acceptance":"ampla, mas não unânime"},{"view":"Subproduto da competição entre facções aristocráticas, formalizado por Clístenes.","acceptance":"minoritária relevante"}]}}],"connections":[{"to":"republica-romana","type":"influence"},{"to":"iluminismo","type":"influence"},{"to":"constituicao-brasileira-1988","type":"echo"}],"lessons":[{"id":"sorteio-escandaloso","title":"O sorteio que escandalizaria hoje","hook":"Você é um cidadão de Atenas, 450 a.C. Amanhã a cidade escolhe quem vai administrar o tesouro público. Como você prefere escolher?","narrative":["Se você respondeu \"votando no melhor candidato\", os atenienses discordariam de você — com veemência.","Para a democracia ateniense, **eleição era coisa de aristocrata**: quem vence eleições é quem tem nome, dinheiro e boa oratória. O método verdadeiramente democrático, para eles, era o **sorteio**. Qualquer cidadão podia ser sorteado para a maioria dos cargos públicos — do conselho que preparava as leis aos tribunais populares.","A lógica: se todo cidadão é capaz de participar do governo, o acaso é mais justo que a fama. Eleições existiam, mas eram reservadas às poucas funções que exigiam técnica comprovada — como generais."],"echoes":[],"interactions":[{"id":"i1","type":"situated_decision","claimId":"sorteio-magistrados","objective":false,"prompt":"Como você escolheria o administrador do tesouro?","options":["Eleição com candidatos","Sorteio entre os cidadãos","Indicação pelos mais ricos"],"errorPath":"Não há resposta errada aqui — mas a escolha ateniense vai te surpreender."},{"id":"i2","type":"causal","claimId":"sorteio-magistrados","objective":true,"prompt":"Por que os atenienses viam o sorteio como MAIS democrático que a eleição?","options":["Porque a eleição favorece quem tem fama, dinheiro e oratória","Porque o sorteio era mais rápido de organizar","Porque os deuses escolhiam os sorteados"],"correct":0,"errorPath":"A rapidez não era o ponto — o argumento era de igualdade: a eleição premia vantagens que nem todo cidadão tem (nome, riqueza, retórica); o sorteio trata todos os cidadãos como igualmente capazes de governar."},{"id":"i3","type":"source_interpretation","claimId":"motivacao-reformas","objective":false,"prompt":"Historiadores debatem: a democracia nasceu da ação popular ou da disputa entre elites? Explore as duas leituras.","errorPath":"Este é um debate historiográfico real — não existe resposta fechada; o valor está em conhecer as posições e suas evidências."}],"connection":"Agora você entende melhor: ✔ por que \"democracia representativa\" teria soado estranho em Atenas ✔ o debate moderno sobre sorteio em conselhos cidadãos ✔ o que Roma decidiu fazer diferente."},{"id":"quem-ficava-de-fora","title":"Quem ficava de fora","hook":"A \"cidade de todos os cidadãos\" tinha cerca de 300 mil habitantes. Quantos podiam votar na assembleia?","narrative":["Cerca de 30 mil — aproximadamente um em cada dez.","A cidadania ateniense era um clube fechado: **mulheres, estrangeiros residentes (metecos) e pessoas escravizadas ficavam fora** da vida política, sempre. O demos que se governava por sorteio era, ao mesmo tempo, radicalmente igualitário por dentro e radicalmente excludente por fora.","Isso não é um detalhe constrangedor a esconder: é a chave para entender o que a palavra \"democracia\" significava lá — e o quanto o seu significado mudou até chegar a você."],"echoes":[],"interactions":[{"id":"i1","type":"counterfactual","claimId":"exclusao-politica","objective":true,"prompt":"Se Atenas tivesse estendido a cidadania a metecos e mulheres, o que mudaria no funcionamento do sorteio?","options":["Nada no mecanismo — o sorteio funciona igual; mudaria QUEM entra no sorteio","O sorteio se tornaria impossível de organizar","A assembleia deixaria de existir"],"correct":0,"errorPath":"O mecanismo do sorteio não depende do tamanho do corpo cívico — a exclusão era uma escolha política sobre quem conta como cidadão, não uma limitação técnica do sistema."},{"id":"i2","type":"causal","claimId":"clistenes-marco","objective":true,"prompt":"Por que as reformas de Clístenes (508 a.C.) são tratadas como o marco de nascimento da democracia?","options":["Porque reorganizaram os cidadãos em tribos que quebravam o poder das famílias aristocráticas","Porque aboliram a escravidão em Atenas","Porque criaram a primeira eleição presidencial"],"correct":0,"errorPath":"A escravidão não foi abolida — e é exatamente essa convivência entre igualdade cívica e exclusão que a lição anterior mostrou. O marco de Clístenes é a reengenharia do corpo cívico: tribos novas que misturavam regiões e enfraqueciam clãs."}],"connection":"Agora você entende melhor: ✔ por que \"democracia\" antiga e moderna não são a mesma coisa ✔ os séculos de lutas por sufrágio que viriam ✔ por que a Constituição de 1988 diz \"todos\"."}]},{"id":"iluminismo","domain":"history","era":"iluminismo","place":"Iluminismo","emblem":"🪔","name":"As luzes releem os antigos","sensitive":false,"journeys":["a-ideia-renasce"],"positionInJourney":{"a-ideia-renasce":2},"claims":[{"id":"contrato-locke","text":"Locke argumentou que o poder político nasce de um contrato entre as pessoas e existe para proteger seus direitos — e que um governo que os viola pode ser legitimamente trocado.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"primary_source","ref":"Locke, J. Segundo Tratado sobre o Governo Civil (1689)."},{"type":"academic_book","ref":"Dunn, J. The Political Thought of John Locke. Cambridge University Press, 1969."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Um governo moderno perde uma eleição e entrega o poder pacificamente. Qual ideia iluminista está funcionando nesse gesto?","options":["A de Locke: o poder é um contrato revogável — quem governa é empregado dos governados, não dono deles","A de que o vencedor da eleição recebe o poder por direito divino","A do sorteio ateniense de cargos"],"correct":0,"errorPath":"A troca pacífica de governo parece banal hoje — e é a tese mais radical de Locke em funcionamento: se o poder nasce de um contrato, ele pode ser retomado. Nenhum rei por direito divino 'perde a eleição'."}]},{"id":"separacao-montesquieu","text":"Montesquieu, em O Espírito das Leis (1748), formulou a doutrina moderna da separação de poderes a partir da leitura dos antigos e da constituição inglesa.","epistemicClass":"established_fact","consensusPct":94,"sources":[{"type":"primary_source","ref":"Montesquieu. O Espírito das Leis (1748), Livro XI."},{"type":"academic_book","ref":"Shklar, J. Montesquieu. Oxford University Press, 1987."}],"reviewVariants":[{"id":"rv1","type":"connection","objective":true,"prompt":"O STF derruba uma lei do Congresso; o Congresso derruba um veto do Presidente. Esse balé institucional foi coreografado por…","options":["Montesquieu, relendo a máquina de equilíbrios que Políbio descreveu em Roma","Os atenienses, no desenho original do sorteio","Os copistas medievais, ao preservar os textos"],"correct":0,"errorPath":"Cada peça dessa coreografia — poderes separados que se freiam — saiu de O Espírito das Leis, que por sua vez saiu da leitura de Roma. Os copistas preservaram a partitura; Montesquieu a reorquestrou; 1988 a executa todos os dias."}]},{"id":"pergunta-muda","text":"O Iluminismo deslocou a pergunta política central de \"quem deve mandar\" para \"o que autoriza o poder\" — fundando a legitimidade no consentimento dos governados.","epistemicClass":"accepted_hypothesis","consensusPct":84,"sources":[{"type":"academic_book","ref":"Israel, J. Radical Enlightenment: Philosophy and the Making of Modernity. Oxford University Press, 2001."}],"reviewVariants":[{"id":"rv1","type":"counterfactual","objective":true,"prompt":"Num mundo onde o Iluminismo nunca tivesse feito a pergunta \"o que autoriza o poder?\", o mais provável é que…","options":["As revoluções americana e francesa não teriam seu argumento central — derrubar um rei exigiria outro rei","As revoluções aconteceriam iguais, pois ideias não influenciam eventos","A democracia ateniense teria voltado por conta própria"],"correct":0,"errorPath":"Sem a mudança de pergunta, derrubar um rei significava apenas coroar outro. Foi o consentimento como fundamento do poder que permitiu imaginar o vazio deixado por um trono sendo preenchido por uma constituição."}]},{"id":"peso-das-ideias","text":"O peso relativo das ideias iluministas — versus crises fiscais, sociais e materiais — como causa das revoluções do século XVIII é objeto de debate historiográfico.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"academic_book","ref":"Israel, J. Democratic Enlightenment. Oxford University Press, 2011."},{"type":"academic_book","ref":"Doyle, W. The Oxford History of the French Revolution. Oxford University Press, 1989."}],"debate":{"question":"As revoluções foram filhas das ideias — ou das crises (fome, impostos, guerra)?","positions":[{"view":"As ideias como motor: sem o arsenal intelectual iluminista, as crises teriam produzido revoltas, não revoluções (Israel).","acceptance":"influente, contestada"},{"view":"As estruturas como motor: crise fiscal, fome e tensão social explodiriam de qualquer forma; as ideias deram forma, não causa (tradição social).","acceptance":"amplamente defendida"}]}}],"connections":[{"to":"democracia-ateniense","type":"influence"},{"to":"republica-romana","type":"influence"},{"to":"revolucoes-atlanticas","type":"influence"}],"lessons":[{"id":"a-pergunta-muda","title":"A pergunta muda","hook":"Durante mil anos, a pergunta política da Europa foi \"qual rei?\". De repente, em salões, cafés e panfletos, uma geração inteira começa a fazer outra pergunta — muito mais perigosa: \"por que um rei?\"","narrative":["John Locke deu a essa pergunta uma resposta explosiva: o poder não desce de Deus para o rei — sobe das pessoas para o governo. Vivemos juntos por um **contrato**: entregamos parte da nossa liberdade a um governo *para que ele proteja nossos direitos*. E um contrato, ao contrário de uma coroa, pode ser rompido. Governo que viola direitos pode ser trocado — legitimamente.","Repare no que isso faz com dois mil anos de história: a intuição ateniense de que o poder pertence ao conjunto dos cidadãos, que hibernou, foi copiada, redescoberta e rediscutida — reaparece agora como filosofia sistemática. A pergunta deixou de ser \"quem manda\" e virou \"o que autoriza quem manda\". Essa mudança de pergunta é a fundação de todas as revoluções que vêm a seguir."],"echoes":[{"node":"democracia-ateniense","text":"\"O poder emana do povo\" — Atenas apostou nisso com sorteio e assembleia; Locke devolve a aposta como teoria do contrato. É a mesma chama, 2.100 anos depois."},{"node":"resgate-dos-antigos","text":"Locke e sua geração só puderam reler os antigos porque os caçadores de manuscritos e a imprensa fizeram o trabalho que você viu no salão anterior."}],"interactions":[{"id":"i1","type":"situated_decision","claimId":"contrato-locke","objective":false,"prompt":"Ano 1690. O rei afirma: \"meu poder vem de Deus\". Um panfleto anônimo sussurra: \"o poder vem de um acordo entre nós — e acordos podem ser desfeitos\". Qual ideia te parece mais perigosa para a ordem do mundo?","options":["A do rei — concentra tudo num homem","A do panfleto — torna todo governo provisório","Nenhuma: são equivalentes"],"errorPath":"Sem resposta errada — mas repare: a ideia do panfleto é a mais subversiva já impressa até então. Se o poder é um contrato, nenhum trono do mundo está seguro. Os reis da época entenderam isso perfeitamente — e censuraram."},{"id":"i2","type":"causal","claimId":"pergunta-muda","objective":true,"prompt":"Por que mudar a pergunta de \"quem deve mandar\" para \"o que autoriza o poder\" foi tão revolucionário?","options":["Porque tornou todo governo prestador de contas: se a autorização vem dos governados, ela pode ser retirada","Porque respondeu de vez quem era o melhor rei","Porque eliminou a necessidade de qualquer governo"],"correct":0,"errorPath":"A pergunta antiga sempre tinha um vencedor sentado num trono. A nova pergunta não coroa ninguém — ela põe todo ocupante do poder, qualquer um, sob condição. É a diferença entre trocar de rei e abolir a lógica dos reis."},{"id":"i3","type":"source_interpretation","claimId":"peso-das-ideias","objective":false,"prompt":"Foram as ideias que derrubaram os tronos — ou a fome, os impostos e as guerras? Historiadores discordam. Explore.","errorPath":"Debate aberto e importante: a resposta calibra o quanto você acredita que livros mudam o mundo — e o quanto o mundo muda os livros."}],"connection":"Agora você entende melhor: ✔ por que \"consentimento dos governados\" é a frase mais importante da política moderna ✔ o que Locke deve a Atenas ✔ por que os reis censuravam filósofos ✔ o combustível das revoluções que vêm aí."},{"id":"a-maquina-redesenhada","title":"A máquina redesenhada","hook":"Um barão francês passa vinte anos numa biblioteca, cercado de autores mortos há dezoito séculos. Quando sai, publica um livro que os fundadores de nações vão carregar debaixo do braço. O que Montesquieu encontrou nos antigos?","narrative":["Encontrou uma máquina. Lendo Políbio e os historiadores de Roma — os mesmos textos que a corrente de copistas salvou —, Montesquieu reencontrou a velha tese romana: **poder só é contido por outro poder**. Homens não são anjos; instituições precisam desconfiar umas das outras.","Em *O Espírito das Leis* (1748), ele a reorquestrou para o mundo moderno: três poderes — o que faz as leis, o que as executa, o que julga — separados, independentes, vigiando-se. Não porque três seja um número mágico, mas porque poder concentrado, em qualquer mão, sempre termina no mesmo lugar. Roma sabia. Montesquieu relembrou. E as revoluções que vêm a seguir vão transformar o capítulo de um livro em arquitetura de nações."],"echoes":[{"node":"republica-romana","text":"A máquina de equilíbrios de Políbio que você viu em Roma — cônsules, Senado, assembleias se freando — é exatamente o que Montesquieu está relendo. Você conheceu a partitura antes do maestro."},{"node":"resgate-dos-antigos","text":"Sem a corrente de copistas e a imprensa, a biblioteca de Montesquieu estaria vazia. O salão anterior é a condição deste."}],"interactions":[{"id":"i1","type":"causal","claimId":"separacao-montesquieu","objective":true,"prompt":"Por que Montesquieu insistia que os três poderes precisam ser SEPARADOS?","options":["Porque poder concentrado numa só mão tende à tirania — só outro poder consegue frear um poder","Porque três instituições trabalham mais rápido que uma","Porque a Bíblia recomendava a divisão em três"],"correct":0,"errorPath":"Eficiência não era o ponto — desconfiança era. A aposta, herdada de Roma: não confie na virtude de quem governa; desenhe instituições que se vigiem. Se uma falhar, as outras seguram. É pessimismo transformado em arquitetura."},{"id":"i2","type":"counterfactual","claimId":"separacao-montesquieu","objective":true,"prompt":"Se Montesquieu nunca tivesse lido os antigos — se a corrente de copistas tivesse falhado no elo de Políbio —, o mais provável é que…","options":["A doutrina da separação de poderes teria que ser reinventada de outro material — ou as constituições modernas seriam outras","Nada mudaria: ele teria a mesma ideia lendo qualquer coisa","A separação de poderes já existia pronta na Idade Média"],"correct":0,"errorPath":"Ideias têm genealogia. O Espírito das Leis cita os antigos em quase todas as páginas — era o material de que a doutrina foi feita. Sem o resgate, talvez outra arquitetura; certamente não esta, que é a sua."}],"connection":"Agora você entende melhor: ✔ de onde veio, elo por elo, a separação de poderes ✔ por que constituições desconfiam de todo mundo ✔ o livro que os revolucionários vão carregar ✔ o próximo salão: quando o papel vira poder."}]},{"id":"republica-romana","domain":"history","era":"antiguidade","place":"Roma","emblem":"🦅","name":"A República Romana","sensitive":false,"journeys":["nascimento-da-democracia"],"positionInJourney":{"nascimento-da-democracia":2},"claims":[{"id":"recusa-sorteio","text":"As magistraturas principais da República Romana eram preenchidas por eleição em assembleias, não por sorteio, dentro de uma carreira hierárquica de cargos (cursus honorum).","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"academic_book","ref":"Lintott, A. The Constitution of the Roman Republic. Oxford University Press, 1999."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Um jovem romano ambicioso quer chegar a cônsul. O caminho dele é…","options":["Subir o cursus honorum: ser eleito cargo a cargo, provando serviço em cada degrau","Esperar seu nome ser sorteado entre os cidadãos","Comprar um assento vitalício no Senado"],"correct":0,"errorPath":"Roma recusou o sorteio ateniense: magistraturas eram conquistadas por eleição, numa escada obrigatória de experiência. Antes de mandar, era preciso ter servido."}]},{"id":"poder-fatiado","text":"O poder executivo republicano era deliberadamente limitado: dois cônsules, mandato de um ano, com poder de veto entre si.","epistemicClass":"established_fact","consensusPct":96,"sources":[{"type":"academic_book","ref":"Lintott, A. The Constitution of the Roman Republic. Oxford University Press, 1999."}],"reviewVariants":[{"id":"rv1","type":"counterfactual","objective":true,"prompt":"Um cônsul romano decide governar sozinho e atropelar o colega. O sistema previa que…","options":["O colega podia simplesmente vetar seus atos — e em um ano os dois saíam de qualquer jeito","O Senado o coroaria rei para resolver o impasse","As assembleias eram dissolvidas até ele se acalmar"],"correct":0,"errorPath":"O desenho era à prova de ambição: dois cônsules com veto mútuo e mandato de um ano. Ninguém segurava o poder por tempo suficiente para virar o rei que Roma jurou nunca mais ter."}]},{"id":"governo-misto","text":"A descrição de Políbio da constituição romana como 'governo misto' (cônsules, Senado, assembleias) influenciou a doutrina moderna da separação de poderes, via Montesquieu.","epistemicClass":"accepted_hypothesis","consensusPct":85,"sources":[{"type":"primary_source","ref":"Políbio. Histórias, Livro VI (séc. II a.C.)."},{"type":"academic_book","ref":"Lintott, A. The Constitution of the Roman Republic. Oxford University Press, 1999. (cap. sobre Políbio e a recepção moderna)"}],"reviewVariants":[{"id":"rv1","type":"connection","objective":true,"prompt":"Quando a Constituição de 1988 permite que o Congresso barre atos do Executivo, ela ecoa diretamente…","options":["A tese do governo misto: poder só é contido por outro poder (Políbio, relido por Montesquieu)","O sorteio ateniense de magistrados","O caráter vitalício do Senado romano"],"correct":0,"errorPath":"O freio entre poderes vem da leitura que o Iluminismo fez de Roma: Políbio descreveu a máquina de equilíbrios, Montesquieu a transformou em doutrina, e 1988 a herdou."}]},{"id":"quao-democratica","text":"O grau em que a República Romana era efetivamente democrática — e não uma oligarquia com fachada eleitoral — é objeto de debate historiográfico ativo.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"academic_book","ref":"Millar, F. The Crowd in Rome in the Late Republic. University of Michigan Press, 1998."},{"type":"academic_book","ref":"Mouritsen, H. Plebs and Politics in the Late Roman Republic. Cambridge University Press, 2001."}],"debate":{"question":"A República era uma oligarquia disfarçada — ou uma democracia que não reconhecemos?","positions":[{"view":"Democracia real: as assembleias populares votavam leis e elegiam magistrados; a política se fazia na rua, diante da multidão (Millar).","acceptance":"minoritária influente"},{"view":"Oligarquia de fato: riqueza, clientelas e o Senado controlavam os resultados; eleição não bastava para haver democracia (tradição de Gelzer e Syme; Mouritsen).","acceptance":"majoritária, com nuances"}]}}],"connections":[{"to":"iluminismo","type":"influence"},{"to":"constituicao-brasileira-1988","type":"echo"},{"to":"democracia-ateniense","type":"contrast"}],"lessons":[{"id":"nao-obrigado-atenas","title":"Não, obrigado, Atenas","hook":"Ano 509 a.C. Roma acaba de expulsar seu último rei — e jurou nunca mais ter outro. A cidade precisa decidir o que fazer com o poder que sobrou. O que você faria com ele?","narrative":["Roma escolheu algo que nenhum rei aprovaria: **fatiou o poder e colocou prazo de validade nele**. No lugar do rei, dois cônsules — eleitos, por um ano, cada um com poder de **vetar** o outro. Ninguém seguraria o poder por tempo suficiente para virar tirano.","E o sorteio ateniense, que tratava qualquer cidadão como capaz de governar? Roma conhecia a ideia — e recusou. Cargos públicos eram conquistados por **eleição**, subindo degrau por degrau uma escada obrigatória de carreira, o *cursus honorum*. Antes de mandar, era preciso ter servido.","Mas havia um detalhe que os romanos não gostavam de anunciar: quem de fato dava o tom era o **Senado** — um conselho de ex-magistrados, aristocrático, vitalício, que ninguém elegia diretamente."],"echoes":[],"interactions":[{"id":"i1","type":"situated_decision","claimId":"poder-fatiado","objective":false,"prompt":"O rei caiu. O poder está nas suas mãos. O que você faz com ele?","options":["Entrego ao povo, com sorteio, como Atenas fará","Divido entre dois chefes eleitos, com mandato de um ano","Escolho um rei melhor, com conselheiros"],"errorPath":"Não há resposta errada — mas repare no que Roma escolheu: dividir, encurtar e vigiar o poder. O medo de Roma não era só de reis; era de qualquer pessoa com poder demais."},{"id":"i2","type":"causal","claimId":"recusa-sorteio","objective":true,"prompt":"Por que Roma recusou o sorteio ateniense para seus cargos principais?","options":["Desconfiava do cidadão comum no comando: preferia eleição, hierarquia e experiência comprovada (cursus honorum)","Copiou o modelo espartano de reis duplos, que não usava sorteio","O sorteio exigia registros escritos que Roma ainda não tinha"],"correct":0,"errorPath":"A comparação com Esparta é tentadora (dois cônsules, dois reis…), mas o motivo registrado é outro: para a elite romana, governar exigia mérito demonstrado em serviço — cada degrau do cursus honorum era um teste. O sorteio tratava todos como iguais; Roma achava isso perigoso."},{"id":"i3","type":"source_interpretation","claimId":"quao-democratica","objective":false,"prompt":"As assembleias romanas votavam leis e elegiam cônsules. Então… era uma democracia? Historiadores discordam — explore o debate.","errorPath":"Debate historiográfico real, sem resposta fechada: o valor está em entender por que eleger não é o mesmo que governar."}],"connection":"Agora você entende melhor: ✔ por que \"república\" e \"democracia\" não são sinônimos ✔ de onde vem a palavra veto ✔ por que mandatos têm prazo ✔ o que Atenas e Roma discordavam sobre você."},{"id":"maquina-de-equilibrios","title":"A máquina de equilíbrios","hook":"Um grego levado a Roma como refém passou dezessete anos observando a máquina romana por dentro. Políbio saiu convencido: era o governo mais estável que o mundo já tinha visto. O que ele viu?","narrative":["Políbio viu **três governos dentro de um**: os cônsules agiam como reis (por um ano), o Senado como aristocracia, as assembleias como democracia — e cada um podia **frear** os outros. Nenhuma das três formas puras sobrevivia sozinha, ele argumentou; misturadas e em tensão, se corrigiam.","Essa ideia — **poder só é contido por outro poder** — hibernou por séculos. Até que, no Iluminismo, Montesquieu releu os antigos e a transformou na doutrina da **separação de poderes**: Executivo, Legislativo, Judiciário. De lá, ela saltou para as constituições modernas — inclusive a que vale sobre você hoje."],"echoes":[],"interactions":[{"id":"i1","type":"counterfactual","claimId":"poder-fatiado","objective":true,"prompt":"Se os cônsules não tivessem prazo de um ano nem veto mútuo, o que Políbio preveria?","options":["Deriva para a tirania — para ele, era o freio entre os poderes que estabilizava Roma","Nada mudaria: o Senado mandava de qualquer forma","As assembleias populares tomariam o poder imediatamente"],"correct":0,"errorPath":"O Senado era fortíssimo — mas é exatamente esse o ponto de Políbio: nenhuma das três forças bastava sozinha nem podia ser deixada sem freio. Um cônsul sem prazo e sem veto era, na prática, o rei que Roma tinha jurado nunca mais ter."},{"id":"i2","type":"causal","claimId":"governo-misto","objective":true,"prompt":"Por que a Constituição de 1988 separa Executivo, Legislativo e Judiciário?","options":["Herda, via Montesquieu, a tese antiga de que poder só é contido por outro poder","Foi uma exigência da ONU para constituições do século XX","Copiou diretamente o modelo ateniense de sorteio entre os três poderes"],"correct":0,"errorPath":"Atenas é o ancestral da ideia de que o povo decide — mas a arquitetura de poderes separados que se vigiam vem da leitura que Montesquieu fez de Roma (e de Políbio). O fio é real: Antiguidade → Iluminismo → 1988. Você acabou de percorrê-lo."}],"connection":"Agora você entende melhor: ✔ a separação de poderes que estrutura o Brasil ✔ por que o seu voto elege, e não sorteia ✔ o fio completo Atenas → Roma → Iluminismo → 1988."}]},{"id":"resgate-dos-antigos","domain":"history","era":"renascimento","place":"Renascimento","emblem":"📖","name":"O resgate dos antigos","sensitive":false,"journeys":["a-ideia-renasce"],"positionInJourney":{"a-ideia-renasce":1},"claims":[{"id":"cadeia-de-copistas","text":"A queda de Roma no Ocidente não apagou os textos antigos: mosteiros medievais, o Império Bizantino e o mundo islâmico os copiaram, traduziram e preservaram durante séculos.","epistemicClass":"established_fact","consensusPct":93,"sources":[{"type":"academic_book","ref":"Reynolds, L. D.; Wilson, N. G. Scribes and Scholars: A Guide to the Transmission of Greek and Latin Literature. Oxford University Press, 4ª ed., 2013."}],"reviewVariants":[{"id":"rv1","type":"counterfactual","objective":true,"prompt":"Se nenhum mosteiro, biblioteca bizantina ou tradutor árabe tivesse copiado os antigos, o mais provável é que…","options":["Montesquieu jamais teria lido Políbio — a corrente que liga Roma a 1988 se romperia no primeiro elo","Nada mudaria: as ideias sobrevivem sozinhas, sem suporte físico","O Renascimento teria acontecido do mesmo jeito, apenas mais cedo"],"correct":0,"errorPath":"Ideias não flutuam: viajam em pergaminho, papel e tinta. Cada texto antigo que chegou ao Iluminismo sobreviveu porque alguém — num mosteiro, em Bizâncio, em Bagdá — escolheu copiá-lo. Sem copistas, sem corrente; sem corrente, sem 1988."}]},{"id":"cacadores-de-manuscritos","text":"No Renascimento, humanistas italianos caçaram e redescobriram manuscritos antigos esquecidos, e a imprensa de Gutenberg (c. 1450) multiplicou sua circulação pela Europa.","epistemicClass":"established_fact","consensusPct":92,"sources":[{"type":"reference_work","ref":"Kraye, J. (org.). The Cambridge Companion to Renaissance Humanism. Cambridge University Press, 1996."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"Por que a imprensa mudou o destino dos textos antigos redescobertos?","options":["Um manuscrito achado virava milhares de cópias — a ideia deixava de depender de um único pergaminho frágil","Porque a imprensa corrigia os erros dos copistas automaticamente","Porque só a partir dela os textos foram traduzidos do grego"],"correct":0,"errorPath":"O achado de um caçador de manuscritos ainda era um objeto único e perecível. A imprensa transformou sobrevivência em abundância: depois de impressa, uma ideia não podia mais ser perdida num incêndio — nem confiscada de todos ao mesmo tempo."}]},{"id":"vocabulario-republicano","text":"A redescoberta dos textos políticos antigos realimentou o pensamento cívico renascentista, repondo em circulação o vocabulário republicano (liberdade, virtude cívica, governo misto).","epistemicClass":"accepted_hypothesis","consensusPct":82,"sources":[{"type":"academic_book","ref":"Skinner, Q. The Foundations of Modern Political Thought. Cambridge University Press, 1978."},{"type":"academic_book","ref":"Pocock, J. G. A. The Machiavellian Moment. Princeton University Press, 1975."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Maquiavel escreve sobre repúblicas lendo obsessivamente os historiadores de Roma. Isso ilustra…","options":["O vocabulário republicano antigo voltando a circular — os renascentistas pensavam o presente com palavras resgatadas do passado","Uma curiosidade de erudito, sem efeito sobre a política da época","A invenção renascentista de ideias que os antigos nunca tiveram"],"correct":0,"errorPath":"Não era erudição decorativa: as cidades italianas discutiam liberdade e tirania com as palavras de Roma. O resgate dos textos devolveu à Europa um vocabulário político inteiro — o mesmo que o Iluminismo herdaria."}]},{"id":"ruptura-ou-continuidade","text":"O quanto o Renascimento foi uma ruptura com a Idade Média — ou a aceleração de continuidades medievais — é objeto de debate historiográfico.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"academic_book","ref":"Burckhardt, J. A cultura do Renascimento na Itália (1860)."},{"type":"academic_book","ref":"Haskins, C. H. The Renaissance of the Twelfth Century. Harvard University Press, 1927."}],"debate":{"question":"O Renascimento rompeu com a Idade Média — ou a Idade Média já vinha renascendo há séculos?","positions":[{"view":"Ruptura: o Renascimento italiano inaugura o indivíduo e o mundo modernos (tradição de Burckhardt).","acceptance":"clássica, hoje muito matizada"},{"view":"Continuidade: houve 'renascimentos' medievais (séc. XII) e a fronteira é invenção posterior (Haskins e medievalistas).","acceptance":"amplamente aceita como corretivo"}]}}],"connections":[{"to":"republica-romana","type":"influence"},{"to":"democracia-ateniense","type":"influence"},{"to":"iluminismo","type":"influence"}],"lessons":[{"id":"quem-guardou-a-chama","title":"Quem guardou a chama?","hook":"Roma caiu. Séculos de invasões, incêndios e esquecimento. E no entanto, 1.300 anos depois, Montesquieu abre o Livro VI de Políbio e o lê como se fosse novo. Como esse texto chegou vivo até ele?","narrative":["A resposta é uma corrente de mãos improváveis. Monges copistas que passavam a vida reproduzindo, letra por letra, textos de autores pagãos que sua fé nem sempre aprovava. Bibliotecas de Bizâncio, onde o grego nunca morreu. Tradutores do mundo islâmico, que verteram os antigos para o árabe em Bagdá e Córdoba — e os devolveram à Europa por Toledo e pela Sicília.","Nenhum de ução Americana (1776-1787) transformou as teses iluministas em uma constituição escrita, com separação de poderes e freios e contrapesos.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"academic_book","ref":"Wood, G. S. The Creation of the American Republic, 1776-1787. University of North Carolina Press, 1969."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"Por que escrever a constituição num documento foi um gesto tão radical em 1787?","options":["Porque colocou o governo inteiro debaixo de um texto que qualquer cidadão pode ler e invocar — o poder virou cláusula","Porque nunca ninguém havia escrito leis antes","Porque o papel era um material raro e caro"],"correct":0,"errorPath":"Leis escritas existiam desde a Antiguidade. O inédito foi outro: escrever O PRÓPRIO GOVERNO — seus poderes, seus limites, seus freios — num documento acima de qualquer governante. O rei virou réu em potencial; o texto virou soberano."}]},{"id":"declaracao-1789","text":"A Revolução Francesa (1789) derrubou o absolutismo e proclamou, na Declaração dos Direitos do Homem e do Cidadão, que a soberania reside na nação.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"primary_source","ref":"Declaração dos Direitos do Homem e do Cidadão (1789), art. 3º."},{"type":"academic_book","ref":"Doyle, W. The Oxford History of the French Revolution. Oxford University Press, 1989."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"\"Todo poder emana do povo\" — art. 1º da Constituição de 1988. Essa frase é descendente direta de…","options":["Da soberania da nação proclamada em 1789 — que por sua vez descende de Locke, que descende da aposta de Atenas","De uma inovação exclusivamente brasileira de 1988","Do direito divino dos reis, adaptado"],"correct":0,"errorPath":"A frase tem árvore genealógica: Atenas apostou que o poder pertence ao demos; Locke fez disso contrato; 1789 fez disso lei; 1988 a her
