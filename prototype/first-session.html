/* Conteúdo compilado, injetado por tools/build-prototype.ts — NÃO editar à mão. */
const PACKAGE = {"compiledAt":"2026-07-20","glossary":[{"id":"democracia","term":"Democracia","match":["democracia","democrática","democrático","democráticas","democráticos"],"definition":"Do grego dēmos (povo) + kratos (poder): governo em que o poder emana do conjunto dos cidadãos. O que conta como \"povo\" mudou — e muito — ao longo de 2.500 anos."},{"id":"oligarquia","term":"Oligarquia","match":["oligarquia","oligarquias","oligárquica"],"definition":"Governo de poucos (oligoi). Na prática: quando um grupo pequeno — por riqueza, família ou influência — controla as decisões, mesmo sob instituições formalmente abertas."},{"id":"aristocracia","term":"Aristocracia","match":["aristocracia","aristocrata","aristocratas","aristocrático","aristocrática","aristocráticas","aristocráticos"],"definition":"Governo dos \"melhores\" (aristoi) — na prática, das grandes famílias de nascimento e riqueza. Em Atenas, a eleição era vista como aristocrática porque favorecia quem tinha nome, fortuna e oratória."},{"id":"sorteio","term":"Sorteio","match":["sorteio","sorteava","sorteado","sorteados","sortear","sorteava-se"],"definition":"Seleção de governantes ao acaso entre os cidadãos. Para os atenienses, o método mais democrático que existe: trata todos como igualmente capazes de governar."},{"id":"demos","term":"Demos","match":["demos"],"definition":"O corpo de cidadãos de uma pólis grega — o \"povo\" da palavra democracia. Em Atenas, uma minoria dos habitantes."},{"id":"metecos","term":"Metecos","match":["metecos","meteco"],"definition":"Estrangeiros residentes em Atenas: livres, pagavam impostos, serviam no exército — e nunca votavam."},{"id":"assembleia","term":"Assembleia","match":["assembleia","assembleias"],"definition":"Reunião dos cidadãos com direito a voto. Em Atenas, decidia quase tudo; em Roma, votava leis e elegia magistrados — sob forte influência das elites."},{"id":"tirania","term":"Tirania","match":["tirania","tirano"],"definition":"Para os antigos, o poder tomado ou exercido sem freios — não necessariamente cruel, mas sem limite. O medo que desenhou tanto Atenas quanto Roma."},{"id":"republica","term":"República","match":["república","republicano","republicana"],"definition":"Do latim res publica, \"coisa pública\": governo sem rei, com o poder distribuído em instituições. Não é, por si só, sinônimo de democracia."},{"id":"veto","term":"Veto","match":["veto","vetar"],"definition":"Do latim \"eu proíbo\". O poder de um cônsul barrar a decisão do outro — a origem romana da ideia de que poder freia poder."},{"id":"consul","term":"Cônsul","match":["cônsul","cônsules"],"definition":"Um dos dois chefes do executivo romano: eleito, mandato de um ano, e cada um com poder de vetar o outro."},{"id":"senado","term":"Senado","match":["senado"],"definition":"Conselho de ex-magistrados romanos — vitalício, aristocrático, não eleito diretamente. O centro de gravidade da política republicana."},{"id":"magistratura","term":"Magistratura","match":["magistraturas","magistrados","magistrado"],"definition":"Os cargos públicos de Roma (questor, edil, pretor, cônsul…), conquistados por eleição, degrau por degrau."},{"id":"cursus-honorum","term":"Cursus honorum","match":["cursus honorum"],"definition":"\"Carreira das honras\": a escada obrigatória de cargos que um romano subia antes de chegar ao topo. Antes de mandar, era preciso ter servido."},{"id":"iluminismo","term":"Iluminismo","match":["iluminismo"],"definition":"Movimento intelectual dos séculos XVII-XVIII que releu os antigos com olhos novos — razão, direitos e a pergunta: quem autoriza o poder?"},{"id":"separacao-de-poderes","term":"Separação de poderes","match":["separação de poderes"],"definition":"A tese de que Executivo, Legislativo e Judiciário devem ser independentes e limitar uns aos outros. Montesquieu a formulou lendo Roma — e a Constituição de 1988 a herda."},{"id":"constituicao","term":"Constituição","match":["constituição"],"definition":"O conjunto de regras fundamentais que organiza o poder de um Estado. A de 1988 é a brasileira em vigor — e carrega 2.500 anos de discussão dentro dela."},{"id":"polibio","term":"Políbio","match":["políbio"],"definition":"Historiador grego (c. 200-118 a.C.) levado a Roma como refém político. Passou anos observando a máquina romana; seu Livro VI descreve a \"constituição mista\" que influenciaria Montesquieu."},{"id":"soberania","term":"Soberania","match":["soberania"],"definition":"O poder último de decidir, acima do qual não há outro. A grande disputa da jornada: ela mora no rei, em Deus — ou no povo? 1789 e 1988 responderam: na nação, no povo."},{"id":"humanistas","term":"Humanistas","match":["humanistas","humanismo","humanista"],"definition":"Estudiosos do Renascimento que caçaram, editaram e ensinaram os textos antigos — convencidos de que Grécia e Roma tinham algo a dizer ao presente."},{"id":"absolutismo","term":"Absolutismo","match":["absolutismo","absolutista"],"definition":"Regime em que o rei concentra todo o poder, sem freios institucionais — justificado, no auge, como direito divino. O alvo direto de Locke, Montesquieu e 1789."},{"id":"principado","term":"Principado","match":["principado"],"definition":"O regime que Augusto inaugurou em 27 a.C.: poder absoluto de fato, vestido com as formas da antiga República — o imperador como \"primeiro cidadão\" (princeps), não como rei."},{"id":"legiao","term":"Legião","match":["legião","legiões","legionário","legionários"],"definition":"A unidade militar central do exército romano — cerca de 5.000 soldados de infantaria. Sua capacidade de se mover rápido por todo o império dependia diretamente da malha de estradas."},{"id":"cidadania-romana","term":"Cidadania romana","match":["cidadania romana","cidadão romano","cidadãos romanos"],"definition":"Status legal que garantia proteção sob o direito romano e o direito de apelar a um tribunal romano. Começou restrita a quem nascia em Roma; em 212 d.C., o Edito de Caracala a estendeu a quase todo homem livre do império."}],"journeys":[{"id":"mod-auge-romano","kind":"module","collectionId":"imperio-romano","order":2,"title":"Auge Romano","centralQuestion":"Como um império do tamanho da Europa inteira se sustentou por 200 anos de relativa paz?","nodeOrder":["pax-romana","administracao-romana"],"comingNext":"Estado Romano, Religião e Cultura, Crises, Queda do Ocidente, Império Bizantino — em escrita","synthesis":{"question":{"id":"sintese-auge-romano","type":"connection","objective":true,"prompt":"Última pergunta deste módulo: o que realmente segurou duzentos anos de Pax Romana de pé — o acordo de poder de Augusto, ou a máquina de estradas e cidadania que vinha depois dele?","options":["As duas coisas juntas: o acordo político deu a paz interna que permitiu construir a máquina, e a máquina (estradas, direito, cidadania) tornou essa paz sustentável — uma sem a outra não teria durado 200 anos","Só o exército: Roma se sustentava por puro medo da força militar, nada mais","Só a cidadania: as pessoas amavam tanto ser romanas que a paz se sustentava sozinha"],"correct":0,"errorPath":"Nenhuma das duas peças bastava sozinha. O acordo de Augusto parou a guerra civil — mas sem estradas para mover legiões e sem um direito comum que desse às províncias um motivo para cooperar, a paz teria durado uma geração, não duzentos anos."},"reframe":["Você começou este módulo com uma pergunta: como um império tão grande se sustentou por tanto tempo? A resposta não é uma coisa só — é um acordo político (Augusto trocando o título de rei pelo poder de rei) somado a uma infraestrutura física e legal que tornou esse acordo funcional em escala: estradas que moviam legiões em semanas, direito que dava a um provincial um motivo real para preferir Roma a se revoltar.","E você viu também a borda dessa história: a mesma paz que os historiadores medem em estradas e comércio foi, para quem estava do lado errado da conquista, o nome dado à derrota. As duas coisas são verdadeiras ao mesmo tempo — e é isso que torna esse período mais interessante que um simples \"a paz durou 200 anos\"."],"shift":{"before":"Pax Romana: duzentos anos de paz no império romano","after":"Pax Romana: um acordo de poder sustentado por estradas e cidadania — paz de verdade para uns, conquista contínua para outros"}}},{"id":"mod-grecia-democracia","kind":"module","collectionId":"grecia-antiga","order":1,"title":"Nascimento da Democracia","centralQuestion":"De onde veio a ideia de que o povo pode governar?","nodeOrder":["democracia-ateniense"],"comingNext":"Mais salões da Grécia Antiga em escrita — o Arquivo não para"},{"id":"mod-republica-imperio","kind":"module","collectionId":"imperio-romano","order":1,"title":"Nascimento do Império","centralQuestion":"Se a democracia já existia em Atenas, por que Roma inventou outra máquina de poder?","nodeOrder":["republica-romana"],"comingNext":"Auge Romano, Estado Romano, Crises, Queda do Ocidente, Império Bizantino — em escrita"},{"id":"mod-resgate-luzes","kind":"module","collectionId":"iluminismo","order":1,"title":"O Resgate e as Luzes","centralQuestion":"Como uma ideia apagada por mil anos volta a acender o mundo?","nodeOrder":["resgate-dos-antigos","iluminismo"],"comingNext":"Novos módulos do Iluminismo em escrita — o Arquivo não para","synthesis":{"question":{"id":"sintese-resgate-luzes","type":"connection","objective":true,"prompt":"Última pergunta deste módulo: o que copistas medievais, humanistas do Renascimento e filósofos como Locke e Montesquieu fizeram com as ideias antigas foi…","options":["Religar um fio que o tempo tinha cortado: preservar, redescobrir e depois reler os textos antigos com perguntas novas — nunca inventar do zero","Inventar ideias completamente novas, sem relação com o mundo antigo","Traduzir os textos antigos sem mudar nada do que diziam"],"correct":0,"errorPath":"Nada aqui nasceu do nada nem ficou intacto. Mosteiros e o mundo islâmico guardaram os textos; humanistas os caçaram e imprimiram; Locke e Montesquieu os leram de novo — e mudaram a pergunta de \"quem deve mandar\" para \"o que autoriza o poder\". Preservar, redescobrir, reler: esse é o fio."},"reframe":["Você começou este módulo com uma pergunta: como uma ideia apagada por mil anos volta a acender o mundo? A resposta é que ela nunca ficou de fato apagada — ficou guardada, à espera de alguém que a lesse de novo com os problemas do seu próprio tempo.","Montesquieu não copiou Políbio: ele o leu perguntando por que reis absolutos deveriam temer um poder que se freia sozinho. É essa releitura — não a cópia — que vira Revolução."],"shift":{"before":"O Iluminismo inventou a ideia de limitar o poder","after":"O Iluminismo releu uma ideia antiga com uma pergunta nova — e foi a pergunta nova que mudou o mundo"}}},{"id":"mod-revolucoes","kind":"module","collectionId":"revolucoes-atlanticas","order":1,"title":"As Revoluções Atlânticas","centralQuestion":"Como uma teoria de filósofo vira artigo de constituição?","nodeOrder":["revolucoes-atlanticas"],"comingNext":"Mais módulos das Revoluções Atlânticas em escrita — o Arquivo não para"},{"id":"trilha-como-nasceu-a-democracia","kind":"trail","order":1,"title":"Como nasceu a Democracia","icon":"🏛️","centralQuestion":"De onde veio a ideia de que o povo pode governar — e como ela sobreviveu 2.500 anos sem desaparecer?","thread":"Atenas → Roma → Copistas → Iluminismo → Revoluções → você","unlockAfterCollection":"imperio-romano","discoveryHook":"Nunca pensei que essas histórias fossem a mesma história.","discoveryIntro":"Enquanto organizávamos os registros de Roma… encontrei um fio curioso.","nodeOrder":["democracia-ateniense","republica-romana","resgate-dos-antigos","iluminismo","revolucoes-atlanticas"],"comingNext":"Novas trilhas em escrita — o Arquivo não para","synthesis":{"question":{"id":"sintese-democracia-trilha","type":"connection","objective":true,"prompt":"Última pergunta — e ela atravessa dois mil e quinhentos anos. Como a ideia de que o povo pode governar sobreviveu de Atenas até a Constituição de 1988?","options":["Por uma corrente de escolhas: Atenas propôs, Roma remontou em máquina de eleições e freios, copistas e humanistas preservaram e redescobriram, filósofos releram, revoluções promulgaram — cada época reacendeu a chama para responder ao próprio tempo","Ficou escondida, intacta, num livro só, até alguém achá-la pronta","Foi inventada do zero pelo Iluminismo, sem relação com Atenas ou Roma"],"correct":0,"errorPath":"Você viu cada elo: nada estava intacto nem foi inventado do zero. Atenas deu o nome e a justificativa (o povo como fonte do poder); Roma deu a máquina (eleição, mandato, veto); monges e humanistas guardaram e redescobriram os textos; Montesquieu os releu; a Filadélfia e Paris promulgaram; 1988 escreveu em português. Sobreviver, para uma ideia, é ser escolhida de novo — século após século."},"reframe":["Você começou esta trilha com uma pergunta: de onde veio a ideia de que o povo pode governar — e como ela sobreviveu tanto tempo? A resposta que você atravessou é mais estranha, e mais bonita, do que parece: a democracia não foi inventada uma vez, nem sobreviveu sozinha. Ela foi proposta por Atenas, remontada por Roma, guardada por copistas, redescoberta por humanistas, relida por filósofos e promulgada por revoluções — um elo escolhendo reacender o anterior, geração após geração.","Da próxima vez que você votar, repare: o gesto é romano, a justificativa é ateniense, a doutrina que separa os poderes veio de uma releitura do Iluminismo — e a escolha de manter essa chama acesa, agora, é sua."],"shift":{"before":"Democracia: um sistema que a Grécia inventou e que chegou pronto até nós","after":"Democracia: uma corrente de 2.500 anos de gente escolhendo reacender a mesma pergunta — e você é o elo mais recente"}}}],"nodes":[{"id":"administracao-romana","domain":"history","era":"antiguidade","place":"As Províncias","emblem":"🛣️","name":"A Máquina do Império","sensitive":false,"journeys":["mod-auge-romano"],"positionInJourney":{"mod-auge-romano":2},"claims":[{"id":"malha-de-estradas","text":"O império construiu e manteve uma rede de mais de 80.000 km de estradas pavimentadas, concebida primariamente para movimentação militar rápida de legiões, que também acelerou comércio e comunicação administrativa entre Roma e as províncias.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"academic_book","ref":"Chevallier, R. Roman Roads. University of California Press, 1976."},{"type":"academic_book","ref":"Laurence, R. The Roads of Roman Italy. Routledge, 1999."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"Por que as estradas romanas foram construídas primeiro para as legiões, e só depois viraram rotas de comércio?","options":["Um império do tamanho de Roma só se defendia se conseguisse mover exércitos rápido até a fronteira certa, a tempo — a prioridade era militar","Os comerciantes pressionaram o Senado a financiar a construção","As estradas surgiram como projeto de urbanização das cidades, sem relação com o exército"],"correct":0,"errorPath":"A rede começou como infraestrutura militar — legiões precisavam alcançar qualquer fronteira em semanas, não meses. O comércio se beneficiou depois, andando sobre uma estrada que a guerra construiu primeiro."}]},{"id":"direito-unificador","text":"A extensão progressiva da cidadania romana e de um direito comum a povos conquistados funcionou como mecanismo de integração política, culminando no Edito de Caracala (212 d.C.), que estendeu a cidadania a quase todos os homens livres do império.","epistemicClass":"accepted_hypothesis","consensusPct":85,"sources":[{"type":"academic_book","ref":"Sherwin-White, A. N. The Roman Citizenship. Oxford University Press, 1973."},{"type":"academic_book","ref":"Ando, C. Imperial Rome AD 193 to 284. Edinburgh University Press, 2012."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Um provincial recém-tornado cidadão romano, no auge do império, ganhava com isso…","options":["Proteção legal e direitos antes reservados a quem nascia em Roma — um vínculo formal com o Estado, não só militar","Isenção total de impostos pelo resto da vida","O direito automático de sentar no Senado"],"correct":0,"errorPath":"Cidadania romana era, sobretudo, proteção jurídica — o direito de apelar a um tribunal romano, entre outras garantias. Não isentava de impostos nem dava assento automático no Senado; era um vínculo legal, não um prêmio econômico."}]},{"id":"romanizacao-debate","text":"O quanto a estabilidade do império dependia de \"romanização\" cultural genuína das elites provinciais versus coerção militar e interesse econômico em cooperar é um debate historiográfico ativo, com revisões recentes questionando o próprio conceito de \"romanização\" como narrativa única.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"academic_book","ref":"Woolf, G. Becoming Roman: The Origins of Provincial Civilization in Gaul. Cambridge University Press, 1998."},{"type":"academic_book","ref":"Mattingly, D. Imperialism, Power, and Identity: Experiencing the Roman Empire. Princeton University Press, 2011."}],"debate":{"question":"O império se sustentava porque as elites locais \"queriam ser romanas\", ou porque era vantajoso fingir que sim?","positions":[{"view":"Romanização real: elites provinciais adotaram língua, direito, arquitetura e carreira romana por identificação genuína com o projeto imperial.","acceptance":"tradicional, ainda influente"},{"view":"Cooperação interessada: elites locais adotavam símbolos romanos para preservar poder e privilégio local — a categoria \"romanização\" simplifica experiências muito diferentes entre regiões do império.","acceptance":"revisionista, crescente"}]}}],"connections":[{"to":"pax-romana","type":"influence"},{"to":"iluminismo","type":"influence"},{"to":"constituicao-brasileira-1988","type":"echo"}],"lessons":[{"id":"as-estradas-que-seguravam-o-mundo","title":"As estradas que seguravam o mundo","hook":"Uma revolta acabou de estourar na fronteira do Reno, a mais de mil quilômetros de Roma. Uma legião precisa chegar lá em semanas, não meses — ou a fronteira inteira cai. O que Roma constrói primeiro, antes mesmo de qualquer templo ou fórum?","narrative":["Foram mais de 80 mil quilômetros de estrada pavimentada — o suficiente para dar duas voltas na Terra. Retas onde dava, com fundação de pedra em camadas, drenagem para não afundar na chuva. A engenharia era, antes de tudo, militar: uma legião que levava meses para cruzar terreno bruto passou a levar semanas numa via romana.","Mas uma estrada não sabe quem a usa. Atrás das legiões vinham os mercadores, os correios do governo, os viajantes — e o comércio que crescia sobre a mesma pedra que a guerra tinha assentado primeiro."],"echoes":[],"interactions":[{"id":"i1","type":"situated_decision","claimId":"malha-de-estradas","objective":false,"prompt":"Roma precisa mover legiões rápido por um território do tamanho da Europa inteira. O que ela constrói primeiro?","options":["Um exército permanente gigante em cada fronteira","Uma rede de estradas pavimentadas ligando Roma a todas as fronteiras","Navios de guerra em cada rio e costa"],"errorPath":"Manter um exército gigante parado em cada fronteira custaria mais do que Roma podia pagar. A solução foi mover rápido, não ficar parado: estradas que levassem a legião certa ao lugar certo, na hora certa."},{"id":"i2","type":"causal","claimId":"malha-de-estradas","objective":true,"prompt":"Por que as estradas romanas foram construídas primeiro para as legiões, e só depois viraram rotas de comércio?","options":["Um império do tamanho de Roma só se defendia se conseguisse mover exércitos rápido até a fronteira certa, a tempo — a prioridade era militar","Os comerciantes pressionaram o Senado a financiar a construção","As estradas surgiram como projeto de urbanização das cidades, sem relação com o exército"],"correct":0,"errorPath":"A rede começou como infraestrutura militar — legiões precisavam alcançar qualquer fronteira em semanas, não meses. O comércio se beneficiou depois, andando sobre uma estrada que a guerra construiu primeiro."},{"id":"i3","type":"application","claimId":"direito-unificador","objective":true,"prompt":"Um provincial recém-tornado cidadão romano, no auge do império, ganhava com isso…","options":["Proteção legal e direitos antes reservados a quem nascia em Roma — um vínculo formal com o Estado, não só militar","Isenção total de impostos pelo resto da vida","O direito automático de sentar no Senado"],"correct":0,"errorPath":"Cidadania romana era, sobretudo, proteção jurídica — o direito de apelar a um tribunal romano, entre outras garantias. Não isentava de impostos nem dava assento automático no Senado; era um vínculo legal, não um prêmio econômico."}],"connection":"Agora você entende melhor: ✔ por que Roma construía estradas antes de qualquer outra coisa ✔ como uma via militar virou rota de comércio ✔ que a mesma engenharia que conquistava também integrava."},{"id":"cidadao-do-mundo-a-romana","title":"Cidadão do mundo, à romana","hook":"No ano 212 d.C., o imperador Caracala assina um édito e, de um dia para o outro, quase todo homem livre do império — da Britânia à Síria — vira cidadão romano. Por que um imperador daria de graça o que Roma antes fazia povos conquistados suarem gerações para conquistar?","narrative":["A cidadania romana começou restrita — um privilégio de quem nascia em Roma ou o conquistava por serviço militar ou mérito excepcional. Mas ao longo dos séculos, o círculo foi se abrindo: primeiro para aliados italianos, depois para elites provinciais, depois para veteranos de guerra de qualquer origem.","Cada expansão trazia o mesmo pacote: proteção sob o direito romano, o direito de apelar a um tribunal romano, um vínculo formal com o Estado que ia além de \"território conquistado\". Em 212 d.C., o Edito de Caracala completou o movimento: cidadania para quase todo homem livre do império, de uma vez.","Por que fazer isso? A explicação mais aceita é fiscal e política — mais cidadãos significava mais gente sujeita a certos impostos romanos, e um império mais coeso é mais fácil de governar. Mas o quanto isso também refletia um sentimento real de pertencimento entre os provinciais é onde os historiadores discordam."],"echoes":[],"interactions":[{"id":"i1","type":"causal","claimId":"direito-unificador","objective":true,"prompt":"Por que Roma preferiu estender cidadania e direito comum aos povos conquistados, em vez de mantê-los sempre como súditos sem direitos?","options":["Um vínculo legal formal integrava e estabilizava o império de um jeito que a pura ocupação militar não conseguia sozinha","Foi uma exigência religiosa dos deuses romanos","Roma não tinha soldados suficientes para manter a ocupação militar de outra forma"],"correct":0,"errorPath":"Roma tinha exército de sobra para ocupar — a questão era o custo de manter isso para sempre. Direito e cidadania compartilhados criavam um interesse comum na estabilidade do sistema, mais barato e mais duradouro que só força."},{"id":"i2","type":"source_interpretation","claimId":"romanizacao-debate","objective":false,"prompt":"Uma elite provincial na Gália constrói um fórum ao estilo romano e manda os filhos aprenderem latim. Ela faz isso por identificação genuína com Roma, ou por cálculo de poder local? Explore o debate.","errorPath":"Debate historiográfico real, sem resposta fechada: o valor está em perceber que os dois motivos podem coexistir na mesma pessoa — e que reduzir tudo a um só é que os historiadores hoje evitam."}],"connection":"Agora você entende melhor: ✔ por que cidadania era o instrumento político mais poderoso de Roma ✔ o que motivou o Edito de Caracala ✔ por que \"romanização\" é uma palavra que historiadores hoje usam com cuidado."}]},{"id":"democracia-ateniense","domain":"history","era":"antiguidade","place":"Grécia","emblem":"🏛️","name":"A democracia ateniense","sensitive":false,"journeys":["mod-grecia-democracia","trilha-como-nasceu-a-democracia"],"positionInJourney":{"mod-grecia-democracia":1,"trilha-como-nasceu-a-democracia":1},"claims":[{"id":"sorteio-magistrados","text":"Na democracia ateniense clássica, a maioria dos cargos públicos era preenchida por sorteio, não por eleição.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"academic_book","ref":"Hansen, M. H. The Athenian Democracy in the Age of Demosthenes. Blackwell, 1991."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Uma cidade moderna decide escolher seu conselho de orçamento por sorteio entre cidadãos comuns. Um ateniense clássico diria que isso é…","options":["Profundamente democrático — era exatamente assim que Atenas preenchia a maioria dos cargos","Uma loteria irresponsável, coisa que Atenas jamais faria","Aristocrático demais para o gosto ateniense"],"correct":0,"errorPath":"Atenas preenchia a maioria dos cargos públicos por sorteio — para eles, o acaso entre iguais era a marca da democracia; a eleição é que cheirava a aristocracia."}]},{"id":"exclusao-politica","text":"Mulheres, estrangeiros residentes (metecos) e pessoas escravizadas eram excluídos da cidadania ateniense.","epistemicClass":"established_fact","consensusPct":98,"sources":[{"type":"academic_book","ref":"Hansen, M. H. The Athenian Democracy in the Age of Demosthenes. Blackwell, 1991."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Na Atenas clássica, quem destes podia votar na assembleia: um meteco rico, uma mulher de família ateniense, ou um cidadão pobre?","options":["Só o cidadão pobre — a porta não era renda: era nascimento cidadão (e ser homem)","O meteco rico — dinheiro comprava participação","A mulher de família ateniense — o nascimento dela contava"],"correct":0,"errorPath":"A porta da política ateniense não era riqueza: era o status de cidadão — que excluía mulheres, metecos e pessoas escravizadas, sempre, não importava a fortuna."}]},{"id":"clistenes-marco","text":"As reformas de Clístenes (c. 508 a.C.) são o marco convencional do nascimento da democracia ateniense.","epistemicClass":"accepted_hypothesis","consensusPct":85,"sources":[{"type":"academic_book","ref":"Ober, J. The Rise and Fall of Classical Greece. Princeton University Press, 2015."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"O que as reformas de Clístenes fizeram com o poder das grandes famílias aristocráticas?","options":["Enfraqueceram: as novas tribos misturavam regiões e quebravam os blocos de lealdade familiar","Fortaleceram: cada família ganhou uma tribo própria","Nada: as tribos eram apenas divisões religiosas"],"correct":0,"errorPath":"O golpe de Clístenes foi de engenharia social: tribos novas que misturavam cidade, costa e interior — impossível para um clã dominar uma tribo inteira. É por isso que 508 a.C. é o marco."}]},{"id":"motivacao-reformas","text":"O peso relativo do conflito entre elites e da pressão popular na origem das reformas democráticas é objeto de interpretações concorrentes.","epistemicClass":"historiographical_interpretation","consensusPct":55,"sources":[{"type":"academic_book","ref":"Ober, J. The Athenian Revolution. Princeton University Press, 1996."},{"type":"peer_reviewed_article","ref":"Anderson, G. 'The Personality of the Greek State'. Journal of Hellenic Studies 129, 2009."}],"debate":{"question":"A democracia nasceu de cima (disputa entre elites) ou de baixo (ação popular)?","positions":[{"view":"Revolução popular: a ação coletiva do demos foi decisiva (Ober).","acceptance":"ampla, mas não unânime"},{"view":"Subproduto da competição entre facções aristocráticas, formalizado por Clístenes.","acceptance":"minoritária relevante"}]}}],"connections":[{"to":"republica-romana","type":"influence"},{"to":"iluminismo","type":"influence"},{"to":"constituicao-brasileira-1988","type":"echo"}],"lessons":[{"id":"sorteio-escandaloso","title":"O sorteio que escandalizaria hoje","hook":"Você é um cidadão de Atenas, 450 a.C. Amanhã a cidade escolhe quem vai administrar o tesouro público. Como você prefere escolher?","narrative":["Se você respondeu \"votando no melhor candidato\", os atenienses discordariam de você — com veemência.","Para a democracia ateniense, **eleição era coisa de aristocrata**: quem vence eleições é quem tem nome, dinheiro e boa oratória. O método verdadeiramente democrático, para eles, era o **sorteio**. Qualquer cidadão podia ser sorteado para a maioria dos cargos públicos — do conselho que preparava as leis aos tribunais populares.","A lógica: se todo cidadão é capaz de participar do governo, o acaso é mais justo que a fama. Eleições existiam, mas eram reservadas às poucas funções que exigiam técnica comprovada — como generais."],"echoes":[],"interactions":[{"id":"i1","type":"situated_decision","claimId":"sorteio-magistrados","objective":false,"prompt":"Como você escolheria o administrador do tesouro?","options":["Eleição com candidatos","Sorteio entre os cidadãos","Indicação pelos mais ricos"],"errorPath":"Não há resposta errada aqui — mas a escolha ateniense vai te surpreender."},{"id":"i2","type":"causal","claimId":"sorteio-magistrados","objective":true,"prompt":"Por que os atenienses viam o sorteio como MAIS democrático que a eleição?","options":["Porque a eleição favorece quem tem fama, dinheiro e oratória","Porque o sorteio era mais rápido de organizar","Porque os deuses escolhiam os sorteados"],"correct":0,"errorPath":"A rapidez não era o ponto — o argumento era de igualdade: a eleição premia vantagens que nem todo cidadão tem (nome, riqueza, retórica); o sorteio trata todos os cidadãos como igualmente capazes de governar."},{"id":"i3","type":"source_interpretation","claimId":"motivacao-reformas","objective":false,"prompt":"Historiadores debatem: a democracia nasceu da ação popular ou da disputa entre elites? Explore as duas leituras.","errorPath":"Este é um debate historiográfico real — não existe resposta fechada; o valor está em conhecer as posições e suas evidências."}],"connection":"Agora você entende melhor: ✔ por que \"democracia representativa\" teria soado estranho em Atenas ✔ o debate moderno sobre sorteio em conselhos cidadãos ✔ o que Roma decidiu fazer diferente."},{"id":"quem-ficava-de-fora","title":"Quem ficava de fora","hook":"A \"cidade de todos os cidadãos\" tinha cerca de 300 mil habitantes. Quantos podiam votar na assembleia?","narrative":["Cerca de 30 mil — aproximadamente um em cada dez.","A cidadania ateniense era um clube fechado: **mulheres, estrangeiros residentes (metecos) e pessoas escravizadas ficavam fora** da vida política, sempre. O demos que se governava por sorteio era, ao mesmo tempo, radicalmente igualitário por dentro e radicalmente excludente por fora.","Isso não é um detalhe constrangedor a esconder: é a chave para entender o que a palavra \"democracia\" significava lá — e o quanto o seu significado mudou até chegar a você."],"echoes":[],"interactions":[{"id":"i1","type":"counterfactual","claimId":"exclusao-politica","objective":true,"prompt":"Se Atenas tivesse estendido a cidadania a metecos e mulheres, o que mudaria no funcionamento do sorteio?","options":["Nada no mecanismo — o sorteio funciona igual; mudaria QUEM entra no sorteio","O sorteio se tornaria impossível de organizar","A assembleia deixaria de existir"],"correct":0,"errorPath":"O mecanismo do sorteio não depende do tamanho do corpo cívico — a exclusão era uma escolha política sobre quem conta como cidadão, não uma limitação técnica do sistema."},{"id":"i2","type":"causal","claimId":"clistenes-marco","objective":true,"prompt":"Por que as reformas de Clístenes (508 a.C.) são tratadas como o marco de nascimento da democracia?","options":["Porque reorganizaram os cidadãos em tribos que quebravam o poder das famílias aristocráticas","Porque aboliram a escravidão em Atenas","Porque criaram a primeira eleição presidencial"],"correct":0,"errorPath":"A escravidão não foi abolida — e é exatamente essa convivência entre igualdade cívica e exclusão que a lição anterior mostrou. O marco de Clístenes é a reengenharia do corpo cívico: tribos novas que misturavam regiões e enfraqueciam clãs."}],"connection":"Agora você entende melhor: ✔ por que \"democracia\" antiga e moderna não são a mesma coisa ✔ os séculos de lutas por sufrágio que viriam ✔ por que a Constituição de 1988 diz \"todos\"."}]},{"id":"iluminismo","domain":"history","era":"iluminismo","place":"Iluminismo","emblem":"🪔","name":"As luzes releem os antigos","sensitive":false,"journeys":["mod-resgate-luzes","trilha-como-nasceu-a-democracia"],"positionInJourney":{"mod-resgate-luzes":2,"trilha-como-nasceu-a-democracia":4},"claims":[{"id":"contrato-locke","text":"Locke argumentou que o poder político nasce de um contrato entre as pessoas e existe para proteger seus direitos — e que um governo que os viola pode ser legitimamente trocado.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"primary_source","ref":"Locke, J. Segundo Tratado sobre o Governo Civil (1689)."},{"type":"academic_book","ref":"Dunn, J. The Political Thought of John Locke. Cambridge University Press, 1969."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Um governo moderno perde uma eleição e entrega o poder pacificamente. Qual ideia iluminista está funcionando nesse gesto?","options":["A de Locke: o poder é um contrato revogável — quem governa é empregado dos governados, não dono deles","A de que o vencedor da eleição recebe o poder por direito divino","A do sorteio ateniense de cargos"],"correct":0,"errorPath":"A troca pacífica de governo parece banal hoje — e é a tese mais radical de Locke em funcionamento: se o poder nasce de um contrato, ele pode ser retomado. Nenhum rei por direito divino 'perde a eleição'."}]},{"id":"separacao-montesquieu","text":"Montesquieu, em O Espírito das Leis (1748), formulou a doutrina moderna da separação de poderes a partir da leitura dos antigos e da constituição inglesa.","epistemicClass":"established_fact","consensusPct":94,"sources":[{"type":"primary_source","ref":"Montesquieu. O Espírito das Leis (1748), Livro XI."},{"type":"academic_book","ref":"Shklar, J. Montesquieu. Oxford University Press, 1987."}],"reviewVariants":[{"id":"rv1","type":"connection","objective":true,"prompt":"O STF derruba uma lei do Congresso; o Congresso derruba um veto do Presidente. Esse balé institucional foi coreografado por…","options":["Montesquieu, relendo a máquina de equilíbrios que Políbio descreveu em Roma","Os atenienses, no desenho original do sorteio","Os copistas medievais, ao preservar os textos"],"correct":0,"errorPath":"Cada peça dessa coreografia — poderes separados que se freiam — saiu de O Espírito das Leis, que por sua vez saiu da leitura de Roma. Os copistas preservaram a partitura; Montesquieu a reorquestrou; 1988 a executa todos os dias."}]},{"id":"pergunta-muda","text":"O Iluminismo deslocou a pergunta política central de \"quem deve mandar\" para \"o que autoriza o poder\" — fundando a legitimidade no consentimento dos governados.","epistemicClass":"accepted_hypothesis","consensusPct":84,"sources":[{"type":"academic_book","ref":"Israel, J. Radical Enlightenment: Philosophy and the Making of Modernity. Oxford University Press, 2001."}],"reviewVariants":[{"id":"rv1","type":"counterfactual","objective":true,"prompt":"Num mundo onde o Iluminismo nunca tivesse feito a pergunta \"o que autoriza o poder?\", o mais provável é que…","options":["As revoluções americana e francesa não teriam seu argumento central — derrubar um rei exigiria outro rei","As revoluções aconteceriam iguais, pois ideias não influenciam eventos","A democracia ateniense teria voltado por conta própria"],"correct":0,"errorPath":"Sem a mudança de pergunta, derrubar um rei significava apenas coroar outro. Foi o consentimento como fundamento do poder que permitiu imaginar o vazio deixado por um trono sendo preenchido por uma constituição."}]},{"id":"peso-das-ideias","text":"O peso relativo das ideias iluministas — versus crises fiscais, sociais e materiais — como causa das revoluções do século XVIII é objeto de debate historiográfico.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"academic_book","ref":"Israel, J. Democratic Enlightenment. Oxford University Press, 2011."},{"type":"academic_book","ref":"Doyle, W. The Oxford History of the French Revolution. Oxford University Press, 1989."}],"debate":{"question":"As revoluções foram filhas das ideias — ou das crises (fome, impostos, guerra)?","positions":[{"view":"As ideias como motor: sem o arsenal intelectual iluminista, as crises teriam produzido revoltas, não revoluções (Israel).","acceptance":"influente, contestada"},{"view":"As estruturas como motor: crise fiscal, fome e tensão social explodiriam de qualquer forma; as ideias deram forma, não causa (tradição social).","acceptance":"amplamente defendida"}]}}],"connections":[{"to":"democracia-ateniense","type":"influence"},{"to":"republica-romana","type":"influence"},{"to":"revolucoes-atlanticas","type":"influence"}],"lessons":[{"id":"a-pergunta-muda","title":"A pergunta muda","hook":"Durante mil anos, a pergunta política da Europa foi \"qual rei?\". De repente, em salões, cafés e panfletos, uma geração inteira começa a fazer outra pergunta — muito mais perigosa: \"por que um rei?\"","narrative":["John Locke deu a essa pergunta uma resposta explosiva: o poder não desce de Deus para o rei — sobe das pessoas para o governo. Vivemos juntos por um **contrato**: entregamos parte da nossa liberdade a um governo *para que ele proteja nossos direitos*. E um contrato, ao contrário de uma coroa, pode ser rompido. Governo que viola direitos pode ser trocado — legitimamente.","Repare no que isso faz com dois mil anos de história: a intuição ateniense de que o poder pertence ao conjunto dos cidadãos, que hibernou, foi copiada, redescoberta e rediscutida — reaparece agora como filosofia sistemática. A pergunta deixou de ser \"quem manda\" e virou \"o que autoriza quem manda\". Essa mudança de pergunta é a fundação de todas as revoluções que vêm a seguir."],"echoes":[{"node":"democracia-ateniense","text":"\"O poder emana do povo\" — Atenas apostou nisso com sorteio e assembleia; Locke devolve a aposta como teoria do contrato. É a mesma chama, 2.100 anos depois."},{"node":"resgate-dos-antigos","text":"Locke e sua geração só puderam reler os antigos porque os caçadores de manuscritos e a imprensa fizeram o trabalho que você viu no salão anterior."}],"interactions":[{"id":"i1","type":"situated_decision","claimId":"contrato-locke","objective":false,"prompt":"Ano 1690. O rei afirma: \"meu poder vem de Deus\". Um panfleto anônimo sussurra: \"o poder vem de um acordo entre nós — e acordos podem ser desfeitos\". Qual ideia te parece mais perigosa para a ordem do mundo?","options":["A do rei — concentra tudo num homem","A do panfleto — torna todo governo provisório","Nenhuma: são equivalentes"],"errorPath":"Sem resposta errada — mas repare: a ideia do panfleto é a mais subversiva já impressa até então. Se o poder é um contrato, nenhum trono do mundo está seguro. Os reis da época entenderam isso perfeitamente — e censuraram."},{"id":"i2","type":"causal","claimId":"pergunta-muda","objective":true,"prompt":"Por que mudar a pergunta de \"quem deve mandar\" para \"o que autoriza o poder\" foi tão revolucionário?","options":["Porque tornou todo governo prestador de contas: se a autorização vem dos governados, ela pode ser retirada","Porque respondeu de vez quem era o melhor rei","Porque eliminou a necessidade de qualquer governo"],"correct":0,"errorPath":"A pergunta antiga sempre tinha um vencedor sentado num trono. A nova pergunta não coroa ninguém — ela põe todo ocupante do poder, qualquer um, sob condição. É a diferença entre trocar de rei e abolir a lógica dos reis."},{"id":"i3","type":"source_interpretation","claimId":"peso-das-ideias","objective":false,"prompt":"Foram as ideias que derrubaram os tronos — ou a fome, os impostos e as guerras? Historiadores discordam. Explore.","errorPath":"Debate aberto e importante: a resposta calibra o quanto você acredita que livros mudam o mundo — e o quanto o mundo muda os livros."}],"connection":"Agora você entende melhor: ✔ por que \"consentimento dos governados\" é a frase mais importante da política moderna ✔ o que Locke deve a Atenas ✔ por que os reis censuravam filósofos ✔ o combustível das revoluções que vêm aí."},{"id":"a-maquina-redesenhada","title":"A máquina redesenhada","hook":"Um barão francês passa vinte anos numa biblioteca, cercado de autores mortos há dezoito séculos. Quando sai, publica um livro que os fundadores de nações vão carregar debaixo do braço. O que Montesquieu encontrou nos antigos?","narrative":["Encontrou uma máquina. Lendo Políbio e os historiadores de Roma — os mesmos textos que a corrente de copistas salvou —, Montesquieu reencontrou a velha tese romana: **poder só é contido por outro poder**. Homens não são anjos; instituições precisam desconfiar umas das outras.","Em *O Espírito das Leis* (1748), ele a reorquestrou para o mundo moderno: três poderes — o que faz as leis, o que as executa, o que julga — separados, independentes, vigiando-se. Não porque três seja um número mágico, mas porque poder concentrado, em qualquer mão, sempre termina no mesmo lugar. Roma sabia. Montesquieu relembrou. E as revoluções que vêm a seguir vão transformar o capítulo de um livro em arquitetura de nações."],"echoes":[{"node":"republica-romana","text":"A máquina de equilíbrios de Políbio que você viu em Roma — cônsules, Senado, assembleias se freando — é exatamente o que Montesquieu está relendo. Você conheceu a partitura antes do maestro."},{"node":"resgate-dos-antigos","text":"Sem a corrente de copistas e a imprensa, a biblioteca de Montesquieu estaria vazia. O salão anterior é a condição deste."}],"interactions":[{"id":"i1","type":"causal","claimId":"separacao-montesquieu","objective":true,"prompt":"Por que Montesquieu insistia que os três poderes precisam ser SEPARADOS?","options":["Porque poder concentrado numa só mão tende à tirania — só outro poder consegue frear um poder","Porque três instituições trabalham mais rápido que uma","Porque a Bíblia recomendava a divisão em três"],"correct":0,"errorPath":"Eficiência não era o ponto — desconfiança era. A aposta, herdada de Roma: não confie na virtude de quem governa; desenhe instituições que se vigiem. Se uma falhar, as outras seguram. É pessimismo transformado em arquitetura."},{"id":"i2","type":"counterfactual","claimId":"separacao-montesquieu","objective":true,"prompt":"Se Montesquieu nunca tivesse lido os antigos — se a corrente de copistas tivesse falhado no elo de Políbio —, o mais provável é que…","options":["A doutrina da separação de poderes teria que ser reinventada de outro material — ou as constituições modernas seriam outras","Nada mudaria: ele teria a mesma ideia lendo qualquer coisa","A separação de poderes já existia pronta na Idade Média"],"correct":0,"errorPath":"Ideias têm genealogia. O Espírito das Leis cita os antigos em quase todas as páginas — era o material de que a doutrina foi feita. Sem o resgate, talvez outra arquitetura; certamente não esta, que é a sua."}],"connection":"Agora você entende melhor: ✔ de onde veio, elo por elo, a separação de poderes ✔ por que constituições desconfiam de todo mundo ✔ o livro que os revolucionários vão carregar ✔ o próximo salão: quando o papel vira poder."}]},{"id":"pax-romana","domain":"history","era":"antiguidade","place":"Roma Imperial","emblem":"🕊️","name":"A Pax Romana","sensitive":false,"journeys":["mod-auge-romano"],"positionInJourney":{"mod-auge-romano":1},"claims":[{"id":"fim-guerras-civis","text":"Após décadas de guerras civis, Otaviano venceu Marco Antônio em Ácio (31 a.C.) e, a partir de 27 a.C., estabeleceu o Principado — mantendo as formas republicanas (Senado, cônsules) enquanto concentrava o poder militar e político real sob o título de Augusto.","epistemicClass":"established_fact","consensusPct":96,"sources":[{"type":"academic_book","ref":"Syme, R. The Roman Revolution. Oxford University Press, 1939."},{"type":"academic_book","ref":"Eck, W. The Age of Augustus. Blackwell, 2003."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"Depois de vencer a última guerra civil, Augusto podia ter se coroado rei. Por que preferiu manter Senado e cônsules de fachada?","options":["Roma jurou nunca mais ter um rei (República romana, lição 1) — poder real sem o título evitava o destino de César","A lei romana proibia formalmente o título de rei em qualquer circunstância","O Senado ainda tinha poder militar suficiente para impedi-lo"],"correct":0,"errorPath":"O Senado já não tinha exército próprio — Augusto controlava as legiões. A escolha foi de tato: César morreu por parecer querer ser rei; Augusto aprendeu a lição e vestiu o poder absoluto com roupas republicanas."}]},{"id":"paz-romana-fato","text":"O período iniciado por Augusto é convencionalmente chamado de Pax Romana: cerca de dois séculos (27 a.C.–180 d.C.) sem grandes guerras civis no núcleo do império, o que permitiu expansão sustentada do comércio, urbanização e obras públicas.","epistemicClass":"established_fact","consensusPct":90,"sources":[{"type":"academic_book","ref":"Woolf, G. Rome: An Empire's Story. Oxford University Press, 2012."},{"type":"primary_source","ref":"Plínio, o Velho. História Natural, XXVII.3 (menção antiga à \"pax Romana\")."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Uma cidade provincial no auge da Pax Romana provavelmente via…","options":["Mais estradas, mais comércio e menos exércitos passando por perto do que em décadas de guerra civil","O mesmo nível de guerra de sempre, só que agora com Roma vencendo","Isolamento total do resto do império, sem nenhuma troca"],"correct":0,"errorPath":"\"Paz\" aqui não é silêncio total — é a ausência da guerra civil que sangrou Roma por um século. Menos legiões brigando entre si significou mais estrada livre para mercador, não um mundo sem exército nenhum."}]},{"id":"paz-para-quem","text":"O quanto essa \"paz\" foi vivida como tal pelas populações provinciais e nas fronteiras — marcadas por revoltas (Judeia, Britânia) e conquista contínua — é objeto de debate historiográfico ativo.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"primary_source","ref":"Tácito. Agricola, 30 (discurso atribuído ao chefe caledônio Cálgaco)."},{"type":"academic_book","ref":"Mattingly, D. Imperialism, Power, and Identity: Experiencing the Roman Empire. Princeton University Press, 2011."}],"debate":{"question":"A Pax Romana foi paz de verdade, ou o nome dado pelos vencedores à conquista?","positions":[{"view":"Foi uma paz real e mensurável: menos guerra civil, mais comércio, infraestrutura e integração legal — mesmo com custo real nas fronteiras.","acceptance":"majoritária"},{"view":"\"Paz\" é a palavra de quem venceu: para as províncias conquistadas à força e mantidas sob ocupação militar, o termo mascara violência estrutural contínua (Tácito atribui a Cálgaco: \"fazem um deserto e chamam de paz\").","acceptance":"minoritária influente"}]}}],"connections":[{"to":"republica-romana","type":"contrast"},{"to":"administracao-romana","type":"influence"}],"lessons":[{"id":"um-acordo-duzentos-anos","title":"Um acordo, duzentos anos","hook":"Você acabou de vencer a última guerra civil romana. Seu rival está morto, as legiões são suas, o Senado não tem exército próprio para te deter. Júlio César, seu pai adotivo, teve exatamente esse poder — e foi esfaqueado 23 vezes por parecer querer ser rei. O que você faz com o poder que sobrou?","narrative":["Foi exatamente esse o dilema de Augusto — e ele resolveu com um truque. Manteve o Senado, os cônsules, as eleições: a maquinaria inteira da República continuou funcionando, ano após ano, como se nada tivesse mudado. Mas por trás da fachada, era ele quem controlava as legiões, o tesouro e, cada vez mais, quem seria eleito para o quê.","O resultado foi chamado depois de **Principado**: Augusto era formalmente \"o primeiro cidadão\" (*princeps*), não um rei — mas ninguém em Roma tinha dúvida sobre quem mandava.","E funcionou. Depois de quase um século de guerras civis — César contra Pompeu, depois Otaviano contra Marco Antônio — o acordo de Augusto abriu duzentos anos sem que romano matasse romano por causa do trono."],"echoes":[],"interactions":[{"id":"i1","type":"situated_decision","claimId":"fim-guerras-civis","objective":false,"prompt":"O poder é seu. Como você o segura sem repetir o erro de César?","options":["Me coroo rei — o poder já é meu de qualquer jeito","Mantenho Senado e cônsules de fachada, e seguro o poder real por trás deles","Devolvo o poder ao Senado e me aposento"],"errorPath":"Roma jurou nunca mais ter um rei desde 509 a.C. — o título matou César. Augusto (como Otaviano passou a se chamar) escolheu a segunda opção: todo o poder, nenhum dos títulos que o custariam a vida."},{"id":"i2","type":"causal","claimId":"fim-guerras-civis","objective":true,"prompt":"Por que Augusto manteve Senado e cônsules em vez de simplesmente se coroar rei?","options":["Roma jurou nunca mais ter um rei — poder real sem o título evitava o destino de César","A lei romana proibia formalmente o título de rei em qualquer circunstância","O Senado ainda tinha exército próprio suficiente para impedi-lo"],"correct":0,"errorPath":"O Senado já não tinha exército — Augusto controlava as legiões sozinho. A escolha foi de tato político: César morreu por parecer querer ser rei; Augusto vestiu o mesmo poder com roupas republicanas."},{"id":"i3","type":"application","claimId":"paz-romana-fato","objective":true,"prompt":"Uma cidade provincial no auge da Pax Romana provavelmente via…","options":["Mais estradas, mais comércio e menos exércitos romanos brigando entre si do que em décadas de guerra civil","O mesmo nível de guerra de sempre, só que agora com um vencedor definido","Isolamento total do resto do império, sem nenhuma troca"],"correct":0,"errorPath":"\"Paz\" aqui não é silêncio total — é a ausência da guerra civil que sangrou Roma por um século. Menos legiões brigando entre si significou mais estrada livre para o mercador, não um mundo sem exército nenhum."}],"connection":"Agora você entende melhor: ✔ por que Roma trocou república por império sem parecer que trocou ✔ o que significa \"Pax Romana\" de verdade ✔ por que o título de rei era mais perigoso que o poder de rei."},{"id":"paz-para-quem","title":"Paz para quem?","hook":"Um general romano acaba de arrasar um povo rebelde nas fronteiras da Britânia. Um chefe local, antes de morrer em batalha, teria dito uma frase que o historiador romano Tácito registrou para a posteridade: \"Onde fazem um deserto, chamam de paz.\" Ele estava falando da mesma Pax Romana que você acabou de conhecer.","narrative":["A Pax Romana foi real: menos guerra civil, mais estrada, mais comércio, cidades crescendo sem medo de saque próximo. Mas essa paz tinha uma borda — e nela, a história muda de tom.","Nas fronteiras e nas províncias recém-conquistadas, \"paz\" muitas vezes significava **depois** da conquista, não **em vez dela**. A Judeia se revoltou mais de uma vez. A Britânia resistiu por décadas. Cada território \"pacificado\" tinha passado, primeiro, por uma guerra.","Por isso os historiadores hoje não perguntam apenas \"quão longa foi a Pax Romana\", mas **\"paz para quem, vista de onde\"**. Não existe resposta única — e essa é a resposta mais honesta que existe."],"echoes":[],"interactions":[{"id":"i1","type":"source_interpretation","claimId":"paz-para-quem","objective":false,"prompt":"Um general vitorioso e o chefe de um povo recém-conquistado descrevem a Pax Romana de formas opostas. Explore por que os historiadores levam as duas versões a sério.","errorPath":"Debate historiográfico real, sem resposta fechada: o valor está em entender que \"paz\" é uma palavra que muda de significado dependendo de quem a diz — e ambos os lados deixaram registros que sobreviveram."},{"id":"i2","type":"causal","claimId":"paz-romana-fato","objective":true,"prompt":"Por que a \"Pax Romana\" era sentida de forma tão diferente no centro do império e nas fronteiras recém-conquistadas?","options":["O centro já não tinha guerra civil para se preocupar; a fronteira ainda vivia o processo de conquista e revolta que sustentava essa paz interna","Não havia diferença nenhuma — a experiência era idêntica em todo o império","As fronteiras eram, na verdade, mais pacíficas que o centro"],"correct":0,"errorPath":"A paz interna do império dependia, em parte, de exércitos ocupados conquistando e defendendo fronteiras — a guerra não sumiu, só se deslocou para as bordas do mapa."},{"id":"i3","type":"counterfactual","claimId":"fim-guerras-civis","objective":true,"prompt":"Se Augusto tivesse perdido a batalha de Ácio para Marco Antônio, o mais provável é que…","options":["Roma continuaria em guerra civil por mais tempo, sob outro vencedor tentando o mesmo acordo","A República seria restaurada exatamente como era antes de César","Roma teria virado uma democracia direta, ao estilo ateniense"],"correct":0,"errorPath":"Nada no colapso da República apontava para uma volta ao modelo antigo — o sistema de checks do Políbio já tinha quebrado décadas antes. Alguém ia vencer a guerra civil e fazer um acordo parecido; coube a Augusto ser esse alguém."}],"connection":"Agora você entende melhor: ✔ por que \"Pax Romana\" não é sinônimo de \"sem violência\" ✔ como historiadores leem a mesma paz de lados opostos ✔ que toda fronteira do império tinha uma guerra por trás da estrada pavimentada."}]},{"id":"republica-romana","domain":"history","era":"antiguidade","place":"Roma","emblem":"🦅","name":"A República Romana","sensitive":false,"journeys":["mod-republica-imperio","trilha-como-nasceu-a-democracia"],"positionInJourney":{"mod-republica-imperio":1,"trilha-como-nasceu-a-democracia":2},"claims":[{"id":"recusa-sorteio","text":"As magistraturas principais da República Romana eram preenchidas por eleição em assembleias, não por sorteio, dentro de uma carreira hierárquica de cargos (cursus honorum).","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"academic_book","ref":"Lintott, A. The Constitution of the Roman Republic. Oxford University Press, 1999."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Um jovem romano ambicioso quer chegar a cônsul. O caminho dele é…","options":["Subir o cursus honorum: ser eleito cargo a cargo, provando serviço em cada degrau","Esperar seu nome ser sorteado entre os cidadãos","Comprar um assento vitalício no Senado"],"correct":0,"errorPath":"Roma recusou o sorteio ateniense: magistraturas eram conquistadas por eleição, numa escada obrigatória de experiência. Antes de mandar, era preciso ter servido."}]},{"id":"poder-fatiado","text":"O poder executivo republicano era deliberadamente limitado: dois cônsules, mandato de um ano, com poder de veto entre si.","epistemicClass":"established_fact","consensusPct":96,"sources":[{"type":"academic_book","ref":"Lintott, A. The Constitution of the Roman Republic. Oxford University Press, 1999."}],"reviewVariants":[{"id":"rv1","type":"counterfactual","objective":true,"prompt":"Um cônsul romano decide governar sozinho e atropelar o colega. O sistema previa que…","options":["O colega podia simplesmente vetar seus atos — e em um ano os dois saíam de qualquer jeito","O Senado o coroaria rei para resolver o impasse","As assembleias eram dissolvidas até ele se acalmar"],"correct":0,"errorPath":"O desenho era à prova de ambição: dois cônsules com veto mútuo e mandato de um ano. Ninguém segurava o poder por tempo suficiente para virar o rei que Roma jurou nunca mais ter."}]},{"id":"governo-misto","text":"A descrição de Políbio da constituição romana como 'governo misto' (cônsules, Senado, assembleias) influenciou a doutrina moderna da separação de poderes, via Montesquieu.","epistemicClass":"accepted_hypothesis","consensusPct":85,"sources":[{"type":"primary_source","ref":"Políbio. Histórias, Livro VI (séc. II a.C.)."},{"type":"academic_book","ref":"Lintott, A. The Constitution of the Roman Republic. Oxford University Press, 1999. (cap. sobre Políbio e a recepção moderna)"}],"reviewVariants":[{"id":"rv1","type":"connection","objective":true,"prompt":"Quando a Constituição de 1988 permite que o Congresso barre atos do Executivo, ela ecoa diretamente…","options":["A tese do governo misto: poder só é contido por outro poder (Políbio, relido por Montesquieu)","O sorteio ateniense de magistrados","O caráter vitalício do Senado romano"],"correct":0,"errorPath":"O freio entre poderes vem da leitura que o Iluminismo fez de Roma: Políbio descreveu a máquina de equilíbrios, Montesquieu a transformou em doutrina, e 1988 a herdou."}]},{"id":"quao-democratica","text":"O grau em que a República Romana era efetivamente democrática — e não uma oligarquia com fachada eleitoral — é objeto de debate historiográfico ativo.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"academic_book","ref":"Millar, F. The Crowd in Rome in the Late Republic. University of Michigan Press, 1998."},{"type":"academic_book","ref":"Mouritsen, H. Plebs and Politics in the Late Roman Republic. Cambridge University Press, 2001."}],"debate":{"question":"A República era uma oligarquia disfarçada — ou uma democracia que não reconhecemos?","positions":[{"view":"Democracia real: as assembleias populares votavam leis e elegiam magistrados; a política se fazia na rua, diante da multidão (Millar).","acceptance":"minoritária influente"},{"view":"Oligarquia de fato: riqueza, clientelas e o Senado controlavam os resultados; eleição não bastava para haver democracia (tradição de Gelzer e Syme; Mouritsen).","acceptance":"majoritária, com nuances"}]}}],"connections":[{"to":"iluminismo","type":"influence"},{"to":"constituicao-brasileira-1988","type":"echo"},{"to":"democracia-ateniense","type":"contrast"}],"lessons":[{"id":"nao-obrigado-atenas","title":"Não, obrigado, Atenas","hook":"Ano 509 a.C. Roma acaba de expulsar seu último rei — e jurou nunca mais ter outro. A cidade precisa decidir o que fazer com o poder que sobrou. O que você faria com ele?","narrative":["Roma escolheu algo que nenhum rei aprovaria: **fatiou o poder e colocou prazo de validade nele**. No lugar do rei, dois cônsules — eleitos, por um ano, cada um com poder de **vetar** o outro. Ninguém seguraria o poder por tempo suficiente para virar tirano.","E o sorteio ateniense, que tratava qualquer cidadão como capaz de governar? Roma conhecia a ideia — e recusou. Cargos públicos eram conquistados por **eleição**, subindo degrau por degrau uma escada obrigatória de carreira, o *cursus honorum*. Antes de mandar, era preciso ter servido.","Mas havia um detalhe que os romanos não gostavam de anunciar: quem de fato dava o tom era o **Senado** — um conselho de ex-magistrados, aristocrático, vitalício, que ninguém elegia diretamente."],"echoes":[],"interactions":[{"id":"i1","type":"situated_decision","claimId":"poder-fatiado","objective":false,"prompt":"O rei caiu. O poder está nas suas mãos. O que você faz com ele?","options":["Entrego ao povo, com sorteio, como Atenas fará","Divido entre dois chefes eleitos, com mandato de um ano","Escolho um rei melhor, com conselheiros"],"errorPath":"Não há resposta errada — mas repare no que Roma escolheu: dividir, encurtar e vigiar o poder. O medo de Roma não era só de reis; era de qualquer pessoa com poder demais."},{"id":"i2","type":"causal","claimId":"recusa-sorteio","objective":true,"prompt":"Por que Roma recusou o sorteio ateniense para seus cargos principais?","options":["Desconfiava do cidadão comum no comando: preferia eleição, hierarquia e experiência comprovada (cursus honorum)","Copiou o modelo espartano de reis duplos, que não usava sorteio","O sorteio exigia registros escritos que Roma ainda não tinha"],"correct":0,"errorPath":"A comparação com Esparta é tentadora (dois cônsules, dois reis…), mas o motivo registrado é outro: para a elite romana, governar exigia mérito demonstrado em serviço — cada degrau do cursus honorum era um teste. O sorteio tratava todos como iguais; Roma achava isso perigoso."},{"id":"i3","type":"source_interpretation","claimId":"quao-democratica","objective":false,"prompt":"As assembleias romanas votavam leis e elegiam cônsules. Então… era uma democracia? Historiadores discordam — explore o debate.","errorPath":"Debate historiográfico real, sem resposta fechada: o valor está em entender por que eleger não é o mesmo que governar."}],"connection":"Agora você entende melhor: ✔ por que \"república\" e \"democracia\" não são sinônimos ✔ de onde vem a palavra veto ✔ por que mandatos têm prazo ✔ o que Atenas e Roma discordavam sobre você."},{"id":"maquina-de-equilibrios","title":"A máquina de equilíbrios","hook":"Um grego levado a Roma como refém passou dezessete anos observando a máquina romana por dentro. Políbio saiu convencido: era o governo mais estável que o mundo já tinha visto. O que ele viu?","narrative":["Políbio viu **três governos dentro de um**: os cônsules agiam como reis (por um ano), o Senado como aristocracia, as assembleias como democracia — e cada um podia **frear** os outros. Nenhuma das três formas puras sobrevivia sozinha, ele argumentou; misturadas e em tensão, se corrigiam.","Essa ideia — **poder só é contido por outro poder** — hibernou por séculos. Até que, no Iluminismo, Montesquieu releu os antigos e a transformou na doutrina da **separação de poderes**: Executivo, Legislativo, Judiciário. De lá, ela saltou para as constituições modernas — inclusive a que vale sobre você hoje."],"echoes":[],"interactions":[{"id":"i1","type":"counterfactual","claimId":"poder-fatiado","objective":true,"prompt":"Se os cônsules não tivessem prazo de um ano nem veto mútuo, o que Políbio preveria?","options":["Deriva para a tirania — para ele, era o freio entre os poderes que estabilizava Roma","Nada mudaria: o Senado mandava de qualquer forma","As assembleias populares tomariam o poder imediatamente"],"correct":0,"errorPath":"O Senado era fortíssimo — mas é exatamente esse o ponto de Políbio: nenhuma das três forças bastava sozinha nem podia ser deixada sem freio. Um cônsul sem prazo e sem veto era, na prática, o rei que Roma tinha jurado nunca mais ter."},{"id":"i2","type":"causal","claimId":"governo-misto","objective":true,"prompt":"Por que a Constituição de 1988 separa Executivo, Legislativo e Judiciário?","options":["Herda, via Montesquieu, a tese antiga de que poder só é contido por outro poder","Foi uma exigência da ONU para constituições do século XX","Copiou diretamente o modelo ateniense de sorteio entre os três poderes"],"correct":0,"errorPath":"Atenas é o ancestral da ideia de que o povo decide — mas a arquitetura de poderes separados que se vigiam vem da leitura que Montesquieu fez de Roma (e de Políbio). O fio é real: Antiguidade → Iluminismo → 1988. Você acabou de percorrê-lo."}],"connection":"Agora você entende melhor: ✔ a separação de poderes que estrutura o Brasil ✔ por que o seu voto elege, e não sorteia ✔ o fio completo Atenas → Roma → Iluminismo → 1988."}]},{"id":"resgate-dos-antigos","domain":"history","era":"renascimento","place":"Renascimento","emblem":"📖","name":"O resgate dos antigos","sensitive":false,"journeys":["mod-resgate-luzes","trilha-como-nasceu-a-democracia"],"positionInJourney":{"mod-resgate-luzes":1,"trilha-como-nasceu-a-democracia":3},"claims":[{"id":"cadeia-de-copistas","text":"A queda de Roma no Ocidente não apagou os textos antigos: mosteiros medievais, o Império Bizantino e o mundo islâmico os copiaram, traduziram e preservaram durante séculos.","epistemicClass":"established_fact","consensusPct":93,"sources":[{"type":"academic_book","ref":"Reynolds, L. D.; Wilson, N. G. Scribes and Scholars: A Guide to the Transmission of Greek and Latin Literature. Oxford University Press, 4ª ed., 2013."}],"reviewVariants":[{"id":"rv1","type":"counterfactual","objective":true,"prompt":"Se nenhum mosteiro, biblioteca bizantina ou tradutor árabe tivesse copiado os antigos, o mais provável é que…","options":["Montesquieu jamais teria lido Políbio — a corrente que liga Roma a 1988 se romperia no primeiro elo","Nada mudaria: as ideias sobrevivem sozinhas, sem suporte físico","O Renascimento teria acontecido do mesmo jeito, apenas mais cedo"],"correct":0,"errorPath":"Ideias não flutuam: viajam em pergaminho, papel e tinta. Cada texto antigo que chegou ao Iluminismo sobreviveu porque alguém — num mosteiro, em Bizâncio, em Bagdá — escolheu copiá-lo. Sem copistas, sem corrente; sem corrente, sem 1988."}]},{"id":"cacadores-de-manuscritos","text":"No Renascimento, humanistas italianos caçaram e redescobriram manuscritos antigos esquecidos, e a imprensa de Gutenberg (c. 1450) multiplicou sua circulação pela Europa.","epistemicClass":"established_fact","consensusPct":92,"sources":[{"type":"reference_work","ref":"Kraye, J. (org.). The Cambridge Companion to Renaissance Humanism. Cambridge University Press, 1996."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"Por que a imprensa mudou o destino dos textos antigos redescobertos?","options":["Um manuscrito achado virava milhares de cópias — a ideia deixava de depender de um único pergaminho frágil","Porque a imprensa corrigia os erros dos copistas automaticamente","Porque só a partir dela os textos foram traduzidos do grego"],"correct":0,"errorPath":"O achado de um caçador de manuscritos ainda era um objeto único e perecível. A imprensa transformou sobrevivência em abundância: depois de impressa, uma ideia não podia mais ser perdida num incêndio — nem confiscada de todos ao mesmo tempo."}]},{"id":"vocabulario-republicano","text":"A redescoberta dos textos políticos antigos realimentou o pensamento cívico renascentista, repondo em circulação o vocabulário republicano (liberdade, virtude cívica, governo misto).","epistemicClass":"accepted_hypothesis","consensusPct":82,"sources":[{"type":"academic_book","ref":"Skinner, Q. The Foundations of Modern Political Thought. Cambridge University Press, 1978."},{"type":"academic_book","ref":"Pocock, J. G. A. The Machiavellian Moment. Princeton University Press, 1975."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"Maquiavel escreve sobre repúblicas lendo obsessivamente os historiadores de Roma. Isso ilustra…","options":["O vocabulário republicano antigo voltando a circular — os renascentistas pensavam o presente com palavras resgatadas do passado","Uma curiosidade de erudito, sem efeito sobre a política da época","A invenção renascentista de ideias que os antigos nunca tiveram"],"correct":0,"errorPath":"Não era erudição decorativa: as cidades italianas discutiam liberdade e tirania com as palavras de Roma. O resgate dos textos devolveu à Europa um vocabulário político inteiro — o mesmo que o Iluminismo herdaria."}]},{"id":"ruptura-ou-continuidade","text":"O quanto o Renascimento foi uma ruptura com a Idade Média — ou a aceleração de continuidades medievais — é objeto de debate historiográfico.","epistemicClass":"historiographical_interpretation","consensusPct":50,"sources":[{"type":"academic_book","ref":"Burckhardt, J. A cultura do Renascimento na Itália (1860)."},{"type":"academic_book","ref":"Haskins, C. H. The Renaissance of the Twelfth Century. Harvard University Press, 1927."}],"debate":{"question":"O Renascimento rompeu com a Idade Média — ou a Idade Média já vinha renascendo há séculos?","positions":[{"view":"Ruptura: o Renascimento italiano inaugura o indivíduo e o mundo modernos (tradição de Burckhardt).","acceptance":"clássica, hoje muito matizada"},{"view":"Continuidade: houve 'renascimentos' medievais (séc. XII) e a fronteira é invenção posterior (Haskins e medievalistas).","acceptance":"amplamente aceita como corretivo"}]}}],"connections":[{"to":"republica-romana","type":"influence"},{"to":"democracia-ateniense","type":"influence"},{"to":"iluminismo","type":"influence"}],"lessons":[{"id":"quem-guardou-a-chama","title":"Quem guardou a chama?","hook":"Roma caiu. Séculos de invasões, incêndios e esquecimento. E no entanto, 1.300 anos depois, Montesquieu abre o Livro VI de Políbio e o lê como se fosse novo. Como esse texto chegou vivo até ele?","narrative":["A resposta é uma corrente de mãos improváveis. Monges copistas que passavam a vida reproduzindo, letra por letra, textos de autores pagãos que sua fé nem sempre aprovava. Bibliotecas de Bizâncio, onde o grego nunca morreu. Tradutores do mundo islâmico, que verteram os antigos para o árabe em Bagdá e Córdoba — e os devolveram à Europa por Toledo e pela Sicília.","Nenhum deles sabia que estava salvando a democracia. Cada um tinha seus motivos: fé, ofício, curiosidade, encomenda. Mas cada cópia era um elo — e bastava um elo falhar para uma obra inteira desaparecer para sempre. Muitas desapareceram. As que você estudou até aqui são as sobreviventes."],"echoes":[{"node":"republica-romana","text":"O Livro VI de Políbio — aquele mesmo, da máquina de equilíbrios que você viu em Roma — só existe hoje porque atravessou essa corrente de mãos."},{"node":"democracia-ateniense","text":"Os debates de Atenas que você acendeu no Corredor quase se apagaram aqui: sem os copistas, o sorteio ateniense seria hoje uma nota de rodapé perdida."}],"interactions":[{"id":"i1","type":"situated_decision","claimId":"cadeia-de-copistas","objective":false,"prompt":"Ano 800. Você é um copista num mosteiro. Nas suas mãos, um pergaminho pagão se desfazendo — as últimas cópias de um autor romano. Seu abade não vê valor nele. O que você faz?","options":["Copio mesmo assim — ofício é ofício","Deixo o tempo decidir","Uso o pergaminho para um texto sagrado"],"errorPath":"Não há resposta errada — mas repare: a sobrevivência de cada texto antigo dependeu de milhares de decisões exatamente assim, tomadas por pessoas que nunca saberemos quem foram. A História que você estudou é feita das vezes em que alguém escolheu copiar."},{"id":"i2","type":"causal","claimId":"cadeia-de-copistas","objective":true,"prompt":"Por que os textos de Atenas e Roma sobreviveram à queda do mundo antigo?","options":["Porque uma corrente de copistas, bibliotecas e tradutores — cristãos, bizantinos e muçulmanos — os reproduziu por séculos","Porque foram enterrados em cofres à prova do tempo pelos próprios romanos","Porque todos os textos importantes sobrevivem naturalmente"],"correct":0,"errorPath":"Não houve cofre nem sorte: houve trabalho. Cada geração copiou o que recebeu — em mosteiros, em Bizâncio, no mundo islâmico. A maioria dos textos antigos NÃO sobreviveu; os que você conhece são os que essa corrente segurou."},{"id":"i3","type":"source_interpretation","claimId":"ruptura-ou-continuidade","objective":false,"prompt":"Se a Idade Média copiou e guardou os antigos… ela foi mesmo uma \"idade das trevas\"? Historiadores discordam — explore.","errorPath":"Debate real: o valor está em perceber que o rótulo \"trevas\" foi inventado justamente por quem queria se apresentar como \"luz\"."}],"connection":"Agora você entende melhor: ✔ por que nenhuma ideia sobrevive sozinha ✔ o que o mundo islâmico tem a ver com a democracia moderna ✔ por que \"idade das trevas\" é um rótulo injusto ✔ de onde o Renascimento tirou matéria-prima."},{"id":"a-redescoberta","title":"A redescoberta","hook":"Inverno de 1417. Um caçador de manuscritos chamado Poggio Bracciolini vasculha a biblioteca de um mosteiro alemão e encontra um poema romano perdido havia séculos. Ele copia tudo, à mão, antes que alguém mude de ideia. A Europa está prestes a reler os antigos — e não vai gostar de tudo o que vai encontrar.","narrative":["Poggio não estava sozinho: uma geração inteira de humanistas italianos caçava manuscritos como quem caça tesouros — em mosteiros, porões e bibliotecas esquecidas. Cada achado voltava para Florença ou Roma, era copiado, discutido, comparado. E então, por volta de 1450, a caça mudou de escala: a imprensa de Gutenberg transformou cada achado único em milhares de cópias.","Com os textos, voltou um vocabulário: liberdade, virtude cívica, república, tirania. Maquiavel lia os historiadores de Roma para entender Florença. As cidades italianas discutiam o presente com palavras de dois mil anos. A ideia que você acompanhou desde Atenas saía da hibernação — não como relíquia, mas como ferramenta."],"echoes":[{"node":"democracia-ateniense","text":"\"Liberdade\", \"tirania\", \"cidadão\" — o vocabulário que Atenas cunhou e você viu nascer voltava agora a ser usado para brigar de verdade."},{"node":"republica-romana","text":"Maquiavel lendo Roma para pensar Florença é exatamente o gesto que Montesquieu repetirá 200 anos depois — e que você verá no próximo salão."}],"interactions":[{"id":"i1","type":"causal","claimId":"cacadores-de-manuscritos","objective":true,"prompt":"Por que a imprensa foi decisiva para o resgate dos antigos?","options":["Porque transformou achados únicos e frágeis em milhares de cópias impossíveis de perder ou confiscar de uma vez","Porque os humanistas pararam de procurar manuscritos depois dela","Porque ela traduzia os textos automaticamente para as línguas modernas"],"correct":0,"errorPath":"Antes da imprensa, um incêndio podia apagar uma obra da existência. Depois dela, uma ideia impressa estava em toda parte ao mesmo tempo — barata demais para queimar todas as cópias. A sobrevivência virou abundância."},{"id":"i2","type":"application","claimId":"vocabulario-republicano","objective":true,"prompt":"Maquiavel estuda obsessivamente os historiadores romanos para escrever sobre a política de Florença. O que isso revela sobre o Renascimento?","options":["Que o passado virou ferramenta: pensava-se o presente com o vocabulário político resgatado dos antigos","Que os renascentistas só queriam imitar Roma em tudo","Que a política moderna nasceu sem nenhuma relação com a antiga"],"correct":0,"errorPath":"Nem imitação nem invenção do zero: releitura. Os renascentistas pegaram o vocabulário de Roma e Atenas e o usaram para os problemas deles — exatamente o que o Iluminismo fará em seguida, e o que a Constituinte de 1988 fará depois."}],"connection":"Agora você entende melhor: ✔ como uma ideia sai da hibernação ✔ por que a imprensa é personagem da história da democracia ✔ o gesto (reler os antigos) que o Iluminismo vai repetir ✔ o que vem no próximo salão."}]},{"id":"revolucoes-atlanticas","domain":"history","era":"revolucoes","place":"Revoluções","emblem":"⚖️","name":"A ideia toma o poder","sensitive":false,"journeys":["mod-revolucoes","trilha-como-nasceu-a-democracia"],"positionInJourney":{"mod-revolucoes":1,"trilha-como-nasceu-a-democracia":5},"claims":[{"id":"constituicao-escrita","text":"A Revolução Americana (1776-1787) transformou as teses iluministas em uma constituição escrita, com separação de poderes e freios e contrapesos.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"academic_book","ref":"Wood, G. S. The Creation of the American Republic, 1776-1787. University of North Carolina Press, 1969."}],"reviewVariants":[{"id":"rv1","type":"causal","objective":true,"prompt":"Por que escrever a constituição num documento foi um gesto tão radical em 1787?","options":["Porque colocou o governo inteiro debaixo de um texto que qualquer cidadão pode ler e invocar — o poder virou cláusula","Porque nunca ninguém havia escrito leis antes","Porque o papel era um material raro e caro"],"correct":0,"errorPath":"Leis escritas existiam desde a Antiguidade. O inédito foi outro: escrever O PRÓPRIO GOVERNO — seus poderes, seus limites, seus freios — num documento acima de qualquer governante. O rei virou réu em potencial; o texto virou soberano."}]},{"id":"declaracao-1789","text":"A Revolução Francesa (1789) derrubou o absolutismo e proclamou, na Declaração dos Direitos do Homem e do Cidadão, que a soberania reside na nação.","epistemicClass":"established_fact","consensusPct":95,"sources":[{"type":"primary_source","ref":"Declaração dos Direitos do Homem e do Cidadão (1789), art. 3º."},{"type":"academic_book","ref":"Doyle, W. The Oxford History of the French Revolution. Oxford University Press, 1989."}],"reviewVariants":[{"id":"rv1","type":"application","objective":true,"prompt":"\"Todo poder emana do povo\" — art. 1º da Constituição de 1988. Essa frase é descendente direta de…","options":["Da soberania da nação proclamada em 1789 — que por sua vez descende de Locke, que descende da aposta de Atenas","De uma inovação exclusivamente brasileira de 1988","Do direito divino dos reis, adaptado"],"correct":0,"errorPath":"A frase tem árvore genealógica: Atenas apostou que o poder pertence ao demos; Locke fez disso contrato; 1789 fez disso lei; 1988 a herdou em português. Você consegue citar cada elo — porque acendeu cada salão."}]},{"id":"pacote-constitucional","text":"As constituições democráticas modernas — incluindo a brasileira de 1988 — herdam diretamente o pacote revolucionário: soberania popular, direitos declarados e separação de poderes.","epistemicClass":"accepted_hypothesis","consensusPct":88,"sources":[{"type":"primary_source","ref":"Constituição da República Federativa do Brasil (1988), art. 1º-2º."},{"type":"reference_work","ref":"Comparato, F. K. A Afirmação Histórica dos Direitos Humanos. Saraiva, 2019."}],"reviewVariants":[{"id":"rv1","type":"connection","objective":true,"prompt":"Abra a Constituição de 1988 nos artigos 1º e 2º. O que você encontra ali, em português?","options":["O pacote inteiro da jornada: soberania popular (Atenas→Locke→1789) e três poderes independentes (Roma→Montesquieu→1787)","Um sistema político sem precedentes históricos","Uma cópia literal da constituição americana"],"correct":0,"errorPath":"Nem invençã
