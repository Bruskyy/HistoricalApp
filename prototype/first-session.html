  lit: {},           // nodeId -> true
  lessonsDone: {},   // nodeId -> n
  nodeXp: 0,
  reviews: {},       // claimId -> { nodeId, dueAt, step }
  events: [],        // log local do experimento (jornada concluída, "descobrir" clicado)
  thothStageSeen: 1, // último estágio de Thoth já celebrado
  startedAt: null,   // início da dupla (o "aniversário" futuro)
  timeShift: 0,      // atalho de teste "pular dias"
}, loadState());
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
}
const now = () => Date.now() + S.timeShift;

const $ = (id) => document.getElementById(id);
const screen = () => $('screen');

let NAV_BACK = null;
function nav(backHandler, chip) {
  NAV_BACK = typeof backHandler === 'function' ? backHandler : null;
  $('backBtn').hidden = !NAV_BACK;
  $('navChip').textContent = chip ?? 'protótipo';
}
function setProgress(pct) {
  $('ptrack').hidden = pct === null;
  if (pct !== null) $('pfill').style.width = pct + '%';
}
function refreshXp() {
  $('xpChip').hidden = S.xp === 0;
  $('xpChip').textContent = S.xp + ' XP';
}
function gainXp(n, host) {
  S.xp += n; S.nodeXp += n; refreshXp(); persist();
  if (host) {
    const el = document.createElement('div');
    el.className = 'stamp'; el.textContent = '+' + n;
    host.appendChild(el);
  }
}
const THOTH_STAGES = ['Aprendiz de tinta', 'Escriba iniciado', 'Escriba do Arquivo'];
function thothStage() {
  const done = JOURNEYS.filter(journeyDone).length;
  return done >= 2 ? 3 : done >= 1 ? 2 : 1;
}
function thothAvatar(extra = '') {
  const st = thothStage();
  return `<div class="thoth s${st} ${extra}">📜${st > 1 ? `<span class="tbadge">${st === 2 ? '✒️' : '🖋️'}</span>` : ''}</div>`;
}
function thoth(text, bounce = false) {
  return `<div class="thoth-row">
    ${thothAvatar(bounce ? 'bounce' : '')}
    <div class="thoth-say">${text}</div>
  </div>`;
}
const litCount = () => NODES.filter((n) => S.lit[n.id]).length;

/* ---------- glossário (termos pontilhados + caixa flutuante) ---------- */
const GLOSSARY = PACKAGE.glossary ?? [];
const GLOSS_INDEX = new Map(GLOSSARY.map((g) => [g.id, g]));

/** Marca a 1ª ocorrência de cada termo do glossário no bloco de texto
 *  (fora de tags HTML), com sublinhado pontilhado clicável. */
function gloss(html) {
  const parts = String(html).split(/(<[^>]+>)/);
  for (const entry of GLOSSARY) {
    let done = false;
    for (let i = 0; i < parts.length && !done; i++) {
      if (parts[i].startsWith('<')) continue;
      for (const m of entry.match) {
        const re = new RegExp(`(^|[^\\p{L}])(${escapeRe(m)})(?=[^\\p{L}]|$)`, 'iu');
        if (re.test(parts[i])) {
          parts[i] = parts[i].replace(re,
            (_, pre, word) => `${pre}<span class="term" data-term="${entry.id}" role="button" tabindex="0">${word}</span>`);
          done = true;
          break;
        }
      }
    }
  }
  return parts.join('');
}
const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function closeTermBox() {
  document.querySelectorAll('.term-box').forEach((b) => b.remove());
}
document.addEventListener('click', (e) => {
  const term = e.target.closest?.('.term');
  if (!term) { closeTermBox(); return; }
  e.stopPropagation();
  closeTermBox();
  const entry = GLOSS_INDEX.get(term.dataset.term);
  if (!entry) return;
  const phone = document.querySelector('.phone');
  const box = document.createElement('div');
  box.className = 'term-box';
  box.innerHTML = `<div class="tt">${entry.term}</div><div class="td">${entry.definition}</div>`;
  phone.appendChild(box);
  const tr = term.getBoundingClientRect();
  const pr = phone.getBoundingClientRect();
  const below = tr.bottom - pr.top + 8;
  box.style.left = Math.max(18, Math.min(tr.left - pr.left, pr.width - box.offsetWidth - 18)) + 'px';
  box.style.top = (below + box.offsetHeight > pr.height - 20 ? tr.top - pr.top - box.offsetHeight - 8 : below) + 'px';
});

/* ---------- veredito de acerto/erro ---------- */
const RIGHT_WORDS = ['Exato.', 'Bem visto.', 'Isso.', 'Você pegou a ideia.'];
let rightIx = 0;
const verdictRight = () => `<div class="verdict right">✓ ${RIGHT_WORDS[rightIx++ % RIGHT_WORDS.length]}</div>`;
const verdictMiss = () => `<div class="verdict miss">✕ Ainda não…</div>`;

/* ---------- Corredor & Biblioteca (GDD §4: Biblioteca → Corredor → Salões) ---------- */
function dueReviews() {
  return Object.entries(S.reviews)
    .filter(([, r]) => r.dueAt <= now())
    .map(([claimId, r]) => ({ claimId, nodeId: r.nodeId, step: r.step ?? 0 }));
}

function nodeUnlockedInJourney(node) {
  const j = journeyOfNode(node.id);
  const pos = j.nodeOrder.indexOf(node.id);
  return pos === 0 || S.lit[j.nodeOrder[pos - 1]];
}

function rescueCardHtml(due) {
  if (!due.length) return '';
  const dueNodeIds = new Set(due.map((d) => d.nodeId));
  const duePlaces = NODES.filter((n) => dueNodeIds.has(n.id)).map((n) => n.place).join(' e ');
  return `
    <div class="card mission-card rescue">
      <p class="eyebrow">memória se apagando</p>
      <div class="mn">${due.length === 1 ? '1 memória vacilando' : due.length + ' memórias vacilando'} — ${duePlaces}</div>
      <button class="cta gold" id="rescueBtn">🔥 reacender agora — XP em dobro</button>
    </div>`;
}
function wireCommon(due) {
  const rescueBtn = $('rescueBtn');
  if (rescueBtn) rescueBtn.addEventListener('click', () => startReviewMission(due));
  const av = screen().querySelector('.thoth');
  if (av) {
    av.classList.add('tappable');
    av.setAttribute('role', 'button');
    av.setAttribute('aria-label', 'ver o pergaminho de Thoth');
    av.addEventListener('click', renderPergaminho);
  }
}

/* A Biblioteca: home de quem retorna. O primeiro uso NUNCA cai aqui —
   é guiado direto ao Corredor (VISION §17-D1: sem parede de escolha). */
function libStats(d) {
  let open = 0, soon = 0;
  for (const sh of d.shelves ?? []) {
    open += (sh.journeys ?? []).length;
    soon += (sh.upcoming ?? []).length;
  }
  return { open, soon };
}

function domainOfJourney(jid) {
  for (const d of PACKAGE.library.domains)
    for (const sh of d.shelves ?? [])
      if ((sh.journeys ?? []).includes(jid)) return d;
  return PACKAGE.library.domains[0];
}

/* % da jornada em lições: salão aceso conta cheio; salão pela metade conta o que foi feito. */
function journeyLessonPct(j) {
  let done = 0, total = 0;
  for (const n of journeyNodes(j)) {
    total += n.lessons.length;
    done += S.lit[n.id] ? n.lessons.length : Math.min(S.lessonsDone[n.id] ?? 0, n.lessons.length);
  }
  return total ? Math.round((100 * done) / total) : 0;
}

function continueCardHtml() {
  if (S.resume && !S.lit[S.resume.nodeId]) {
    const n = nodeOf(S.resume.nodeId);
    const j = journeyOfNode(n.id);
    const pct = journeyLessonPct(j);
    return `
      <div class="card continue-card">
        <p class="eyebrow">⭐ continue de onde parou</p>
        <div class="cc-title">${j.title}</div>
        <div class="jm">${n.name} · lição ${S.resume.lessonIx + 1} de ${n.lessons.length}</div>
        <div class="pctbar"><div style="width:${pct}%"></div></div>
        <button class="cta gold" id="continueBtn">▶ continuar — ${pct}%</button>
      </div>`;
  }
  const target = NODES.find((n) => !S.lit[n.id] && nodeUnlockedInJourney(n) &&
    journeyUnlocked(JOURNEYS.indexOf(journeyOfNode(n.id))));
  if (!target) return '';
  const tj = journeyOfNode(target.id);
  const pct = journeyLessonPct(tj);
  return `
    <div class="card continue-card">
      <p class="eyebrow">⭐ ${pct > 0 ? 'continue de onde parou' : 'próxima porta'}</p>
      <div class="cc-title">${tj.title}</div>
      <div class="jm">${target.name} · ${target.place}</div>
      <div class="pctbar"><div style="width:${pct}%"></div></div>
      <button class="cta gold" id="continueBtn2">▶ ${pct > 0 ? `continuar — ${pct}%` : 'entrar'}</button>
    </div>`;
}

function wireContinue() {
  const c1 = $('continueBtn');
  if (c1) c1.addEventListener('click', () => startNode(S.resume.nodeId));
  const c2 = $('continueBtn2');
  if (c2) c2.addEventListener('click', () => {
    const target = NODES.find((n) => !S.lit[n.id] && nodeUnlockedInJourney(n));
    if (target) renderCorridor(journeyOfNode(target.id));
  });
}

/* Home minimalista (feedback do fundador): bibliotecas em cima, continuar embaixo.
   Quem chega olha para cima; quem retorna olha para baixo — as duas convivem. */
function renderLibrary() {
  nav(null, 'biblioteca');
  setProgress(null);
  closeTermBox();
  const lib = PACKAGE.library;
  const due = dueReviews();

  const bibs = lib.domains.map((d) => {
    const { open, soon } = libStats(d);
    const litD = d.status === 'open' ? NODES.filter((n) => S.lit[n.id]).length : 0;
    const sub = d.status === 'open'
      ? `${open} ${open === 1 ? 'jornada aberta' : 'jornadas abertas'} · ${soon} em escrita${litD ? ` · ${litD === 1 ? '1 salão aceso' : litD + ' salões acesos'}` : ''}`
      : `em escrita — ${soon} jornadas planejadas`;
    return `
      <div class="card bib-card ${d.status === 'open' ? '' : 'sealed'}" data-domain="${d.id}" role="button" tabindex="0">
        <div class="domain-head"><span class="di">${d.icon}</span><span class="dt">${d.title}</span></div>
        <div class="dg">${d.tagline}</div>
        <div class="bcount">${sub}</div>
      </div>`;
  }).join('');

  screen().innerHTML = `
    ${due.length ? thoth('Guardião… sinto chamas vacilando. Três minutos e elas ficam suas.', false) + rescueCardHtml(due) : ''}
    <h2 class="serif" style="margin-top:2px">${lib.title}</h2>
    <p class="eyebrow">as bibliotecas do Arquivo</p>
    ${bibs}
    <div class="divider" aria-hidden="true"></div>
    ${continueCardHtml()}
  `;

  wireCommon(due);
  wireContinue();
  screen().querySelectorAll('.bib-card[data-domain]').forEach((card) => {
    const go = () => renderDomain(lib.domains.find((x) => x.id === card.dataset.domain));
    card.addEventListener('click', go);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') go(); });
  });
}

/* Uma biblioteca por vez: estantes com jornadas-livro e, sob cada estante,
   o "em breve" — a antecipação é mecânica de produto (GDD §4.0), e os
   números são sempre honestos: aberto é aberto, em escrita é em escrita. */
function renderDomain(d) {
  nav(renderLibrary, `biblioteca de ${d.title.toLowerCase()}`);
  setProgress(null);
  closeTermBox();
  const due = dueReviews();
  const litD = NODES.filter((n) => S.lit[n.id]).length;

  const shelvesHtml = (d.shelves ?? []).map((sh) => {
    const cards = (sh.journeys ?? []).map((jid) => {
      const j = JOURNEYS.find((x) => x.id === jid);
      const jN = journeyNodes(j);
      const lit = jN.filter((n) => S.lit[n.id]).length;
      const doneJ = lit === jN.length;
      const locked = !journeyUnlocked(JOURNEYS.indexOf(j));
      const lessons = jN.reduce((a, n) => a + n.lessons.length, 0);
      const mins = Math.max(5, Math.round((lessons * 4) / 5) * 5);
      if (locked) {
        return `<div class="jbook sealed">
          <div class="jb-title">${j.title}</div>
          <div class="jm">🔒 conclua “${JOURNEYS[JOURNEYS.indexOf(j) - 1].title}” para abrir</div>
        </div>`;
      }
      const pct = journeyLessonPct(j);
      return `<div class="jbook ${doneJ ? 'done' : ''}" data-journey="${j.id}" role="button" tabindex="0">
        <div class="jb-title">${j.title}</div>
        <div class="jb-q">${j.centralQuestion}</div>
        <div class="jb-stats">🚪 ${jN.length} salões · 📖 ${lessons} lições · ⏱ ~${mins} min</div>
        ${doneJ
          ? `<div class="jm"><span class="selo">✔ jornada concluída</span> <span>${jN.map((n) => n.emblem ?? '🔥').join(' ')}</span></div>`
          : `<div class="pctbar"><div style="width:${pct}%"></div></div>
             <div class="jb-cta">▶ ${pct > 0 ? `continuar — ${pct}%` : 'começar'}</div>`}
      </div>`;
    }).join('');
    const soon = (sh.upcoming ?? []).length ? `
      <div class="soon">
        <p class="eyebrow">em breve nesta estante</p>
        ${(sh.upcoming ?? []).map((u) => `<div class="soon-row"><span>${u.icon}</span>${u.title}</div>`).join('')}
      </div>` : '';
    return `<div class="shelf-title"><span>${sh.icon}</span>${sh.title}</div>${cards}${soon}`;
  }).join('');

  screen().innerHTML = `
    ${rescueCardHtml(due)}
    <div class="domain-head big"><span class="di">${d.icon}</span><span class="dt">${d.title}</span></div>
    <div class="dg">${d.tagline}${d.status === 'open' && litD ? ` · ${litD === 1 ? '1 salão aceso' : litD + ' salões acesos'}` : ''}</div>
    ${d.status === 'open' ? '' : `<div class="card domain-sealed"><div class="sealed-note">🔒 ${d.teaser ?? 'ala em escrita'} — os escribas já trabalham nas jornadas abaixo.</div></div>`}
    ${shelvesHtml}
  `;

  wireCommon(due);
  screen().querySelectorAll('.jbook[data-journey]').forEach((card) => {
    const go = () => renderCorridor(JOURNEYS.find((x) => x.id === card.dataset.journey));
    card.addEventListener('click', go);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') go(); });
  });
}

/* O Corredor: a timeline de UMA jornada — não a home (feedback do fundador). */
function renderCorridor(j) {
  j = j ?? currentJourney();
  nav(() => renderDomain(domainOfJourney(j.id)), j.title.toLowerCase());
  setProgress(null);
  closeTermBox();
  const jN = journeyNodes(j);
  const due = dueReviews();
  const dueNodeIds = new Set(due.map((d) => d.nodeId));
  const done = journeyDone(j);
  const litInJ = jN.filter((n) => S.lit[n.id]).length;
  const target = jN.find((n) => !S.lit[n.id] && nodeUnlockedInJourney(n));
  const nextJ = j.next ? JOURNEYS.find((x) => x.id === j.next.journey) : null;

  const say = due.length
    ? 'As chamas vacilantes primeiro, Guardião — três minutos bastam.'
    : done
      ? `A ala “${j.title}” inteira está acesa. ${nextJ ? 'E olha: a porta da próxima ala já range.' : 'A Biblioteca guarda as próximas portas.'}`
      : litInJ === 0
        ? `Uma ala nova, Guardião: ${j.title}. A primeira porta aberta é ${target ? target.place : jN[0].place}. Vamos?`
        : `A porta de ${target ? target.place : '…'} está aberta.${target && (S.lessonsDone[target.id] ?? 0) > 0 ? ' Sua lição espera onde você parou.' : ''}`;

  let rows = '';
  for (const node of jN) {
    const lit = !!S.lit[node.id];
    if (!lit && !nodeUnlockedInJourney(node)) {
      const prev = nodeOf(j.nodeOrder[j.nodeOrder.indexOf(node.id) - 1]);
      rows += eraRow(node.place, 'sealed',
        `<div class="sealed-note">selada — acende quando ${prev.place} estiver iluminada</div>`);
      continue;
    }
    const doneLessons = S.lessonsDone[node.id] ?? 0;
    const nodeDue = dueNodeIds.has(node.id);
    const scheduled = node.claims.filter((c) => S.reviews[c.id]).map((c) => S.reviews[c.id].dueAt);
    const nextDue = scheduled.length ? Math.min(...scheduled) : null;
    const status = lit
      ? nodeDue
        ? 'memória vacilando — reacenda'
        : `Compreendido · chama acesa${nextDue ? ` · revisão em ${Math.max(1, Math.ceil((nextDue - now()) / DAY))}d` : ''}`
      : doneLessons > 0
        ? `Lição ${doneLessons + 1} de ${node.lessons.length} · continuar`
        : `Missão · lição 1 de ${node.lessons.length}`;
    rows += eraRow(node.place, lit ? 'lit' : 'open', `
      <div class="node-card ${lit ? 'lit' : ''}" data-node="${node.id}" role="button" tabindex="0" aria-label="${node.name}">
        <div>
          <div class="nm">${node.name}</div>
          ${lit ? '' : `<div class="pips">${'🔥'.repeat(doneLessons)}${'🕯️'.repeat(node.lessons.length - doneLessons)}</div>`}
          <div class="st"${nodeDue ? ' style="color:var(--flame)"' : ''}>${status}</div>
        </div>
        <div class="flame ${lit ? (nodeDue ? 'waver' : 'on') : ''}" style="font-size:22px">${lit ? '🔥' : '🕯️'}</div>
      </div>`, lit ? (node.emblem ?? '🔥') : null);
  }
  if (done) {
    rows += nextJ
      ? eraRow(nextJ.title, 'open', `
          <div class="node-card" data-nextj="${nextJ.id}" role="button" tabindex="0">
            <div><div class="nm">➡ próxima ala</div><div class="st">${nextJ.centralQuestion}</div></div>
            <div style="font-size:22px">🚪</div>
          </div>`)
      : eraRow('…', 'sealed', `<div class="sealed-note">${j.comingNext}</div>`);
  }

  const missionCard = !done && target ? `
    <div class="card mission-card">
      <p class="eyebrow">${due.length ? 'depois, se quiser' : 'missão de hoje'}</p>
      <div class="mn">${target.name}</div>
      <button class="cta ${due.length ? 'ghost' : 'gold'}" id="missionBtn">▶ ${
        (S.lessonsDone[target.id] ?? 0) > 0 ? 'continuar de onde parei' : 'começar agora'
      }</button>
    </div>` : '';

  screen().innerHTML = `
    ${thoth(say, done && !due.length)}
    ${rescueCardHtml(due)}
    ${missionCard}
    <div class="card journey-head">
      <p class="eyebrow">jornada</p>
      <div class="q">${j.centralQuestion}</div>
      <div class="prog">${j.title} · ${litInJ} de ${jN.length} salões acesos</div>
    </div>
    <div class="mural" aria-label="o caminho construído nesta ala">${
      jN.map((n) => {
        const st = S.lit[n.id] ? 'lit' : (target && n.id === target.id) ? 'next' : '';
        return `<div class="arch ${st}" title="${n.place}">${S.lit[n.id] ? (n.emblem ?? '🔥') : ''}</div>`;
      }).join('')
    }</div>
    <div role="list">${rows}</div>
  `;

  wireCommon(due);
  const missionBtn = $('missionBtn');
  if (missionBtn && target) missionBtn.addEventListener('click', () => startNode(target.id));
  screen().querySelectorAll('.node-card[data-node]:not(.lit)').forEach((card) => {
    if (target && card.dataset.node === target.id && !due.length) card.classList.add('pulse');
    const go = () => startNode(card.dataset.node);
    card.addEventListener('click', go);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') go(); });
  });
  const nextDoor = screen().querySelector('[data-nextj]');
  if (nextDoor) nextDoor.addEventListener('click', () => renderCorridor(JOURNEYS.find((x) => x.id === nextDoor.dataset.nextj)));
}

/* ---------- o pergaminho de Thoth (diário da dupla) ---------- */
function renderPergaminho() {
  nav(renderLibrary, 'pergaminho de Thoth');
  setProgress(null);
  if (!S.startedAt) { S.startedAt = Date.now(); persist(); }
  const days = Math.max(1, Math.ceil((Date.now() + S.timeShift - S.startedAt) / DAY));
  const litNodes = NODES.filter((n) => S.lit[n.id]);
  const st = thothStage();
  stepScreen(`
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
      ${thothAvatar()}
      <h2>${THOTH_STAGES[st - 1]}</h2>
      <p class="eyebrow">guardando memórias com você há ${days === 1 ? '1 dia' : days + ' dias'}</p>
    </div>
    ${litNodes.length === 0
      ? `<div class="card"><p class="serif" style="font-style:italic; color:var(--ink-soft)">O pergaminho ainda está em branco. Nossa história começa no primeiro salão que acendermos juntos, Guardião.</p></div>`
      : `<p class="eyebrow">o que desenhei até aqui</p>` + litNodes.map((n, i) => `
        <div class="diary-entry fade-in" style="animation-delay:${i * 0.15}s">
          <div class="de-emblem">${n.emblem ?? '🔥'}</div>
          <div>
            <div class="de-place">${n.place}</div>
            <div class="de-name">${n.name}</div>
          </div>
        </div>`).join('')}
    <button class="cta" id="go">voltar</button>`);
  $('go').addEventListener('click', renderLibrary);
}

/* ---------- cerimônia de evolução (marcos reais, nunca XP bruto) ---------- */
function maybeEvolve(next) {
  const st = thothStage();
  if (st <= (S.thothStageSeen ?? 1)) { next(); return; }
  S.thothStageSeen = st;
  persist();
  nav(null, null);
  setProgress(null);
  stepScreen(`
    <div class="celebrate">
      <div class="evolve-avatar thoth s${st}">📜${st > 1 ? `<span class="tbadge" style="font-size:17px">${st === 2 ? '✒️' : '🖋️'}</span>` : ''}</div>
      <p class="eyebrow fade-in" style="animation-delay:.4s">seu companheiro evoluiu</p>
      <h1 class="fade-in" style="animation-delay:.6s">${THOTH_STAGES[st - 1]}</h1>
      <div class="fade-in" style="animation-delay:1.3s; width:100%; text-align:left">${thoth(st === 2
        ? 'Guardião… minha pena mudou. Uma jornada inteira no pergaminho — eu não era capaz de desenhar assim antes de você. O Arquivo me deu um selo novo.'
        : 'Duas jornadas completas. Os outros escribas agora me chamam de Escriba do Arquivo — mas nós dois sabemos de quem são essas chamas.', true)}</div>
      <div class="mural small fade-in" style="animation-delay:2s">${NODES.filter((n) => S.lit[n.id]).map((n) =>
        `<div class="arch lit">${n.emblem ?? '🔥'}</div>`).join('')}</div>
      <button class="cta gold fade-in" style="animation-delay:2.5s" id="go">continuar</button>
    </div>`);
  $('go').addEventListener('click', next);
}

/* ---------- missão de revisão (memória se apagando — GDD §3.2/§6) ---------- */
function startReviewMission(due) {
  S.nodeXp = 0;
  let ix = 0;
  const nextOne = () => {
    if (ix >= due.length) { finishReviewMission(); return; }
    const item = due[ix++];
    const node = nodeOf(item.nodeId);
    const claim = node.claims.find((c) => c.id === item.claimId);
    const variant = claim.reviewVariants[0]; // formato ≠ da lição (GDD §6.4)
    setProgress(Math.round((ix / (due.length + 1)) * 100));
    nav(renderLibrary, `resgate · ${ix}/${due.length}`);
    stepScreen(`<p class="eyebrow">${node.place} · memória se apagando · ${ix} de ${due.length}</p><div class="card" id="ic"></div>`);
    renderInteraction(variant, node, $('ic'), () => {
      const r = S.reviews[item.claimId];
      r.step = (r.step ?? 0) + 1;
      r.dueAt = now() + (r.step === 1 ? 14 : 45) * DAY; // intervalo cresce a cada resgate
      persist();
      nextOne();
    }, 2);
  };
  nextOne();
}

function finishReviewMission() {
  nav(null, null);
  setProgress(null);
  stepScreen(`
    <div class="celebrate">
      <div class="big-flame flame on">🔥</div>
      <h1 class="fade-in" style="animation-delay:.3s">Chamas firmes novamente</h1>
      <div class="fade-in" style="animation-delay:1s; width:100%; text-align:left">${thoth('É assim que uma memória vira sua para sempre: voltando a ela na hora certa. As próximas revisões ficam cada vez mais raras — sinal de que ela está segura.', true)}</div>
      <div class="fade-in" style="animation-delay:1.7s"><span class="xp-chip">+${S.nodeXp} XP — em dobro</span></div>
      <button class="cta fade-in" style="animation-delay:2.1s" id="go">voltar à Biblioteca</button>
    </div>`);
  S.nodeXp = 0; persist();
  $('go').addEventListener('click', renderLibrary);
}

function eraRow(name, state, inner = '', glyph = null) {
  const dot = glyph ?? (state === 'lit' ? '🔥' : state === 'open' ? '◈' : '·');
  return `<div class="era-row ${state}" role="listitem">
    <div class="rail"><div class="node-dot">${dot}</div><div class="seg"></div></div>
    <div class="era-info"><div class="era-name">${name}</div>${inner}</div>
  </div>`;
}

/* ---------- player genérico de lição ---------- */
let steps = [], stepIx = 0;
function playSteps(list) { steps = list; stepIx = 0; nextStep(); }
function nextStep() {
  if (stepIx >= steps.length) return;
  const step = steps[stepIx++];
  setProgress(Math.round((stepIx / steps.length) * 100));
  step();
}
function stepScreen(html) { screen().innerHTML = html; screen().scrollTop = 0; }

function startNode(nodeId) {
  const node = nodeOf(nodeId);
  startLesson(node, S.lessonsDone[node.id] ?? 0);
}

function startLesson(node, lessonIx) {
  const lesson = node.lessons[lessonIx];
  const j = journeyOfNode(node.id);
  const chip = `salão ${j.nodeOrder.indexOf(node.id) + 1}/${j.nodeOrder.length} · lição ${lessonIx + 1}/${node.lessons.length}`;
  // Retorno perfeito: o Arquivo lembra exatamente onde você está
  S.resume = { nodeId: node.id, lessonIx };
  persist();

  const eyebrow = `${node.place} · lição ${lessonIx + 1} de ${node.lessons.length}`;

  const first = lesson.interactions[0];
  const hookDecision = first && first.type === 'situated_decision' ? first : null;
  const rest = hookDecision ? lesson.interactions.slice(1) : lesson.interactions;
  // Ritmo (feedback do playtest): nunca três telas de leitura seguidas —
  // a primeira pergunta entra ANTES dos ecos, quebrando o bloco de leitura.
  const firstInter = rest.length ? [rest[0]] : [];
  const remaining = rest.slice(1);

  const list = [];
  const withNav = (fn) => () => { nav(() => renderCorridor(j), chip); fn(); };

  list.push(withNav(() => {
    stepScreen(`
      <p class="eyebrow">${eyebrow}</p>
      <h1>${lesson.title}</h1>
      <div class="card">
        <p class="serif">${gloss(lesson.hook)}</p>
        ${hookDecision ? `<div id="hd"></div>` : ''}
      </div>
      ${hookDecision ? '' : '<button class="cta" id="go">continuar</button>'}`);
    if (hookDecision) renderSituated(hookDecision, $('hd'), nextStep);
    else $('go').addEventListener('click', nextStep);
  }));

  for (const paragraph of lesson.narrative) {
    list.push(withNav(() => {
      stepScreen(`
        <p class="eyebrow">${eyebrow}</p>
        <div class="card"><p class="serif">${gloss(paragraph)}</p></div>
        <button class="cta" id="go">continuar</button>`);
      $('go').addEventListener('click', nextStep);
    }));
  }

  for (const inter of firstInter) {
    list.push(withNav(() => {
      stepScreen(`<p class="eyebrow">${node.place} · ${interactionEyebrow(inter)}</p><div class="card" id="ic"></div>`);
      renderInteraction(inter, node, $('ic'), nextStep);
    }));
  }

  if (lesson.echoes && lesson.echoes.length) {
    list.push(withNav(() => {
      stepScreen(`
        <p class="eyebrow">${node.place} · ecos do Corredor</p>
        ${lesson.echoes.map((e, i) => {
          const src = nodeOf(e.node);
          return `<div class="card eco fade-in" style="animation-delay:${i * 0.4}s">
            <p class="eyebrow">🔥 eco de ${src ? src.place : e.node}${src && S.lit[src.id] ? ' — um salão que você acendeu' : ''}</p>
            <p class="serif">${gloss(e.text)}</p>
          </div>`;
        }).join('')}
        <button class="cta" id="go">continuar</button>`);
      $('go').addEventListener('click', nextStep);
    }));
  }

  for (const inter of remaining) {
    list.push(withNav(() => {
      stepScreen(`<p class="eyebrow">${node.place} · ${interactionEyebrow(inter)}</p><div class="card" id="ic"></div>`);
      renderInteraction(inter, node, $('ic'), nextStep);
    }));
  }

  list.push(withNav(() => {
    stepScreen(`
      <p class="eyebrow">${node.place} · lição ${lessonIx + 1} concluída</p>
      <h2>Agora você entende melhor:</h2>
      <div class="card connections">
        ${lesson.connection.split('✔').map((x) => x.trim()).filter(Boolean)
          .map((x, i) => `<div class="cx" style="animation-delay:${0.1 + i * 0.35}s"><span class="tick">✔</span> ${x}</div>`).join('')}
      </div>
      <button class="cta gold" id="go">acender esta chama</button>`);
    $('go').addEventListener('click', () => renderLessonComplete(node, lessonIx));
  }));

  playSteps(list);
}

/* Marco por lição (feedback do playtest): a cada poucos minutos, um lugar
   alcançado — e a câmera SEMPRE volta ao Corredor entre lições. */
function renderLessonComplete(node, lessonIx) {
  const done = lessonIx + 1;
  S.lessonsDone[node.id] = done;
  const total = node.lessons.length;
  if (done >= total) {
    S.resume = null;
    persist();
    celebrateNode(node);
    return;
  }
  S.resume = { nodeId: node.id, lessonIx: done };
  persist();
  nav(null, null);
  setProgress(null);
  stepScreen(`
    <div class="celebrate">
      <div class="milestone-pips fade-in">${'🔥'.repeat(done)}${'🕯️'.repeat(total - done)}</div>
      <h2 class="fade-in" style="animation-delay:.3s">Chama ${done} de ${total} acesa<br>no salão de ${node.place}</h2>
      <div class="fade-in" style="animation-delay:.9s; width:100%; text-align:left">${thoth('Marco registrado no pergaminho, Guardião. Respira — o Corredor guarda seu lugar.', true)}</div>
      <button class="cta gold fade-in" style="animation-delay:1.4s" id="go">voltar ao Corredor</button>
    </div>`);
  $('go').addEventListener('click', () => renderCorridor(journeyOfNode(node.id)));
}

/* Retorno perfeito: quem volta nunca precisa descobrir onde parou. */
function renderWelcomeBack() {
  const r = S.resume;
  const node = nodeOf(r.nodeId);
  const j = journeyOfNode(node.id);
  const remainingSaloes = journeyNodes(j).filter((n) => !S.lit[n.id]).length;
  nav(null, null);
  setProgress(null);
  stepScreen(`
    <p class="eyebrow">bem-vindo de volta, Guardião</p>
    ${thoth(`Guardei tudo exatamente onde você deixou: <b>${node.place}</b>, lição ${r.lessonIx + 1} de ${node.lessons.length}. ${remainingSaloes === 1 ? 'Falta só este salão para concluir a jornada.' : `Faltam ${remainingSaloes} salões nesta jornada.`}`)}
    <button class="cta gold" id="go">▶ continuar de onde parei</button>
    <button class="cta ghost" id="map">ver a Biblioteca</button>`);
  $('go').addEventListener('click', () => startNode(node.id));
  $('map').addEventListener('click', renderLibrary);
}

function interactionEyebrow(inter) {
  return {
    causal: 'pergunta causal',
    counterfactual: 'e se…?',
    situated_decision: 'sua decisão',
    source_interpretation: 'a história em disputa',
    application: 'aplicação',
    causal_ordering: 'causa e efeito',
    connection: 'conexões',
  }[inter.type] ?? 'desafio';
}

function renderSituated(inter, host, onDone) {
  host.innerHTML = `
    <p><b>${gloss(inter.prompt)}</b></p>
    ${(inter.options ?? []).map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
    <div id="sfb"></div>`;
  host.querySelectorAll('.opt').forEach((b) =>
    b.addEventListener('click', () => {
      host.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
      b.classList.add('picked-right');
      host.querySelector('#sfb').innerHTML = `
        <div class="annotation">${gloss(inter.errorPath)}</div>
        <button class="cta" id="sgo">continuar</button>`;
      host.querySelector('#sgo').addEventListener('click', onDone);
    }));
}

function renderInteraction(inter, node, host, onDone, xpMult = 1) {
  const claim = node.claims.find((c) => c.id === inter.claimId);

  if (!inter.objective && claim && claim.debate) {
    host.innerHTML = `
      <span class="chip">Interpretação historiográfica</span>
      <p class="serif">${gloss(claim.debate.question)}</p>
      <div class="consensus-badge">Nível de consenso <span class="pct">${claim.consensusPct}%</span></div>
      <button class="debate-btn" id="whyBtn">Por que existe debate sobre este assunto?</button>
      <div id="panel"></div>`;
    host.querySelector('#whyBtn').addEventListener('click', () => {
      host.querySelector('#panel').innerHTML = `
        <div class="debate-panel">
          ${claim.debate.positions.map((p) =>
            `<div class="position">${gloss(p.view)}<span class="acc">${p.acceptance}</span></div>`).join('')}
          <button class="cta" id="dgo">fascinante — seguir</button>
        </div>`;
      host.querySelector('#dgo').addEventListener('click', onDone);
    });
    return;
  }

  if (!inter.objective) { renderSituated(inter, host, onDone); return; }

  let attempts = 0;
  host.innerHTML = `
    <p><b>${gloss(inter.prompt)}</b></p>
    ${(inter.options ?? []).map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
    <div id="fb"></div>`;
  host.querySelectorAll('.opt').forEach((b) =>
    b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      const fb = host.querySelector('#fb');
      if (i === inter.correct) {
        host.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
        b.classList.add('picked-right');
        fb.innerHTML = verdictRight();
        gainXp((attempts === 0 ? 10 : 5) * xpMult, fb); // GDD §5.1: recuperar vale, e vale menos
        fb.insertAdjacentHTML('beforeend', '<button class="cta" id="go">continuar</button>');
        host.querySelector('#go').addEventListener('click', onDone);
      } else {
        attempts++;
        b.classList.add('picked-annotate'); b.disabled = true;
        fb.innerHTML = `${verdictMiss()}<div class="annotation"><b>O porquê:</b> ${gloss(inter.errorPath)} Tente de novo.</div>`;
      }
    }));
}

/* ---------- celebrações (ordem GDD §9) ---------- */
function celebrateNode(node) {
  nav(null, null);
  S.lit[node.id] = true;
  // Nó compreendido: afirmações objetivas entram no agendador (revisão em ~3 dias)
  for (const c of node.claims) {
    if (c.reviewVariants && c.reviewVariants.length && !S.reviews[c.id]) {
      S.reviews[c.id] = { nodeId: node.id, dueAt: now() + 3 * DAY, step: 0 };
    }
  }
  persist();
  setProgress(100);
  const j = journeyOfNode(node.id);
  const isLast = journeyDone(j);
  const totalLit = NODES.filter((n) => S.lit[n.id]).length;
  const say = totalLit === 1
    ? 'Nosso primeiro salão! Desenhei uma coluna grega no meu pergaminho. 🏛️'
    : isLast
      ? 'Mais um fio inteiro no pergaminho, Guardião. Minha pena está ficando pesada de história.'
      : `${node.place} no pergaminho. O Corredor está cada vez menos escuro — e a próxima porta já range.`;

  stepScreen(`
    <div class="celebrate">
      <div class="big-flame flame on">🔥</div>
      <h1 class="fade-in" style="animation-delay:.4s">${node.name}<br>acendeu no Corredor</h1>
      <div class="fade-in" style="animation-delay:1.1s; width:100%; text-align:left">${thoth(say, true)}</div>
      <div class="card connections fade-in" style="animation-delay:1.9s; width:100%; text-align:left">
        <p class="eyebrow">este conhecimento se conecta a</p>
        ${node.connections.map((c, i) =>
          `<div class="cx" style="animation-delay:${2.1 + i * 0.3}s"><span class="tick">✔</span> ${prettify(c.to)}</div>`).join('')}
      </div>
      <div class="fade-in" style="animation-delay:3.1s"><span class="xp-chip">+${S.nodeXp} XP neste salão</span></div>
      <button class="cta fade-in" style="animation-delay:3.5s" id="go">${isLast ? 'a pergunta final' : 'voltar ao Corredor'}</button>
    </div>`);
  S.nodeXp = 0;
  $('go').addEventListener('click', () => (isLast ? renderSynthesis(j) : renderCorridor(j)));
}

/* ---------- momento de síntese (regra de prontidão da jornada) ---------- */
function renderSynthesis(j) {
  const syn = j.synthesis;
  if (!syn) { celebrateJourney(j); return; }
  nav(null, 'síntese');
  setProgress(null);
  stepScreen(`
    <p class="eyebrow">síntese · a pergunta que atravessa a jornada</p>
    <div class="card" id="ic"></div>`);
  renderInteraction(syn.question, { claims: [] }, $('ic'), () => renderReframe(j));
}

function renderReframe(j) {
  const syn = j.synthesis;
  stepScreen(`
    <p class="eyebrow">síntese · o que mudou no seu olhar</p>
    ${syn.reframe.map((p, i) =>
      `<div class="card fade-in" style="animation-delay:${i * 0.5}s"><p class="serif">${gloss(p)}</p></div>`).join('')}
    <div class="card shift fade-in" style="animation-delay:${syn.reframe.length * 0.5 + 0.3}s">
      <div class="shift-row before"><span class="eyebrow">como você chegou</span><p>${syn.shift.before}</p></div>
      <div class="shift-arrow">↓</div>
      <div class="shift-row after"><span class="eyebrow">como você sai</span><p class="serif"><b>${syn.shift.after}</b></p></div>
    </div>
    <button class="cta gold fade-in" style="animation-delay:${syn.reframe.length * 0.5 + 0.9}s" id="go">agora sim — ver a jornada</button>`);
  $('go').addEventListener('click', () => celebrateJourney(j));
}

function celebrateJourney(j) {
  setProgress(null);
  S.events.push({ t: Date.now(), e: 'journey_complete', j: j.id });
  persist();
  const jNodes = journeyNodes(j);
  const claims = jNodes.reduce((sum, n) => sum + n.claims.length, 0);
  const nextJ = j.next ? JOURNEYS.find((x) => x.id === j.next.journey) : null;

  const nextCard = nextJ
    ? `
      <div class="card fade-in" style="animation-delay:1.6s; width:100%; text-align:left">
        <p class="eyebrow">mas…</p>
        <p class="serif"><b>${j.next.provocation}</b></p>
        <button class="cta gold" id="discoverBtn" style="margin-top:8px">▶ descobrir</button>
      </div>
      <button class="cta ghost fade-in" style="animation-delay:2.2s" id="go">por hoje chega — fechar a sessão</button>`
    : `
      <div class="card fade-in" style="animation-delay:1.6s; width:100%; text-align:left">
        <p class="eyebrow">o Arquivo continua</p>
        <p class="serif">${j.comingNext}</p>
      </div>
      <button class="cta gold fade-in" style="animation-delay:2.2s" id="go">fechar a sessão</button>`;

  stepScreen(`
    <div class="celebrate">
      <div class="jcard fade-in">
        <p class="eyebrow">jornada concluída</p>
        <div class="jt">${j.title}</div>
        <div class="mural small">${journeyNodes(j).map((n) =>
          `<div class="arch lit" title="${n.place}">${n.emblem ?? '🔥'}</div>`).join('')}</div>
        <div class="thread">${j.thread ?? ''}</div>
        <div class="stats">
          <div class="stat"><b>${jNodes.length}</b><span>salões acesos</span></div>
          <div class="stat"><b>${claims}</b><span>memórias guardadas</span></div>
          <div class="stat"><b>${S.xp}</b><span>xp</span></div>
        </div>
      </div>
      <div class="fade-in" style="animation-delay:.8s; width:100%; text-align:left">
        ${thoth('Você respondeu a pergunta da jornada, Guardião: <b>' + j.centralQuestion + '</b>', true)}
      </div>
      ${nextCard}
    </div>`);
  const discover = $('discoverBtn');
  if (discover && nextJ) discover.addEventListener('click', () => {
    S.events.push({ t: Date.now(), e: 'next_journey_via_provocation', j: nextJ.id });
    persist();
    maybeEvolve(() => renderCorridor(nextJ)); // evolução antes da nova ala se abrir
  });
  const go = $('go');
  if (go) go.addEventListener('click', () => {
    S.events.push({ t: Date.now(), e: 'session_closed_after_journey', j: j.id });
    persist();
    maybeEvolve(renderSessionClose);
  });
}

function renderSessionClose() {
  stepScreen(`
    <p class="eyebrow">até amanhã, Guardião</p>
    ${thoth('Vou guardar as memórias desta sessão com cuidado. Em <b>3 dias</b> as chamas vão querer vacilar — e eu te chamo para reacendê-las. É assim que elas viram suas para sempre.')}
    <button class="cta" id="go">voltar à Biblioteca</button>`);
  $('go').addEventListener('click', renderLibrary);
}

refreshXp();
document.getElementById('skipDays').addEventListener('click', (e) => {
  e.preventDefault();
  S.timeShift += 3 * DAY;
  persist();
  renderLibrary();
});
document.getElementById('resetBtn').addEventListener('click', (e) => {
  e.preventDefault();
  Object.assign(S, { xp: 0, lit: {}, lessonsDone: {}, nodeXp: 0, reviews: {}, timeShift: 0, events: [], thothStageSeen: 1, resume: null, startedAt: null });
  try { localStorage.removeItem(STORE_KEY); } catch {}
  refreshXp(); renderCorridor(JOURNEYS[0]);
});
$('backBtn').addEventListener('click', () => { if (NAV_BACK) NAV_BACK(); });
// Primeiro uso: guiado direto ao Corredor (sem parede de escolha — VISION §17-D1);
// quem retorna cai na Biblioteca; quem parou no meio, no retorno perfeito.
const totalLitBoot = NODES.filter((n) => S.lit[n.id]).length;
if (S.resume && !S.lit[S.resume.nodeId]) renderWelcomeBack();
else if (totalLitBoot > 0 || Object.keys(S.lessonsDone).length > 0) renderLibrary();
else renderCorridor(JOURNEYS[0]);
</script>
